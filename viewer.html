   "body": "\n[--- 1943-10-02_tom-to-mom_p01.jpg ---]\n\n                                                  Saturday\n                                                  Oct. 2, 1943\nDear Mum,\n     I really should keep a record of when I write because I usually have no\nidea how far apart my letters are. Of course, this time I know it has been\nquite a few days since I last wrote and I am sorry.\n\n     Received your letter of the 24th to-day. It is the one with the farming\npictures. I especially like the one of you. The only other one I have of you\nis that one taken while waiting for the street car at Cannonsburg. You looked\na little thin & tired. In this picture you look more like yourself. Whether\nyou like it or not, your face is much fuller and I think it is a better\npicture.\n\n[--- 1943-10-02_tom-to-mom_p02.jpg ---]\n\nI hope the other pictures weren't in that batch that was lost. I haven't\nreceived them yet.\n\n     You and Aunt Bess are much better at time than I am. It took me 15\nminutes to check your figures and I agree with them. I never thought much\nabout it before but does seem strange.\n\n     It sounded like a grand party at Moshers. Were you celebrating anything in\nparticular. You must play poker like I do. John & George inherited their\npoker sense from Dad, I got mine from you. I very seldom win. I am thankful\nthat I can either take it or leave it alone. Schwalbach, Hofmann, and myself\nplay some complicated game every now and\n\n[--- 1943-10-02_tom-to-mom_p03.jpg ---]\n\nthen. It is a German game - American name is Sheepshead. Practically every\nthing is trump and some low cards are high - all mixed up. The stakes are\nsmall - I won the last two nights. Net gain is about 50¢. Sort of got side\ntracked. How is Adam & Dorthy? I haven't heard from them for a long time.\nSuppose I will have to write to them again.\n\n     I am afraid Hofmann and I aren't related. We had an argument the other\nnight and I still think he spells his name wrong - should be Hoffman. He is a\nbit obstinate and won't agree.\n\n     Schwalbach was just reading a letter from his wife. She received (or\nbought) a table cloth and napkins worth $50 and he thinks it is a lot\n\n[--- 1943-10-02_tom-to-mom_p04.jpg ---]\n\nof dough to put into something to wipe his mouth. He now uses the back of his\nhand. I told him he will never see them - she will keep them tucked away for\nsome special occasion which never arrives.\n\n     I received a nice letter from Aunt Harriet the other day. She said she is\nkeeping one eye open for a mate for me. The type she described will be hard\nto find but I hope she has some luck.\n\n     Sorry this is all for now. Will write often when possible.\n                                        Love,\n                                             Tom\n\n(Expect to send a check home soon)\n\n[Written at bottom left:] [En]s. Thos. F. Beck\n",

   "body": "\n[--- 1943-10-09_tom-to-john-and-fran_p01.jpg ---]\n\n                                                  Oct. 9-43\nDear John & Fran,\n     Received your letter, note, & picture all in one day. For some unknown\nreason your letter, along with Isabel's, was held up about a week. Anyway, I\nwas very glad to hear from you. That was the first picture of the wedding I\nhave received. I really enjoy it so thanks a lot. You know I am after all the\npictures, mostly the family, I can get so send along any spares you have. I\nhave bragged of what a beautiful sister-in-law I have but maybe a single\npicture wouldn't be proper.\n\n     I am anxious to see your home now that it is all fixed up. It must take a\nlot of planning to fix a house\n\n[--- 1943-10-09_tom-to-john-and-fran_p02.jpg ---]\n\nwhen you can't use either rugs or curtains. John must be a bit pessimistic\nabout the oil future to be building a coal cellar.\n\n     You will have to break that resolution about inviting guests for\nbreakfast because I am looking forward to some nice light waffles. Of course I\nneither stay up late nor get up early so my breakfast will be around noon. My\nbreakfast now consists of either powder eggs or pancakes (collision mats)\nwhich would definately help the shoe situation back home.\n\n     You trip to New York sounded nice even the races. No doubt your last trip\nto the convention was also a lot of fun. Personally, I think\n\n[--- 1943-10-09_tom-to-john-and-fran_p03.jpg ---]\n\nNew York is a grand place and some day I plan to spend a week or so there\nhitting the high spots. Shore duty there would really be something.\n\n     There is nothing new out here. It is the same routine every day which\ngets very tiresome. There is so much scuttlebutt about our relief that I\nbelieve very little I hear. It makes good conversation, however.\n\n     Write when you find time and I will see what I can do about answering.\n                                        Love,\n                                             Tom\n\n[Written at bottom left:] Ens Thos. F. Beck\n",

   "body": "\n[--- 1943-11-08_tom-to-mum_p01.jpg ---]\n\n                                                  Nov. 8 - 43\nDear Mum,\n     There isn't much to say & I haven't much time so this will be short.\n\n     I received the first package and thanks a million. I haven't had time to\nread it but I know it will be good. Again thanks.\n\n     I am sorry to say the pictures never arrived and I think they have had\nplenty of time by now. It is too bad because I wanted to see them.\n\n     The Air Mail is still not coming through as it should. Perhaps it will be\nback on schedule in a few weeks.\n\n     This is a damn poor letter but the best I can do at the present.\n                                        Love,\n                                             Tom\n\n[Written at bottom left:] Ens. Thos. F. Beck\n",

   "body": "\n[--- 1943-11-27_tom-to-mum_p01.jpg ---]\n\n                                                  27 Nov. 43\nDear Mum,\n     There is nothing startling occurring around here but I haven't written\nfor a few days. I did receive a letter from you yesterday. Only one package\nhas come through so far.\n\n     There is a good movie to-night, Bob Hope, and there is also a game of\nskill being formed. I think I will take in the game since pay day is coming\nsoon. I hope I have better luck to-night than the last time.\n\n     I will enclose a request for Ernie Pyle's book in a future letter. I also\nintend to write to John soon about income tax, etc.\n\n[--- 1943-11-27_tom-to-mum_p02.jpg ---]\n\n     We had a good Thanksgiving dinner and I really stuffed myself. We had\nturkey, oyster stew, stuffing, olives, mashed potatoes, and cranberries, which\nare [crossed out: rare] and still don't like. It was a good meal and tho' not\neaten under the best circumstances I think we all have a lot to be thankful\nfor. There are many much worse off than I am.\n\n     I hope you enjoyed you Thanksgiving whether spent at Lewisburg, Butler, or\nhome. I was thinking of you all at that time especially.\n                                        Love,\n                                             Tom\n\n[Written at bottom left:] [En]s. Thos. F. Beck\n",

   "complete": true,
   "notes": "A memorial was dedicated in Chicora, PA, probably across from Dick Gaisford's (compare the 1943-05-11 letter about Dad's picture for the school; possibly related to Dad). Tom hasn't seen 'white civilians' since leaving the States. Henry has moved from Africa to Italy, and Bill (Janny's) may be going across the Atlantic. Tom expects to finish 18 months in the Pacific, then serve Atlantic duty, then return. He dined with Glenn Scott on Scott's ship and accidentally told him about 'Jack' (apparently bad news the Scott family had withheld). MOTHER IS NOW A COMPANY DIRECTOR ('How do you like being a big director... did we make any money?'), probably of a family business with employees (compare 'Pres. of Beck, Inc.', 1943-04-15). Packages came from Frazier-McCafferty (a business?), Aunt Lyde, and Isabel, plus Mother's fruitcake and the slippers he requested. He wonders how he will have changed when he gets home.",

   "body": "\n[--- 1943-12-06_tom-to-mum_p01.jpg ---]\n\n                                                  Dec. 6 - 43\nDear Mum,\n     I was quite fortunate to-day and received 8 letters, yours among them.\nYou thought it would arrive at Thanksgiving time and was [crossed out] only a\nfew weeks off.\n\n     The memorial dedication sounded like a big affair. The picture of it was\ngood and I was quite surprised to see something like that in Chicora. I\nsuppose it is on the corner across from Dick Gaisford.\n\n     You can inform Margie that I have not seen any\n\n[--- 1943-12-06_tom-to-mum_p02.jpg ---]\n\nwhite civilians since leaving the States. This front differs from the European\none in that respect. She has been very good to me by writing often and I hope\nshe understands when I don't answer her direct, but through you.\n\n     I hope Henry can find something he likes in [crossed out] Italy. He seemed\ndiscontent with his work in Africa. I hope Bill went across the Atlantic. I\nthink he will find he work a bit more pleasant there. And I don't think Henry\nneeds to worry [for awhile, inserted] about being sent across on Armistice\nDay. I expect to finish my 18 months out here, have a few months duty on the\nAtlantic, and then\n\n[--- 1943-12-06_tom-to-mum_p03.jpg ---]\n\nreturn out here for the finish. I think my second tour out here will be a long\none.\n\n     I probably mentioned this before. I had dinner with Glenn Scott on his\nship the other night. It was a treat to get away and I really enjoyed it. He\nsaid that his folks intentionally didn't tell him about Jack so I guess I let\nthe cat out of the bag. He probably is too busy to worry very much about\nthings like that.\n\n     How do you like being a big director by now. Do you solve all the\nproblems for them. I imagine that a Christmas gifts for the employees will be\ndifficult with rationing in effect. Food was\n\n[--- 1943-12-06_tom-to-mum_p04.jpg ---]\n\nsomething that everyone was satisfied with. How about the dividends, did we\nmake any money?\n\n     I am glad to hear that you often start the watch with me because I often\nthink of you and home then. I have lots of time to think during a watch and\noften wonder what you are doing at that particular time. Another thing that\ncauses me some thought [crossed out] is how I will react when I do get home.\nThere will be so many changes there and no doubt I have changed some myself.\nI don't suppose that will make very much difference.\n\n[--- 1943-12-06_tom-to-mum_p05.jpg ---]\n\n     I received two packages to-day. One from Frazier-McCafferty and a fruit\ncake from you. I am saving the cake for awhile. The other box had [crossed\nout: two] books and a pair of slippers. The slippers are too good to wear on\nhere because the salt water is rough on every thing. I also received, a few\ndays ago, a package from Aunt Lyde & one from Isabel.\n\n     I have shot my wad for to-night and also have a few other letters to\nanswer so shall close.\n                                        Love to all,\n                                             Tom\n\n[Written at bottom left:] Ens. Thos. F. Beck\n",

   "body": "\n[--- 1943-12-17_tom-to-mother_p01.jpg ---]\n\n                                                  17 Dec. 1943\nDear Mother,\n     I haven't heard from you for several days but I am not complaining. I\nhave had quite a bit of work to do the last week and am still busy. I am away\nbehind in my letter writing and now have a lot of gifts to acknowledge. In\ncase you are interested here is the list,\n     Florella            - toilet articles, towel, wash cloth\n     Women's Mission Soc. - toilet articles\n     Bertha & Carl       - Candy\n     Luke & Lena         - Books, candy,\n     Geo.                - Books\n     Janny               - Watch straps\n     H. Ford [?]         - Books\n     Pelkey's            - Fruit Cake\nI think that includes every thing. Your fruit cake arrived also.\n\n     I don't know just how to explain this. When Dad's picture arrived I had\nsuch a strange sensation. I often think of him and now his picture brings so\nmany more\n\n[--- MIDDLE PAGE MISSING FROM ALL SCANS ---]\n\n[--- 1943-12-17_tom-to-mother_p02.jpg (last page) ---]\n\nworried but did want to know.\n\n     Our old skipper should be in the States by now. I hope we don't change\ncommands often. There is a lot of paper work and changes involved. It looks\nlike I might be heading State-side when my 18 months are up. There are too\nmany ifs to the deal to even think about it.\n\n     This may reach you by Christmas if it makes all connections. I will take a\nchance that it will and I hope you enjoy the day as much as possible. With the\nlimits on traveling it should be like an old fashion Christmas with every one\nstaying home. I hope the weather man doesn't crosse me up because I will be\nthinking of the day as one with lots of new fallen snow. White Christmases are\nthe best.\n                                        All My Love,\n                                             Tom\n\n[Written at bottom left:] Ens. Thos. F. Beck\n",

   "location": "South Pacific, aboard USS LCI(L) 62; the Pelkeys apparently lived in California ('a box of California fruits')",
   "complete": true,
   "notes": "KEY: this gives TOM'S MOTHER'S FIRST NAME: ELVA ('Dear Elva: We are sending you Tommy's letter'), so she is Elva Beck (Mrs. John A. Beck). The 'Tom Beck' photo folder has a photo titled 'Elva w boys'. Tom's Christmas Day thank-you for the Pelkeys' fruitcake: turkey dinner, 'food that isn't dehydrated is really a rare treat'. Olive forwarded his letter to Elva, mentioning the flu, the Spitzers, and Dr. Mortimer (compare Mrs. Mortimer, who gave Tom clothing in 1942).",
   "content_note": null,

   "body": "\n[--- 1943-12-25_tom-to-olive-and-bob-pelkey_p01.jpg ---]\n\n                                                  25 Dec. 1943\nDear Olive & Bob,\n     We had an excellent turkey dinner to-day with fruit cake for dessert. The\ncake arrived in fine condition and tasted wonderful. Eating food that isn't\ndehydrated is really a rare treat. You can see that your gift was appreciated\nand I really do mean \"Thank You.\"\n\n     I believe that for most of the men out here being away at Christmas time\nwasn't as tough as they thought it would be. The folks back home have been\nswell. Each man has received many packages and we all enjoy them so much.\n\n     There is very little to say about myself. I still enjoy good health and I\nmiss [not, inserted] being at home. I hope the time isn't too far in the\nfuture when I will be home again.\n\n     I hope you have a very successful New Year.\n                                        Sincerely,\n                                             Tom\n\n[Written vertically in left margin:] Ens. Thos. F. Beck\n\n[--- 1943-12-25_tom-to-olive-and-bob-pelkey_p02.jpg (typed on the back of an air-mail envelope) ---]\n\nDear Elva:   We are sending you Tommy's letter - please dear don't think its\nbecause we sent a small package but Bob thought you might like to see his\nwriting and it was on Xmas day too. Hope you got through the holidays O.K. We\nwere very quite and didn't do any celebrating New Year's eve either account of\neveryone feeling so low after having \"FLU\".\n     When you write next time please give me Spitzers correct mailing address\nbecause Bob and I want to send them a box of California fruits. I did write\nthem after our lovely pinic but thought for a box I should have a confirmation\nof their address. Also what is Dr. Mortimer's initial and address?\n     I hope you are all O.K. and I know busy as ever,\n                                        Love to all,\n                                             Olive     1/5/44\n",

   "notes": "KEY: Tom will turn 25 ('a quarter of a century') at his next birthday; with his birthday of Feb. 27 (1943-02-20 letter), that means TOM WAS BORN FEB. 27, 1919. Betty's and Mincy's (reading uncertain) birthdays are both Jan. 5, 'another big day for the Becks', so Betty is apparently a Beck by birth (Tom's sister). Tom numbers his envelopes. Someone sends him Time magazine, and Aunt Bess sent 'Burma Surgeon' (he writes 'Burma Doctor'). Signed 'Love from An Old Man'.",

   "body": "\n[--- 1944-01-04_tom-to-mother_p01.jpg ---]\n\n                                                  4 January 1944\nDear Mother,\n     I guess the system of numbering letters isn't working out so well. I have\nthe envelopes numbered in advance but now I have discovered that I have been\ntaking them from the bottom and from the top. Rather fouled up at this point.\n\n     I started to write to you on Sunday and then got side-tracked so I hope I\ncan finish this to-night.\n\n     It is strange what some people will do. I went to the movies a few nights\nago. In the middle of the picture there was a very heavy mist and I got\nsoaked. Nevertheless, I sat through just to see a\n\n[--- 1944-01-04_tom-to-mother_p02.jpg ---]\n\nclass B picture. I guess I am changing somewhat.\n\n     I received a Time last night and I don't know who is sending it. I\nsuggested the idea to several people and would like to know just who agreed\nwith me that it is a good thing.\n\n     Aunt Bess sent a nice book \"Burma Doctor.\" Have read only part of it and\nit is good. I have a lot of books to read now. Speaking of presents I have\nsome more troubles now. I am not sure who all I have written to thanking for\nthe presents so I suppose some will get two letters.\n\n     I just remembered that tomorrow is another big day for the Becks. Betty's\nand Mincy's [?] birthday.\n\n[--- 1944-01-04_tom-to-mother_p03.jpg ---]\n\nI still remember Betty's 21st. That doesn't sound so good, she isn't that old,\nmy memory is usually very short. I bet Mincy is a good looking young lady. I\nprobably will be surprised at the change in both her and Marge.\n\n     The other night I got to wondering if I would spend my birthday the same\nthis year as last. (I hope not.) I then wonder how old I was and wasn't sure\nuntil I counted on my fingers. Including the thumb I covered one hand exactly\nfive times which makes me feel a bit old. A quarter of a century.\n                                        Love from\n                                        An Old Man\n                                             Tom\n\n[Written at bottom left:] [Ens.] Thos. F. Beck\n",

   "location": "South Pacific, aboard USS LCI(L) 62 - about to reach a liberty port, 'first for 12 months'",
   "complete": true,
   "notes": "Geo. W. (Wagenhorst) has gone home and promised to visit Mother. Mother calculated when Tom could come home; he says it depends on the outfit, C.O., Flotilla Commander, and so on. His first liberty port in 12 months is coming. Central Pacific news is good (the Marshall Islands campaign, Feb. 1944). He has letters from Mari and Sally, and hopes 'Sally stays in Butler awhile' (a romantic interest?).",
   "content_note": null,
   "rescan": [],
   "pages": [

     "width": 2280,

   ],
   "body": "\n[--- 1944-02-20_tom-to-mum_p01.jpg ---]\n\n                                                  20 February 1944\nDear Mum,\n     Again I am a little late in answering your letters but [crossed out]\nbetter late than never. Has Geo. W. been out to see you yet? He said he would\nand I know you will feel a lot better after you see him.\n\n     I wish that you were right with your mathematical solution but getting\n[a] job [?] depends upon more than just arithmetic. Some of the factors are the\noutfit, Commanding Officer, Flotilla Commander, and type of work performed,\netc. I don't rate high in all those.\n\n     We should hit a liberty port soon, first for 12 months. Wine, women, &\nsong. I expect to have some fun.\n\n     In just another week I will have another anniversary which I guess\ndoesn't mean a hell of a lot. Just that much more time put in out here.\n\n     The news from the Central Pacific sounds very good. They aren't\n\n[--- 1944-02-20_tom-to-mum_p02.jpg ---]\n\nlosing much time up there and I hope the pace continues. I haven't heard much\nabout the European Front except that it isn't easy going. The fact that they\nare going means a lot.\n\n     Just to mention the lighter side of life, I received letters from both\nMari and Sally. I found out a lot of things I didn't know. It was really\namusing. I hope Sally stays in Butler awhile. I really don't think I have much\nto do with it, it is just a matter of principle. It would be fun to be home\nnow.\n\n     I haven't much left to say and very little time. Have to write to Mari &\nSally to-night so shall secure.\n                                        My Love to All\n                                             Tom\n",

   "body": "\n[--- 1944-04-03_tom-to-mum_p01.jpg ---]\n\n                                                  3 April 44\nDear Mum,\n     I wrote to John to-night but I can't neglect you. I got the habit of every\ntime I write letters I always include one to you.\n\n     Marjorie's birthday present came the other day. She knows more about the\nsea than I thought she did. The good old invigorating salt spray is taking it\ntoll on my slippers. I will be needing a pair soon.\n\n     I can't say that I have been doing much - getting by with food and sleep.\nI must say the Navy feeds well if you don't mind dehydrated foods. I am\ngetting used to them.\n\n     I am feeling fine and I think I have gained a pound or two.\n                                        L[ove, ... - cut off at bottom of scan]\n",

   "body": "\n[--- 1944-11-02_tom-to-mother_p01.jpg ---]\n\n                                                  2 Nov. 1944\nDear Mother,\n     I have the duty to-night and am ready to secure so this will be very\nbrief. I received yours & Isabel's letters and must admit I do feel relieved.\nGlad to hear every one is fine.\n\n     The main reason for this hurried note is that I moved last night. I now\nlive at 175 State St. telephone 3-0804. I felt a change wouldn't hurt so I\nwent in with another officer. Living alone gets on my nerves.\n\n     Also, received a package from W.C.M.S. marked Christmas package. Ate the\ncontents. Should I thank them now or at Xmas.\n\n     Will write a letter later.\n                                        Love,\n                                             Tom\n\n[Written vertically in left margin, with arrow to the address:]\n(I am still in the same status in regards to [crossed out] orders)\n",

   "id": "1945-winter_tom-to-mother-typed-portland",
   "title": "Tom to Mother",
   "written_by": "Tom",
   "written_to": "Mother",
   "by_tom": true,
   "date": "1945-01/02 (approximate; a Saturday)",
   "date_label": "1945-01/02 (approximate; a Saturday)",
   "sort_date": "1945-01-15",
   "approximate": true,
   "date_source": "undated. A later annotation reads '? 5/30/45', but snow, ice skating, and basketball season, plus films released in late 1944 ('The Fighting Lady', 'Mrs. Parkington', 'Girl Rush'), point to winter 1944-45, most likely January-February 1945.",
   "other_dates_mentioned": [
    "Monday - roommate's 10-day leave begins"
   ],
   "location": "Portland, Maine (Tom's phone is 'Portland 3-0411'); on duty 'aboard' the station",
   "complete": true,
   "notes": "Typewritten in all capitals. Tom fixed water in the gas of his Chevrolet (the 'CHEV') himself by cleaning the carburetor and fuel pump. He is trying to quit smoking and to gain weight. Lane (with whom he goes out; see 1945-03-15 and 1945-04-30) had the duty. His new roommate is married. He has stopped worrying about orders: 'any duty in the States is good duty'. The 'Portland.jpg' file in the parent folder is this same page.",
   "content_note": null,
   "rescan": [],
   "pages": [
    {
     "page": 1,
     "file": "scans/1945-winter_tom-to-mother-typed-portland_p01.jpg",
     "width": 2178,
     "height": 3144
    }
   ],
   "body": "\nDEAR MOTHER,\n\n     AGAIN I HAVE THE DUTY AND I MUST ADMIT THAT I HAVE SPENT MORE ENJOYABLE\nSATURDAY NIGHTS, AND ALSO WORSE ONES! SINCE I HAVE TO STAY ABOARD AND THIS\nBEING A RATHER SLOW DAY I DID SOME WORK ON THE CHEV THIS AFTERNOON AND EVENING.\nI AM STILL BOTHER WITH WATER IN THE GAS AND I DECIDED TO DO SOMETHING ABOUT IT.\nTHE LAST TIME I TOOK TO A GARAGE AND THE MECHANIC FIXED IT FOR AWHILE. SO\nTONIGHT I TOOK THE CARBURETER AND FUEL PUMP OFF AND CLEANED THEM AND BLEW OUT\nTHE LINES. AFTER I PUT IT TOGETHER I WAS QUITE SURPRISED THE THE MOTER TURNED\nOVER MUCH BETTER THAN BEFORE. PERHAPS I AM A MECHANIC, BUT NO DOUBT SOME PEOPLE\nHAVE OTHER IDEAS ON THAT SUBJECT.\n\n     BEFORE I FORGET IT MY TELEPHONE NUMBER IS PORTLAND 3-0411. SORRY I HAVEN'T\nCALLED BEFORE THIS.\n\n     MY WEEK HAS BEEN OCCUPIED WITH MOSTLY WITH MOVIES. SAW \"THE FIGHTING LADY\",\nMRS. PARKINGTON\", AND \"GIRL RUSH\". TRIED TO GET INTO SEE A BASKET-BALL GAME\nLAST NIGHT BUT THERE WAS NO WAY TO REACH US BY 'PHONE AND LANC [Lane] HAD THE\nDUTY AND WAS ON CALL. IF THE ICE DOESN'T MELT TOO MUCH BEFORE TOMORROW\nAFTERNOON I THINK I WILL TRY SOME SKATING. IT IS FUN BUT MY LEGS CAN'T TAKE TOO\nMUCH OF IT.\n\n     NOT THAT I HAVE ANY SENSE NOR AM I BRAGGING BUT I HAVE PRACTICALLY QUIT\nSMOKING. I HEARD TWO OFFICERS TALKING ABOUT QUITTING SMOKING AND THE BETS THEY\nHAD ON IT. I DECIDED TO SEE IF I COULD QUIT WITH OUT ANY STRINGS. WENT TWO DAYS\nWITH OUT ANY AND THE LAST TWO HAVE HAD ONE IN THE MORNING AND ONE IN THE\nEVENING. I DID BUY SOME CIGARS AND WHILE I WAS WORKING ON THE CAR I CHEWED ONE\nOF THEM. I DON'T FEEL ANY DIFFERENT BUT PERHAPS IF I KEEP IT UP FOR AWHILE I\nMIGHT GAIN SOME WEIGHT. I AM MAKING NO PROMISES ABOUT THE LENGTH OF REFRAINING\nAND ALWAYS CARRY A PACK JUST IN CASE I CHANGE MY MIND.\n\n     MY NEW ROOMMATE IS GOING ON A TEN DAYS LEAVE STARTING MONDAY AND I WILL BE\nBY MYSELF AGAIN. HE IS GOING TO KEEP ON LIVING WITH ME UNTIL HIS WIFE COMES BACK\nOR HE GET ORDERS. EVERY ONE IS WORRYING ABOUT GETTING ORDERS BUT ME AND I QUIT\nWORRING A COUPLE OF MONTHS AGO. I HAVE FOUND THAT IT DOESN'T PAY TO WORRY ABOUT\nTHE NEXT PLACE. THIS TOWN HASN'T CHANGED ANY BUT I AM NOT COMPLAINING. I AM\nGETTING BY AND MY MEMORY ISN'T SO SHORT THAT I STILL DON'T BELIEVE THAT ANY DUTY\nIN THE STATES IS GOOD DUTY.\n\n     I HOPE YOU DON'T MIND MY TYPING LETTERS. IT ISN'T THAT I TYPE WELL BUT THAT\nI SEEM TO WRITE MORE WHEN I USE THIS MACHINE. I HAVE ALSO HEARD COMPLAINTS ABOUT\nMY SCRIBBLING. I HOPE EVERYONE IS FINE AND THAT YOU ARE GETTING THE SNOW\nCLEARED. THE SNOW IS DISAPPEARING UP HERE THANKS TO THE SUN.\n\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1945-03-15_tom-to-mother-portland_p01.jpg (envelope) ---]\n\nReturn address:  Ens. T. Beck\n                 U.S. Naval Station\n                 Grand Trunk Pier\n                 Portland (3) Me.\nPostmark: U.S. NAVY  MAR 15 1945   [8-cent air mail stamp]\nAddressed to:    Mrs. John A. Beck\n                 Karns City\n                 Pennsylvania\n\n[--- 1945-03-15_tom-to-mother-portland_p02.jpg ---]\n\n[Printed letterhead: U.S. NAVAL STATION, Grand Trunk Pier, Portland 3, MAINE]\n\n                                                  15 March 1945\nDear Mother,\n     Your idea of coming up the first week in April sounds good. It is a lovely\nspring to-day and if it holds out you will have no complaints on the weather.\nYou make the plans and let me know and I will be ready for you. My\nentertainment committee won't be here. Lane is being transferred the last of\nthe month. Also be prepared for sudden cancelation because I have a feeling\nsome changes will be made and they may be soon but I doubt it. More likely in\na month or two. I will be waiting for whatever you say.\n\n[--- 1945-03-15_tom-to-mother-portland_p03.jpg (marked \"II\") ---]\n\n[Printed letterhead: U.S. NAVAL STATION, Grand Trunk Pier, Portland 3, MAINE]\n\n     It is too bad about the McClungs moving because they will be missed. The\nbetter position should compensate for the move.\n\n     Received a letter from Geo. and I gather he is being well schooled in one\nduty - how to be a socialite. All he talked about was his liberty which I am\nglad he is getting plenty of it. More power to him.\n\n     The license plate arrived this morning.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1945-04-04_tom-to-mom_p01.jpg ---]\n\n                                                  4 April\nDear Mom,\n     I am still just sitting around doing nothing but trying to keep busy. I\nhave been taking an afternoon walk around the yard weather permitting. See a\nmovie about every night - taking in a USO show to-night. Haven't tried\nPortsmouth for night life and don't intend to.\n\n     Don't get your hopes too high. There is a possibility of my getting a\nleave. I don't know when or for how long but will let you know in plenty of\ntime.\n\n     My life of ease gets monotonous but I won't complain.\n                                        Love,\n                                             Tom\n",

   "body": "\n                                                  30 April 1945\nDear Mother,\n     I haven't been doing any thing but taking it easy. The doctors haven't\nsaid a thing except that there are some more tests to take. I have no hopes of\ngetting out of here soon because there are others that have been in for six\nweeks and more. Of course they know why they are here and as yet I am not sure.\n\n     Lane stopped in Saturday for a few hours on her way to Newark. She had\nsome trouble getting transportation but imagine she is on her way by now. I\ndon't know how long she has to stay on the West Coast before taking off.\n\n     Haven't heard from you for awhile.\n                                        Love,\n                                             Tom\n",

   "location": "Naval hospital (probably Portsmouth, NH), 'down here' from Portland, Maine",
   "complete": true,
   "notes": "Written on V-E Day while Tom listened to the radio all day and celebrated 'by staying in to-night'. He is still in the hospital with a daily routine of exercise, walks, and movies, and doesn't know when he'll be discharged. The doctor allowed a trip to Portland to fetch his car. A ship whose officers he knew, which tied up at his Portland pier, was sunk 'a week ago with very few survivors'; this is almost certainly USS Eagle 56 (PE-56), torpedoed off Portland, Maine on April 23, 1945 by U-853 with only 13 survivors. He was listening to 'Fibber McGee and Molly'.",
   "content_note": null,

   "body": "\n[--- page 1 ---]\n\n                                                  V-E Day\nDear Mum,\n     Received Geo. letter yesterday along with five others. It is good to hear\nfrom the rest of the family now and then.\n\n     Have been listening to the radio about all day. It is an anti-climax but\nstill wonderful news. I am celebrating by staying in to-night.\n\n     My day is routine now - Exercise in the morning, a walk in the afternoon,\nand movie in the evening. Have been doing some reading between times. It is\nrather monotonous but I imagine I can survive the ordeal. I still haven't any\nidea when I will be discharged.\n\n[--- page 2 ---]\n\n     The Doc gave me permission to go to Portland to-morrow to get the car. I\nwould [rather, inserted] have it down here in case of some sudden move. Also I\nwant to see some of the people up there. There was a ship that used to tie up\nat the pier whose officers I knew well and liked. A week ago it was sunk with\nvery few survivors. I want to know more about it.\n\n     Fibber and Molly are on the air and I have run out of air so will close.\n\n     Will still let you in on the developments as soon as I know them.\n                                        Love,\n                                             Tom\n",

   "location": "Naval hospital (probably U.S. Naval Hospital, Portsmouth, NH) - Sick Officers' Quarters, moved to 'House 8'",
   "complete": true,
   "notes": "KEY: THE HOSPITALIZATION WAS FOR MALARIA (almost certainly contracted in the South Pacific): 'the Malaria attack is over and that it is just a matter of waiting for the survey' (a medical survey board, which could lead to discharge; compare 'when I will be discharged', V-E Day letter). He moved from the SOQ (Sick Officers' Quarters) to House 8, the maternity ward for sick nurses and WAVES. He went to Boston for a ball game. Mr. West invited him to visit in Boston. 'Light pink, tinged with yellow' probably refers to atabrine (anti-malarial) skin yellowing.",
   "content_note": null,
   "rescan": [],
   "pages": [

   "body": "\n[--- 1945-05-23_tom-to-mom-hospital_p01.jpg ---]\n\n                                                  23 May\nDear Mom,\n     I have been moved from my old quarters, temporarily I hope. The SOQ\nbecame crowded so another Ensign and myself were moved to House 8. We still go\nto SOQ for sick call and meals.\n\n     House 8, by the way, is the maternity ward and for the sick nurses and\nWaves. The room is nice but at times there is a lot of noise. The building is\nbarred shut at night to keep the boys out. I had to laugh when the nurse told\nme that. I probably will be back to the old quarters in a few days.\n\n     Went to Boston Sunday to see a ball game. It wasn't much of a game but was\nnice to get away\n\n[--- 1945-05-23_tom-to-mom-hospital_p02.jpg ---]\n\nfrom this place.\n\n     The sun was out yesterday and I spent a couple of hours taking advantage\nof it. I am a light pink, tinged with yellow, but didn't get burned enough to\nbother me much. I intend to get some more to-day if the sun comes out.\n\n     Received a letter from Mr. West inviting me to look him up if I go to\nBoston. If I get down that way again I would like to meet him.\n\n     I gather my moving means the Malaria attack is over and that it is just a\nmatter of waiting for the survey. The Doc hasn't said a word about it.\n                                        Love,\n                                             Tom\n",

   "date_source": "undated ('Monday Eve 8:00'); two weeks into Army basic training in cold weather, probably winter 1942-43",

   "location": "Co. F, 51st Engineers Combat Regt., Plattsburgh Barracks, New York",
   "complete": true,
   "notes": "A family friend's thank-you to Mrs. Beck for popcorn. He also thanks Janny (cookies) and Isabel (post cards). 'I shall never forget all the Becks'. Bill Jameson/Jamison is almost certainly the 'Bill' who later married or became engaged to JANNY (see 1943-02-20 'How is Janny getting along without Bill', 1943-08-31 'Bill... once Janny has her mind set'); he sent Tom Christmas mail (1943-01-02) and was 'making the best of it' (1943-04-15). Tom Banks came to training with him. He hopes for officer training or the Air Force.",
   "content_note": null,
   "rescan": [],
   "pages": [

   "body": "\n[--- undated_bill-jameson-to-mrs-beck_p01.jpg ---]\n\n[Printed letterhead: eagle seal, \"U.S. ARMY\"]\n\n                                   Pvt. William G. Jameson\n                                   Co. F. 51st Engineers Combat Regt.\n                                   Plattsburgh Barracks\n                                   New York\n                         Monday Eve\n                           8:00\nDear Mrs. Beck.\n     I received the can of Pop corn you sent to me to-day and it is very good.\nI want to thank you for it and for keeping me in mind. I also got Janny's\ncookies and Isabel's bullmatches [?] to-day, and received the post cards Isabel\nsent me yesterday. I don't have time to write to all now, so please thank\nIsabel for me. I shall never forget all the Becks and the good times I have\nspent with them.\n\n     The army has sent me up here where it is good and cold, so I'll just have\nto make the best of it. I now have two weeks of basic training in and when I\nget it all in, I hope to get in officer's training or Air-force. Tom Banks came\nup with me, but I only see him once or twice a week. We have so much work to do\nthat we don't have much time to see each other. We have a show in\n\n[--- undated_bill-jameson-to-mrs-beck_p02.jpg ---]\n\ncamp we can go to a night, also the Canteen, lots of beer.\n\n     In the morning we have drill work outside and Classes in the day room. The\nfirst classes were on First aid, but now, more in the line of engineering,\nbuilding bridges etc. The afternoons we take hikes in the woods and now\nconstructing a bridge. The best time in the Army is chow time, we have all the\nmeat, sugar, and coffee we want.\n\n     Hope you are all well, and thanking you again for all things you have sent.\n                                        Yours truly\n                                             Bill\n",

   "location": "Written from home (Karns City, PA); Tom at Penn State ('State'); Tom and John planning a New York trip",
   "complete": true,
   "notes": "This is a PRE-WAR letter FROM Tom's father. Dad was summoned to Philadelphia 'in connection with that oil investigation', which suggests Dad was in the oil business (consistent with the 'Co. trust', the lease, and Mother as company director). Dad writes warmly, promising a 'shout' if Tom passes and 'we just won't do any worrying' if not. John and Tom were headed to New York ('young bloods'). Dad banked for them.",
   "content_note": null,
   "rescan": [],
   "pages": [

   "body": "\n[--- undated_dad-to-tommy-wednesday_p01.jpg ---]\n\n                                                  Wednesday\nDear Tommy -\n     From what John told me over the phone last night I think he will be gone\nbefore this reaches you. The Bank will accept the check if you endorse for\nJohn and deposit.\n\n     It just would not do to have a couple of young bloods down in New York\nwithout an account to draw on, and especially after I had a chance to observe\ntheir capacity for beer a couple of weeks ago.\n\n     We will be disappointed in not seeing you - but hope you have a good time.\n\n     It looks as though I will have to be in Phila on Feby 1st - got a summons\nto\n\n[--- undated_dad-to-tommy-wednesday_p02.jpg ---]\n\nappear at a meeting there in connection with that oil investigation. I may be\nable to stop of at State either going or coming home. If possible I want to be\naround when we get your grades - and what a shout there will be if you pass.\nAnd if you don't we just won't do any worrying about it - I'm sure it will work\nout alright.\n\n     You tell John I don't like his inference about spending time with me\ninstead of looking up \"hotspots\". Maybe the old man could show him some spots\nin New York which he never even knew existed.\n\n     Come home to see us as soon as you get a chance.\n                                             Dad.\n",

   "notes": "A tender childhood letter: Dad is bringing Tommy 'something used in a baseball game' and will get Johnny (brother John) a glove. He describes a blue-eyed caddy who reminded him of Tommy, and says 'I am tickled that you are doing so well with your papers' (a paper route or schoolwork). Contains a period prejudiced remark about foreign caddies, transcribed as written. Filed with the Navy letters but pre-war.",

   "body": "\n[--- page 1: undated_daddy-to-tommy-hotel-st-george_p01.jpg ---]\n\n[Printed letterhead: engraving of the Hotel St. George with subway map -\n\"1200 ROOMS 800 BATHS\" / \"PHONE MAIN 10000\" / Hotel St. George, Clark Street,\nBrooklyn, New York City]\n\n                                                  Wed. Afternoon\nMy dear Tommy -\n     I got your letter today, also Johnny's, but it was too late for me to get\nyou the baseball suit for I had already gotten you something. It is something\nused in a baseball game. We can get you a suit nearer home and then if it\ndon't fit it won't be so much trouble to exchange it. We can get a glove for\nJohnny at home too. I know you'll like the present I am bringing you.\n\n     If you look in mother's bedroom when you wake up Saturday morning I'll bet\nyou will be surprised.\n\n[--- page 2: undated_daddy-to-tommy-hotel-st-george_p02.jpg ---]\n\n     Was out to play golf again today and I had the nicest blue eyed little boy\nfor a caddy - he reminded me a lot of you. He followed us around for a long time\nwithout saying anything, and finally asked if he couldn't carry my clubs. Said\nhe wanted to learn how to be a caddy. I asked him if he had ever tried it before\nand he said he did but wasn't very good - just like you would say. I let him\ncaddy for me and showed him how to do it, and when we finished I gave him 50¢.\nMy but he was tickled. Most of the caddies are dirty looking foreigners and you\ndon't like to have them around you.\n\n     Well Tommy, daddy will be home pretty soon and surely will be glad to play\nwith his little boys again. I am tickled that you are doing so well with your\npapers.\n                                        From your\n                                             Daddy.\n",

   "body": "\n[--- undated_janny-to-mother-pcw_p01.jpg ---]\n\n                                                  Tuesday\n                                                  Morning\nDear Mother,\n     We got in about 5:00 Sunday, moved in, and then took Billy down to the\nstation. He took the 6:00 train, so he couldn't eat dinner with us. We ate at\nthe 7th Ave. Phyllis was here when I got there, but she left me the room I\nwanted. I met my 'little sister' right away, and I like her lots. She's very\nbackward, but she's cute & pretty.\n\n     The girl next door met Bill at Shadyside Sunday, and said she thot he\nlooked homesick. So she's going to help me call him today. Peggy Bishop says\nthat\n\n[--- undated_janny-to-mother-pcw_p02.jpg ---]\n\nKeith & Jean are having him out for dinner, I think this Sunday.\n\n     The check didn't come in the morning mail, but I told them that I wanted\nto register anyway. I have almost decided to take Chemistry instead of\nPsychology. It will be much harder (more work), but I almost need it for Home\nEc. If you think it's wrong let me know, and I can change. Maybe John would\nknow. I have no Sat. classes, but 4 on Mon. Wed. & Fri.\n\n     I like my room real well, and I'm having lots of fun fixing it up. I would\nlike to have a chair and floor lamp if you think you could spare one from\nhome. I have green & deep rose\n\n[--- page(s) apparently missing ---]\n\n[--- undated_janny-to-mother-pcw_p03.jpg ---]\n\nin Daddy's car. I left a large jar of Freshen [?] in my dresser drawer. I\nsuppose I'll need my Bible for Religion. It's in Isabel's room. I put the\npin-hooks from my drapes in a little box, but I don't know where it is. It was\nin the box that the drapes were in which was in the basement, but they're not\nthere. Please don't forget those shoes that are in the box in my room. The\nother things are my tennis raquet and a can-bottle opener.\n\n     I'll be home the week-end after next, & I may bring Phyllis home.\n     Everything's going fine. I'm going to have plenty of money. We're going\nshopping tomorrow afternoon.\n     I'll write again soon.\n                                        Love\n                                             Janny\n",

   "body": "\n[--- undated_mother-to-folks-moore-heights_p01.jpg ---]\n\n                                                  \"Moore Heights\"\n                                                  Wednesday.\nDear Folks:- I don't believe there is enough news to fill a letter but will at\nleast send you a short one.\n     We are having very cool weather in the shade but boiling in the sun.\n     I haven't seen the Fairview family since you left. Saw Johnnie at church\nand told him I would like to hear his speech but he didn't get around to it.\n     I went to Cavendish Club yesterday and think out of 16, I was next to\nlowest. I think I will take up Bingo. We had a lovely time and a nice lunch.\n     I was kinda tickled when\n\n[--- undated_mother-to-folks-moore-heights_p02.jpg ---]\n\nI went in to see Bonnie she grabbed me and kissed me. I don't know whether I\nam so motherly or just kissable and irresistable.\n     Fred was out last night and put in my fixtures. Like two of them - am not\nsure about the other one. 66 2/3 % is a pretty good batting average. Fred was\ndisgusted the other night. So much red tape working for the gov't. and his\nhelpers are none too good.\n     Joan called yesterday and brought my clock. Smitty was here with my\ninsurance policy. Corbett black topped the driveway. I am gradually getting\nthings done. What has helped, I have found a hammer - also Irene Deets.\n     Janny may be here Sunday.\n                                        Love - Mother\n",

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("letters-data").textContent);
const LETTERS = DATA.letters;
const BY_ID = new Map(LETTERS.map((L, i) => [L.id, i]));
const $ = (id) => document.getElementById(id);

const PX_PER_DAY = 4;
const TL_PAD = 14;
const TYPE_LABELS = {
  ship: "Ship", person: "Person", place: "Place", organization: "Organization",
  military: "Military", event: "Event", culture: "Culture", term: "Term",
};
const NOTE_LABELS = { inference: "Inference", "content-note": "Content note", transcription: "About the transcription" };

let current = -1;        // index of the open letter
let currentPage = 1;
let pageObserver = null;
let suppressPageSync = 0;

/* ---------- helpers ---------- */

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children) if (c != null) e.append(c);
  return e;
}

function dayNum(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}
const START_DAY = dayNum(DATA.range.start);
const END_DAY = dayNum(DATA.range.end);
const xOf = (iso) => TL_PAD + (dayNum(iso) - START_DAY) * PX_PER_DAY;

let measureCtx = null;
function textWidth(s, font) {
  measureCtx = measureCtx || document.createElement("canvas").getContext("2d");
  measureCtx.font = font;
  return Math.ceil(measureCtx.measureText(s).width);
}

function effectiveConfidence(a) {
  const ent = a.entity && DATA.entities[a.entity];
  return a.confidence || (ent && ent.confidence) || "confirmed";
}

/* ---------- tooltip ---------- */

const tooltip = $("tooltip");
function showTip(target) {
  tooltip.textContent = target.dataset.tip;
  tooltip.hidden = false;
  const r = target.getBoundingClientRect();
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  let left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  let top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = r.top - h - 6;
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
}
document.addEventListener("mouseover", (e) => {
  const t = e.target.closest("[data-tip]");
  if (t) showTip(t); else tooltip.hidden = true;
});
document.addEventListener("focusin", (e) => {
  const t = e.target.closest("[data-tip]");
  if (t) showTip(t); else tooltip.hidden = true;
});
document.addEventListener("focusout", () => { tooltip.hidden = true; });

/* ---------- timeline ---------- */

const dots = new Map();   // letter id -> dot element

function buildTimeline() {
  const inner = $("tl-inner");
  const labels = $("tl-labels");
  const width = TL_PAD * 2 + (END_DAY - START_DAY + 1) * PX_PER_DAY;
  inner.style.width = width + "px";

  // Service lane: every event gets a label in the lowest row where it fits.
  const ROW_H = 17, LABEL_FONT = "11px " + getComputedStyle(document.body).fontFamily;
  const rows = [];  // per row: {end, label}
  const items = DATA.events.map((ev) => {
    const x1 = xOf(ev.start), x2 = xOf(ev.end) + PX_PER_DAY;
    const band = ev.end !== ev.start;
    const lx = band ? x1 + 4 : x1 + 10;
    return { ev, x1, x2, band, lx, natural: textWidth(ev.text, LABEL_FONT) + 6 };
  }).sort((a, b) => a.x1 - b.x1);
  const MAX_ROWS = 12;
  for (const it of items) {
    let r = rows.findIndex((row) => row.end <= it.x1 - 4);
    if (r < 0 && rows.length < MAX_ROWS) r = rows.length;
    if (r < 0) {   // no free row: cut short the label that keeps the most room
      const room = (row) => it.x1 - 6 - row.item.lx;
      r = rows.reduce((best, row, i) => (room(row) > room(rows[best]) ? i : best), 0);
    }
    it.row = r;
    it.width = it.natural;
    rows[r] = { end: it.lx + it.width, item: it };
  }
  // Cut each label short before the next item in its row.
  for (const it of items) {
    const next = items.find((o) => o !== it && o.row === it.row && o.x1 > it.x1);
    if (next) it.width = Math.min(it.width, next.x1 - 6 - it.lx);
  }
  const nRows = Math.max(1, rows.length);
  const serviceTop = 6, serviceH = nRows * ROW_H;
  for (const it of items) {
    const top = serviceTop + it.row * ROW_H;
    const tip = `${it.ev.start === it.ev.end ? it.ev.start : it.ev.start + " to " + it.ev.end}: ${it.ev.text}`;
    if (it.band) {
      inner.append(el("div", { class: "tl-band", "data-tip": tip,
        style: `left:${it.x1}px;width:${it.x2 - it.x1}px;top:${serviceTop}px;height:${serviceH}px` }));
    } else {
      inner.append(el("div", { class: "tl-flag", "data-tip": tip,
        style: `left:${it.x1}px;top:${top}px;height:${serviceTop + serviceH - top + 4}px` }));
    }
    if (it.width > 8) {
      inner.append(el("div", { class: "tl-label" + (it.band ? " in-band" : ""), text: it.ev.text, "data-tip": tip,
        style: `left:${it.lx}px;top:${top}px;max-width:${it.width}px` }));
    }
  }

  // Letter lane: stack each circle in the lowest row with room.
  const letterTop = serviceTop + serviceH + 10, DOT_ROW = 17;
  const lastX = [];
  for (const L of LETTERS) {
    if (!L.sort_date) continue;
    const x = xOf(L.sort_date);
    let r = lastX.findIndex((lx) => lx <= x - 16);
    if (r < 0) r = lastX.length;
    lastX[r] = x;
    const dot = makeDot(L);
    dot.style.left = x + "px";
    dot.style.top = letterTop + 6 + r * DOT_ROW + "px";
    inner.append(dot);
  }
  const letterH = Math.max(1, lastX.length) * DOT_ROW + 2;
  inner.append(el("div", { class: "tl-lane-rule", style: `top:${letterTop - 5}px` }));

  // Axis
  const axisTop = letterTop + letterH + 4, AXIS_H = 22;
  const total = axisTop + AXIS_H;
  inner.style.height = total + "px";
  const first = new Date(DATA.range.start + "T00:00:00Z");
  for (let y = first.getUTCFullYear(), m = first.getUTCMonth(); ; m++) {
    if (m === 12) { m = 0; y++; }
    const iso = `${y}-${String(m + 1).padStart(2, "0")}-01`;
    if (dayNum(iso) > END_DAY) break;
    const isYear = m === 0 || dayNum(iso) <= START_DAY;
    const name = new Date(Date.UTC(y, m, 1)).toLocaleString("en-US", { month: "short", timeZone: "UTC" });
    const label = el("span");
    if (isYear) label.append(el("b", { text: String(y) }), " ");
    label.append(name);
    inner.append(el("div", { class: "tl-tick" + (isYear ? " year" : ""), style: `left:${xOf(iso)}px` }, label));
  }

  labels.style.height = total + "px";
  labels.append(
    el("span", { text: "Service", style: `top:${serviceTop + serviceH / 2 - 8}px` }),
    el("span", { text: "Letters", style: `top:${letterTop + letterH / 2 - 8}px` }));

  // Undated box
  const row = $("tl-undated").querySelector(".row");
  const undated = LETTERS.filter((L) => !L.sort_date);
  undated.forEach((L, i) => {
    const dot = makeDot(L);
    dot.style.left = 7 + i * 18 + "px";
    dot.style.top = "8px";
    row.append(dot);
  });
  row.style.width = Math.max(1, undated.length) * 18 + "px";
  $("tl-undated").hidden = undated.length === 0;
}

function makeDot(L) {
  const dot = el("button", {
    type: "button",
    class: "dot" + (L.by_tom ? "" : " family") + (L.approximate ? " approx" : ""),
    "data-tip": `${L.title} · ${L.date_label}`,
    "aria-label": `${L.title}, ${L.date_label}`,
    onclick: () => navigate(L.id),
  });
  dots.set(L.id, dot);
  return dot;
}

function centreTimeline(id) {
  const dot = dots.get(id);
  const scroll = $("tl-scroll");
  if (!dot || !scroll.contains(dot)) return;
  const x = parseFloat(dot.style.left);
  if (x < scroll.scrollLeft + 20 || x > scroll.scrollLeft + scroll.clientWidth - 20) {
    scroll.scrollLeft = x - scroll.clientWidth / 2;
  }
}

/* ---------- letter header ---------- */

function renderHeader(L) {
  $("lh-title").textContent = L.title;
  $("lh-meta").textContent = [L.date_label, L.location].filter(Boolean).join(" · ");
  const badges = $("lh-badges");
  badges.replaceChildren();
  if (!L.complete) badges.append(el("span", { class: "badge incomplete", text: "Incomplete",
    title: "Some pages of this letter were never scanned" }));
  if (L.approximate) badges.append(el("span", { class: "badge approx", text: "Date approximate" }));
  if (L.content_note) badges.append(el("span", { class: "badge content", text: "Content note", title: L.content_note }));
  const about = $("lh-about");
  const btn = el("button", { type: "button", class: "about-btn", "aria-expanded": String(!about.hidden),
    "aria-controls": "lh-about", text: "About this letter " + (about.hidden ? "▸" : "▾") });
  btn.addEventListener("click", () => {
    about.hidden = !about.hidden;
    btn.textContent = "About this letter " + (about.hidden ? "▸" : "▾");
    btn.setAttribute("aria-expanded", String(!about.hidden));
  });
  badges.append(btn);

  about.replaceChildren();
  if (L.notes) about.append(el("p", { text: L.notes }));
  if (L.date_source) about.append(el("h3", { text: "How the date was worked out:" }), el("p", { text: L.date_source }));
  if (L.other_dates_mentioned.length) {
    about.append(el("h3", { text: "Other dates mentioned:" }),
      el("ul", null, ...L.other_dates_mentioned.map((d) => el("li", { text: d }))));
  }
  if (L.rescan.length) {
    about.append(el("h3", { text: "Rescan needed:" }),
      el("ul", null, ...L.rescan.map((r) => el("li", {
        text: (r.page != null ? `Page ${r.page}: ` : `After page ${r.after_page}: `) + r.reason }))));
  }
}

/* ---------- scan viewer ---------- */

function showPage(n) {
  const L = LETTERS[current];
  n = Math.min(Math.max(1, n), L.pages.length);
  currentPage = n;
  const p = L.pages[n - 1];
  const frame = $("scan-frame");
  const img = el("img", { src: p.file, width: p.width, height: p.height,
    alt: `Scan of page ${n} of ${L.pages.length}: ${L.title}, ${L.date_label}`, title: "Click to view full size" });
  img.addEventListener("error", () => {
    frame.replaceChildren(el("div", { class: "scan-missing", text: "Scan not found: " + p.file }));
  });
  img.addEventListener("click", () => openLightbox(p));
  frame.replaceChildren(img);
  if (L.pages[n]) new Image().src = L.pages[n].file;   // preload the next page
  for (const b of $("pager").querySelectorAll("button")) {
    const on = Number(b.dataset.page) === n;
    b.classList.toggle("current", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
}

function renderPager(L) {
  const pager = $("pager");
  pager.replaceChildren("Page");
  for (const p of L.pages) {
    pager.append(el("button", { type: "button", "data-page": p.page, text: String(p.page),
      "aria-label": `Page ${p.page}`, onclick: () => goToPage(p.page) }));
  }
  pager.append(`of ${L.pages.length}`);
}

function goToPage(n) {
  const col = $("text-col");
  const stacked = isStacked();
  suppressPageSync = performance.now() + 400;
  if (n === 1) {
    if (stacked) window.scrollTo({ top: col.offsetTop }); else col.scrollTop = 0;
  } else {
    const pb = $("transcript").querySelector(`.page-break[data-page="${n}"]`);
    if (pb) {
      if (stacked) window.scrollTo({ top: pb.getBoundingClientRect().top + scrollY });
      else col.scrollTop += pb.getBoundingClientRect().top - col.getBoundingClientRect().top;
    }
  }
  showPage(n);
}

/* ---------- full-size scan ---------- */

const lightbox = $("lightbox"), lbScroll = $("lb-scroll");
let lastFocus = null;
function openLightbox(p) {
  lastFocus = document.activeElement;
  const img = el("img", { src: p.file, width: p.width, height: p.height, alt: "Full-size scan", draggable: "false" });
  $("lb-center").replaceChildren(img);
  lightbox.hidden = false;
  closeCard();
  lbScroll.scrollTop = 0;
  lbScroll.scrollLeft = Math.max(0, (p.width - lbScroll.clientWidth) / 2);
  $("lb-close").focus();
}
function closeLightbox() {
  lightbox.hidden = true;
  $("lb-center").replaceChildren();
  if (lastFocus) lastFocus.focus();
}
$("lb-close").addEventListener("click", closeLightbox);
{
  let drag = null, moved = false;
  lbScroll.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: lbScroll.scrollLeft, t: lbScroll.scrollTop };
    moved = false;
  });
  window.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; lbScroll.classList.add("dragging"); }
    if (moved && e.pointerType === "mouse") {
      lbScroll.scrollLeft = drag.l - dx;
      lbScroll.scrollTop = drag.t - dy;
    }
  });
  window.addEventListener("pointerup", () => { drag = null; lbScroll.classList.remove("dragging"); });
  lbScroll.addEventListener("click", (e) => {
    if (!moved && e.target.tagName !== "IMG") closeLightbox();
    moved = false;
  });
}

/* ---------- transcript ---------- */

function renderTranscript(L) {
  const body = L.body;
  const t = $("transcript");
  const frag = document.createDocumentFragment();
  const cuts = new Set([0, body.length]);
  for (const m of L.markers) { cuts.add(m.start); cuts.add(m.end); }
  for (const a of L.annotations) { cuts.add(a.start); cuts.add(a.end); }
  const points = [...cuts].sort((a, b) => a - b);

  let mi = 0, ai = 0, afterMarker = false;
  const seen = new Set();
  for (let i = 0; i < points.length - 1; i++) {
    const s = points[i], e = points[i + 1];
    while (mi < L.markers.length && L.markers[mi].end <= s) mi++;
    while (ai < L.annotations.length && L.annotations[ai].end <= s) ai++;
    const m = L.markers[mi];
    if (m && m.start <= s && s < m.end) {
      if (s === m.start) {
        frag.append(m.type === "page"
          ? el("div", { class: "page-break", "data-page": m.page, text: "Page " + m.page })
          : el("div", { class: "gap", text: "— " + m.text + " —" }));
      }
      afterMarker = true;
      continue;
    }
    let text = body.slice(s, e);
    if (afterMarker && text.startsWith("\n")) text = text.slice(1);   // the marker line's own newline
    afterMarker = false;
    const a = L.annotations[ai];
    if (a && a.start <= s && s < a.end) {
      const conf = effectiveConfidence(a);
      const dotted = a.kind === "inference" || conf !== "confirmed";
      const span = el("span", { class: `ann k-${a.kind} c-${conf}` + (dotted ? " dotted" : ""),
        "data-ann": a.id, text });
      if (!seen.has(a.id) && a.kind !== "content-note") span.tabIndex = 0;
      seen.add(a.id);
      frag.append(span);
      if (e === a.end && a.kind === "content-note") {
        frag.append(el("sup", { class: "dagger", "data-ann": a.id, tabindex: "0",
          "aria-label": "Content note", text: "†" }));
      }
    } else if (text) {
      frag.append(text);
    }
  }
  t.replaceChildren(frag);
}

function isStacked() { return matchMedia("(max-width: 899px)").matches; }

function syncPageFromScroll() {
  if (performance.now() < suppressPageSync) return;
  const L = LETTERS[current];
  if (!L || L.pages.length < 2) return;
  const col = $("text-col");
  const stacked = isStacked();
  const top = stacked ? 0 : col.getBoundingClientRect().top;
  const height = stacked ? innerHeight : col.clientHeight;
  const line = top + height / 3;
  const scroller = stacked ? document.scrollingElement : col;
  const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2;
  let page = 1;
  for (const pb of $("transcript").querySelectorAll(".page-break")) {
    // At the very end, a short last page can't reach the line: use the last visible break.
    const limit = atBottom ? top + height : line;
    if (pb.getBoundingClientRect().top <= limit) page = Number(pb.dataset.page);
    else break;
  }
  if (page !== currentPage) showPage(page);
}

function observePages() {
  if (pageObserver) pageObserver.disconnect();
  const stacked = isStacked();
  pageObserver = new IntersectionObserver(syncPageFromScroll, {
    root: stacked ? null : $("text-col"),
    rootMargin: "0px 0px -66.67% 0px",
  });
  for (const pb of $("transcript").querySelectorAll(".page-break")) pageObserver.observe(pb);
}
matchMedia("(max-width: 899px)").addEventListener("change", observePages);

/* ---------- info card ---------- */

const card = $("card");
const cardState = { annId: null, pinned: false, anchor: null, stack: [] };
let openTimer = 0, closeTimer = 0;

function annById(id) { return LETTERS[current].annotations.find((a) => a.id === id); }
function annParts(id) { return $("transcript").querySelectorAll(`[data-ann="${CSS.escape(id)}"]`); }

function setHighlight(id, on) {
  if (id) for (const p of annParts(id)) p.classList.toggle("hl", on);
}

function openCard(id, anchor, pinned) {
  clearTimeout(openTimer); clearTimeout(closeTimer);
  if (cardState.annId && cardState.annId !== id) setHighlight(cardState.annId, false);
  cardState.annId = id;
  cardState.anchor = anchor;
  cardState.pinned = pinned;
  cardState.stack = [];
  setHighlight(id, true);
  renderCard();
}

function closeCard() {
  clearTimeout(openTimer); clearTimeout(closeTimer);
  if (!cardState.annId) return;
  setHighlight(cardState.annId, false);
  cardState.annId = null;
  cardState.pinned = false;
  cardState.stack = [];
  card.hidden = true;
}

function scheduleClose() {
  clearTimeout(closeTimer);
  if (cardState.pinned) return;
  closeTimer = setTimeout(closeCard, 250);
}

function entityBlock(ent, conf, pinned) {
  const frag = document.createDocumentFragment();
  const head = el("div", null, el("span", { class: "name", text: ent.name }),
    el("span", { class: "type", text: TYPE_LABELS[ent.type] || ent.type }));
  if (conf !== "confirmed") {
    head.append(el("span", { class: "conf " + conf, text: conf === "probable" ? "Probable" : "Speculative" }));
  }
  frag.append(head);
  if (ent.dates) frag.append(el("div", { class: "dates", text: ent.dates }));
  frag.append(el("p", { text: ent.summary, style: "margin-top:4px" }));
  if (!pinned) return frag;

  if (ent.detail) frag.append(el("p", { class: "detail", text: ent.detail }));
  const seeAlso = (ent.see_also || []).filter((id) => DATA.entities[id]);
  if (seeAlso.length) {
    frag.append(el("h4", { text: "See also" }), el("ul", null, ...seeAlso.map((id) =>
      el("li", null, el("button", { type: "button", class: "linkbtn", text: DATA.entities[id].name,
        onclick: () => { cardState.stack.push(id); renderCard(); } })))));
  }
  const links = [];
  if (ent.wikipedia) links.push({ title: "Wikipedia", url: ent.wikipedia });
  for (const s of ent.sources || []) links.push(s);
  if (links.length) {
    frag.append(el("h4", { text: "Sources" }), el("ul", null, ...links.map((s) =>
      el("li", null, el("a", { href: s.url, target: "_blank", rel: "noopener noreferrer", text: s.title })))));
  }
  const others = (DATA.mentions[ent.id] || []).filter((id) => id !== LETTERS[current].id);
  if (others.length) {
    frag.append(el("h4", { text: "Mentioned in" }), el("ul", null, ...others.map((id) => {
      const L = LETTERS[BY_ID.get(id)];
      return el("li", null, el("button", { type: "button", class: "linkbtn", text: L.title,
        onclick: () => { closeCard(); navigate(id); } }), " ", el("span", { class: "date-sm", text: L.date_label }));
    })));
  }
  return frag;
}

function renderCard() {
  const a = annById(cardState.annId);
  if (!a) { closeCard(); return; }
  const pinned = cardState.pinned;
  card.classList.toggle("pinned", pinned);
  card.replaceChildren();
  if (pinned) {
    card.append(el("button", { type: "button", class: "close", "aria-label": "Close", text: "×", onclick: closeCard }));
  }
  const stackTop = cardState.stack[cardState.stack.length - 1];
  if (stackTop) {
    card.append(el("button", { type: "button", class: "linkbtn back", text: "◀ Back",
      onclick: () => { cardState.stack.pop(); renderCard(); } }));
    const ent = DATA.entities[stackTop];
    card.append(entityBlock(ent, ent.confidence || "confirmed", true));
  } else {
    if (a.note) {
      const label = NOTE_LABELS[a.kind];
      if (label) card.append(el("div", { class: "label", text: label }));
      card.append(el("p", { text: a.note }));
    }
    const ent = a.entity && DATA.entities[a.entity];
    if (ent) {
      if (a.note) card.append(el("hr"));
      card.append(entityBlock(ent, effectiveConfidence(a), pinned));
    }
  }
  card.hidden = false;
  positionCard();
}

function positionCard() {
  const parts = annParts(cardState.annId);
  const anchor = parts[0];
  if (!anchor) return;
  const rect = anchor.getClientRects()[0] || anchor.getBoundingClientRect();
  const w = card.offsetWidth, h = card.offsetHeight;
  let left = Math.min(Math.max(16, rect.left), innerWidth - w - 16);
  let top = rect.bottom + 8;
  if (top + h > innerHeight - 8) {
    const above = rect.top - 8 - h;
    top = above >= 8 ? above : Math.max(8, innerHeight - h - 8);
  }
  card.style.left = Math.max(8, left) + "px";
  card.style.top = top + "px";
}

const annTarget = (node) => node instanceof Element ? node.closest(".transcript [data-ann]") : null;

$("transcript").addEventListener("pointerover", (e) => {
  const t = annTarget(e.target);
  if (!t) return;
  const id = t.dataset.ann;
  setHighlight(id, true);
  if (e.pointerType === "touch" || cardState.pinned) return;
  clearTimeout(closeTimer);
  if (cardState.annId === id) return;
  clearTimeout(openTimer);
  openTimer = setTimeout(() => openCard(id, t, false), 150);
});
$("transcript").addEventListener("pointerout", (e) => {
  const t = annTarget(e.target);
  if (!t) return;
  if (annTarget(e.relatedTarget)?.dataset.ann === t.dataset.ann) return;
  if (cardState.annId !== t.dataset.ann) setHighlight(t.dataset.ann, false);
  clearTimeout(openTimer);
  if (cardState.annId && !cardState.pinned) scheduleClose();
});
card.addEventListener("pointerenter", () => clearTimeout(closeTimer));
card.addEventListener("pointerleave", (e) => {
  if (!cardState.pinned && annTarget(e.relatedTarget)?.dataset.ann !== cardState.annId) scheduleClose();
});

$("transcript").addEventListener("focusin", (e) => {
  const t = annTarget(e.target);
  if (!t || cardState.pinned) return;
  openCard(t.dataset.ann, t, false);
});
$("transcript").addEventListener("focusout", (e) => {
  if (cardState.pinned || !annTarget(e.target)) return;
  const next = e.relatedTarget;
  if (next && (card.contains(next) || annTarget(next)?.dataset.ann === cardState.annId)) return;
  closeCard();
});
card.addEventListener("focusout", (e) => {
  if (cardState.pinned) return;
  const next = e.relatedTarget;
  if (next && (card.contains(next) || annTarget(next))) return;
  closeCard();
});

function pinFrom(t) {
  const id = t.dataset.ann;
  if (cardState.annId === id && cardState.pinned) return;
  openCard(id, t, true);
}
$("transcript").addEventListener("click", (e) => {
  const t = annTarget(e.target);
  if (t) pinFrom(t);
});
$("transcript").addEventListener("keydown", (e) => {
  const t = annTarget(e.target);
  if (t && e.key === "Enter") { e.preventDefault(); pinFrom(t); }
});
document.addEventListener("pointerdown", (e) => {
  if (!cardState.pinned) return;
  if (card.contains(e.target) || annTarget(e.target)) return;
  closeCard();
});
let syncFrame = 0;
function onTextScroll() {
  // The observer catches page breaks crossing the line; this catches reaching the end.
  if (!syncFrame) syncFrame = requestAnimationFrame(() => { syncFrame = 0; syncPageFromScroll(); });
  if (cardState.annId) { if (cardState.pinned) positionCard(); else closeCard(); }
}
$("text-col").addEventListener("scroll", onTextScroll, { passive: true });
window.addEventListener("scroll", onTextScroll, { passive: true });
window.addEventListener("resize", () => { if (cardState.annId) positionCard(); });

/* ---------- info dialog ---------- */

function buildInfoDialog() {
  const body = $("dlg-body");
  body.append(el("h2", { id: "dlg-title", text: DATA.collection }));
  if (DATA.content_warning) {
    body.append(el("h3", { text: "Content warning" }), el("p", { text: DATA.content_warning }));
  }
  body.append(el("h3", { text: "How the transcriptions were written" }));
  const conv = [
    ["", "Spelling and grammar are kept exactly as written, with the original line breaks."],
    ["[?]", "a word that was hard to read"],
    ["[illegible]", "a word that couldn't be read"],
    ["[crossed out]", "text struck through; [crossed out: word] gives the word"],
    ["[bracketed letters]", "letters restored where the text runs off the edge of a scan"],
  ];
  body.append(el("ul", null, ...conv.map(([code, text]) =>
    el("li", null, code ? el("code", { text: code }) : null, code ? " " + text : text))));
  body.append(el("p", { text: "Underlined words have background notes: hover to preview, click to pin. " +
    "A dotted underline marks an inference or a note that is probable or speculative rather than confirmed. " +
    "A † marks a note on offensive period language." }));
  body.append(el("h3", { text: "The family" }));
  const dl = el("dl");
  for (const [name, text] of Object.entries(DATA.people)) dl.append(el("dt", { text: name }), el("dd", { text }));
  body.append(dl);
  body.append(el("p", { class: "date-sm", style: "color:var(--muted);margin-top:16px;font-size:12px",
    text: "Data built " + DATA.built.replace("T", " ") }));
}
const dialog = $("info-dialog");
$("info-btn").addEventListener("click", () => { closeCard(); dialog.showModal(); });
dialog.querySelector(".dlg-close").addEventListener("click", () => dialog.close());
dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });

/* ---------- navigation ---------- */

function openLetter(i) {
  if (i === current) return;
  closeCard();
  if (!lightbox.hidden) closeLightbox();
  if (current >= 0) dots.get(LETTERS[current].id)?.classList.remove("current");
  current = i;
  const L = LETTERS[i];
  if (decodeURIComponent(location.hash.slice(1)) !== L.id) location.replace("#" + L.id);
  document.title = `${L.title}, ${L.date_label} · TBF1 Navy Letters`;
  renderHeader(L);
  const notice = $("notice");
  notice.hidden = !L.content_note;
  notice.textContent = L.content_note || "";
  renderTranscript(L);
  renderPager(L);
  showPage(1);
  $("text-col").scrollTop = 0;
  if (isStacked()) window.scrollTo({ top: 0 });
  observePages();
  $("prev-btn").disabled = i === 0;
  $("next-btn").disabled = i === LETTERS.length - 1;
  const dot = dots.get(L.id);
  if (dot) dot.classList.add("current");
  centreTimeline(L.id);
}

function navigate(id) {
  if (!BY_ID.has(id)) return;
  if (decodeURIComponent(location.hash.slice(1)) !== id) location.hash = id;
  else openLetter(BY_ID.get(id));
}

function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  openLetter(BY_ID.has(id) ? BY_ID.get(id) : 0);
}

window.addEventListener("hashchange", openFromHash);
$("prev-btn").addEventListener("click", () => current > 0 && navigate(LETTERS[current - 1].id));
$("next-btn").addEventListener("click", () => current < LETTERS.length - 1 && navigate(LETTERS[current + 1].id));

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!lightbox.hidden) { closeLightbox(); e.preventDefault(); return; }
    if (cardState.annId) {
      const wasFocusedInCard = card.contains(document.activeElement);
      const anchor = annParts(cardState.annId)[0];
      closeCard();
      if (wasFocusedInCard && anchor) anchor.focus({ preventScroll: true });
      e.preventDefault();
    }
    return;
  }
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (!lightbox.hidden || dialog.open || card.contains(document.activeElement)) return;
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  e.preventDefault();
  if (e.key === "ArrowLeft") $("prev-btn").click(); else $("next-btn").click();
});

/* ---------- start ---------- */

$("collection-title").textContent = DATA.collection;
buildTimeline();
buildInfoDialog();
openFromHash();
</script>
</body>
</html>
