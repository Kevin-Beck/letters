   "body": "\n[--- 1942-11-06_tom-to-mother-arrived-solomons_p01.jpg ---]\n\n[Printed letterhead: seal \"U.S. NAVAL RESERVE MIDSHIPMEN'S SCHOOL\", \"NEW YORK, N.Y.\"]\n\n                                                  [later hand: ? 12/18/42]\n                                                  Friday\nDear Mother,\n     We left Norfolk yesterday morning and arrived here last night. The trip\ntook 12 hours and wasn't very exciting. We hit some rough water and I almost\ngot sick. I slept most of the way on an improvised bed. There were at least\n200 officers & enlisted men in one big room. The only chairs were camp stools\nso I put two to-gether and managed to get some sleep.\n\n     After we arrived we checked in and then ate our first meal since\nbreakfast. They haven't quite enough rooms for us so they have put cots in\nthe club rooms of the different building. There are 25 of us in this one\nroom. There isn't any thing for us to do yet. I have a watch to-morrow morning\nand I guess I will miss the captain's inspection.\n\n[--- 1942-11-06_tom-to-mother-arrived-solomons_p02.jpg ---]\n\n     I have seen some of the barges at the dock and the big ones are really\nnice looking ships. A lot of the fellows don't like it here but so far I have\nno complaints. What most of them don't like is that we don't get any liberty,\nand if we do there is no place to go. I think we will only be here a few\nweeks so I can stand staying in. It is quite a change from the last few days\nin Norfolk.\n\n     You can send my clothes down as soon as possible. I won't need my blues\nor whites for awhile so you can keep them. You can send the sweater and sox\nMrs. Mortimer gave me. I guess that is about all I can think of for now.\n\n     My new address is:-\n\n          U.S. Naval Amphibious training Base\n          Soloman's, Maryland.\n                                        Love,\n                                             Tom\n",

   "notes": "A WWI-veteran lieutenant tells tall tales; men bought hunting knives after being told they were 'commandos'. Tom describes the local bar behind the hotel, with slot machines and a Black pianist (described with a racial slur, transcribed as written for historical accuracy). His crew of ten lost its senior officer, and Tom led it on a hike. Navigation classes started at an elementary level even though the men had just finished a 3-month course. A second scan (misfiled as 430130) shows the signature 'Tom'.",

   "body": "\n[--- 1942-11-09_tom-to-mother-monday_p01.jpg ---]\n\n[Printed letterhead: seal \"U.S. NAVAL RESERVE MIDSHIPMEN'S SCHOOL\", \"NEW YORK, N.Y.\"]\n\n                                                  [later hand: ? 12/21/42]\n                                                  Monday\nDear Mother,\n     There is a Lt. here that was in the last war and has been stationed for a\nfew weeks and he has been telling some tall yarns. We have been in stitches\nall evening. I have noticed a lot of the boys wearing hunting knifes & he said\nsome officer gave a pep talk that we were commandos and the kids bought of\nthe local hardware.\n\n     I was over to the city last night. Started for the movie but changed my\nmind when I found out it was a big dinning room with a screen at one end. I\nstopped at the local bar and it was quaint. A little room back of the hotel\nand it was filled with officers & enlisted men with a few civilians in a\ncorner the the center taken up with slot machines. There also was a nigger\nplaying\n\n[--- 1942-11-09_tom-to-mother-monday_p02.jpg ---]\n\nthe piano all night. That bartender has a mint.\n\n     We were supposed to get some more men in our crew to-day but the only\nchange was we lost our only senior officer. The other two men hade watch and\nI had to take the crew on a hike. I march them to the gate then just followed\nthem for a couple of miles to some pop stand then came back. I was afraid my\nvoice would crack giving commands but all it did was get a little high. The\nwork holds much more interest since I am working with a crew even if there are\nonly ten.\n\n     Navigation classes started to-day and we were put in elementary classes.\nThe instructor felt rather foolish when someone told him we just finished a 3\nmonths course. Tomorrow we start on some new tables.\n                                        Love,\n                                             Tom   [signature visible in second scan 430130Pg2]\n",

   "notes": "Page 2 was found in 421118 pG1.jpg; the old 'Z 42 11 AE' pair confirms the two pages belong together. Tom's crew was assigned a commanding officer and seven more men. The ship is rumored to be commissioned Dec. 25 at New Orleans or another Gulf port, which fits Tom being in Texas in January 1943. Most staff jobs are going to married men. His friend Chet has another type of ship and expects to leave soon; they hope to meet during 'maneuvers in the Gulf'. Contains antisemitic and anti-Japanese remarks, transcribed as written.",

   "body": "\n[--- page 1: 1942-11-xx_tom-to-mother-wednesday_p01.jpg ---]\n\n[Printed letterhead: seal \"U.S. NAVAL RESERVE MIDSHIPMEN'S SCHOOL\", \"NEW YORK, N.Y.\"]\n\n                                                  Wednesday\n                                                  NOV 1942\nDear Mother,\n\n     I haven't heard a word from home yet but I suppose it will be like the\nrest - get a bunch of letter all in one day. I hope that it is the mailmans\nfault and that there is nothing wrong at home. It is impossible to get a call\nout of here at a decent hour. It either has to be early or late.\n\n     There really isn't much news about this place. We were assigned a\nCommanding officer and seven more men and our routine is [crossed out] the\nsame. The scuttlebutt has it that our ship will be commissioned Dec. 25 but\nwe will be aboard a couple weeks before. A nice Christmas present. We pick\nthe ship up at New Orleans or some other Gulf port. My assignment\n\n[--- page 2: 1942-11-xx_tom-to-mother-wednesday_p02.jpg ---]\n\nisn't definite yet so I still might get home for the holidays.\n\n     I guess I should have gotten married. Most of the staff jobs were given\nto married men. The pay is higher & they can't live to-gether so it is a good\nset up except for one thing. You probably can guess it - except for a couple\ngood Irishmen, all the soft jobs are going to the Jews. I think life would be\nmore pleasant fighting the Japs than working with the Jews.\n\n     Chet & I have stuck to-gether so far but he has another type ship and\nexpects to leave any day. I think I am good for at least two more weeks here.\nI think we can get to-gether during maneuvers in the Gulf.\n\n     That is all for now. Will try to get some hot releases for to-morrow.\n                                        Love,\n                                             Tom\n",

   "location": "Naval Amphibious Training Base, Solomons, Maryland (inferred: the LCT training in 'the bay' is Chesapeake Bay, and Fish Point is nearby)",

   "notes": "A vivid, story-like account of Tom's first night ship-handling on an LCT (Landing Craft, Tank, about 105 ft), with dialogue with the gruff skipper: taking the con, a near-collision, rules on the 'burdened vessel', and a missed 'meet her' turn. He explains the LCT engine controls, which work 'just like John's boat'. He promises to tell next time 'how this same skipper pulled a fast one on us'. '5C' is written at top left, perhaps an archivist's mark.",

   "body": "\n[--- 1942-11-16_tom-to-mother-and-dad_p01.jpg ---]\n\n                                                  Nov, 1942\n                                                  Sunday\n                                                  [later hand: 11/16/42?]\nDear Mother & Dad,\n     I related before my experience on the first trip out in the bay. The\nL.C.T. (landing craft - tanks) is built like a barge. It is about 105 feet\nlong and on the last 15' is a poop-deck or fantail or counter, all about the\nsame thing, on which is the wheel house. The conning tower is the small space\nin front of the wheel house. The man in charge \"takes the con\" and gives\norders to the helmsman & engineer. The engines are controled just like John's\nboat, - there are three levers for [the, inserted] three engines - ahead,\nforward, middle - neutral, back - reverse. There is a throttle for each engine\n& a r.p.m. dial. I understand this ship is the only one in the Navy that can\nturn on its heel. The bow can be turned any direction & the stern will remain\nstationary.\n\n     On the second a day I had a turn at the wheel and controls. I also had\nthe con for awhile and all I did was turn around and tried to keep a course\non some point - It was just\n\n[--- 1942-11-16_tom-to-mother-and-dad_p02.jpg ---]\n\npractice and didn't go anywhere in particular. In the afternoon I went out,\nsat around and got cold. When we were told we had to go out again that evening\nI was sure I would freeze.\n\n     It was dark when we started out and when we cleared the channel the\nskipper called us to-gether and asked us to describe all light we had passed.\nOn the way out I tried to remember each one but had no idea he would ask us\nabout them. We were huddled to-gether when the skipper asked,\n\"Who is taking the con?\"\nSilence covered the bay and then in a hesitant voice I answered, \"I'll try.\"\n\"Good,\" he said, \"Where are you going?\"\n\"I don't know.\"\n\"Well, head for that light.\"\n\"Aye, aye, sir,\" I replied and then gave the orders,\n\"Both engines ahead 10,000. Rudder left 15.\" We [were] only using the two\noutboard motors. Every thing was going fine until the skipper barked,\n\"Head for Fish Point\"\nHaving no idea where Fish Point is I looked at him and then,\n\"Where do you think it is?\"\n\n[--- 1942-11-16_tom-to-mother-and-dad_p03.jpg (marked \"-2-\") ---]\n\nI pointed and he grunted \"Good.\" With little difficulty I was head on for Fish\nPoint. Out of the darkness I heard a bellow, \"What is that on your port\nquarter?\"\nI ran around the wheel house, upon seeing some moving lights I replied, \"A\nship, sir.\"\n\"Which way is it going?\" I pointed.\n\"Which way are we going?\" Again I pointed.\n\"What is going to happen?\"\n\"We are going to collide, sir.\" There was a quick pause and suddenly the air\nwas split with \"For ---- ----, do something.\"\n\"Aye, Aye, sir.\" Then \"Rudder hard right.\"\nWe got back on a course when the same questions were asked. This ship was\napproaching on our starboard bow. Answering his questions satisfactory, he\ntried a fast one.\n\"Who is the burdened vessel\"\n\"We are, sir.\"\n\"Good. Now try a hard left rudder.\"\nComplying with his orders and pulling straight away from the other ship he\nsaid,\n\"Now what happen?\"\n\"He is the burdened vessel.\"\n\"Good.\"\n     For awhile he gave me various courses\n\n[--- 1942-11-16_tom-to-mother-and-dad_p04.jpg ---]\n\nto follow and a few turns to make. Suddenly he stopped both engines & put the\nrudder amidships.\nLooking at me he said, \"Now, take her home.\"\nI ran around the wheel house looking for a flashing red light and found it\ndead astern. That marked the channel I wanted. I barked, \"Port engine astern\n10, starboard ahead 10, rudder hard left.\"\n     There was a brisk wind and the bow was swing into it not making much\nprogress. When the turn was about completed I gave, \"Port ahead 10.\" Then,\n\"Meet her\" but too late I had swung past the course and instantly I heard,\n\"Where the hell are you going?\"\n\"I didn't meet her, sir.\"\nA faintly audible grunt was all I heard.\n     The ship was finally on it course to the buoy when the skipper came up and\nsaid, \"O.K., Mister. I'll take her now.\" Turning to the wheel house he yelled,\n\"Both engines ahead 21,000. Let get out of here - damn cold as hell.\"\n     That was my first time of ship handling at night and I think it is\ngreat. I will tell you tomorrow how this same skipper pulled a fast one on us.\n                                        Love,\n                                             Tom\n",

   "location": "Naval Amphibious Training Base, Solomons, Maryland (written on leftover Midshipmen's School stationery)",
   "complete": true,
   "notes": "By now Tom is a commissioned officer in the new Amphibious Force. He has a temporary crew, which he musters and marches to class and mess. His classes are Elementary Navigation and Communications (blinker, semaphore, ciphers). He explains the landing craft types LCT, LCI, and LST, and says he has been assigned to an LST but the harbor is too small for them (he later served on LCI(L) 62). He criticizes Navy red tape and politicians. Scuttlebutt says the base is moving to the West Coast. 'The Yanks are doing allright in Africa' refers to Operation Torch (landings on Nov. 8, 1942). He mentions Betty & John, who were apparently near Washington, D.C. (possibly his sister and her husband; a 1943 photo in the 'Tom Beck' folder is titled 'Tom and Betty ca 1943'). Dad had been ill and is feeling better. 421118PG1.jpg is a second scan of page 1 filed under the correct date; the 420716 filenames are misdated.",
   "content_note": null,
   "rescan": [],

   "body": "\n[--- 1942-11-18_tom-to-dad_p01.jpg ---]\n\n[Printed letterhead: seal \"U.S. NAVAL RESERVE MIDSHIPMEN'S SCHOOL\", \"NEW YORK, N.Y.\"]\n\n                                                  ? 11/18/42\n                                                  Wednesday\n                                                  1942\nDear Dad,\n     So far to-day has been wonderful - I received a letter from you & Betty,\na package from Mother, a new crew, and a month's pay.\n\n     I don't know what I can do about seeing Betty & John. I think I can get\nleave from 5 to 10 Saturday and perhaps a little more but that won't give me\ntime to go any place. They would have to come down & meet me either at the\nbase or in Solomons & that is quite a ways from Washington. I don't know\nwhether or not it will be worth it for them.\n\n     My new assignment is only temporary until new officers arrive. It will be\npractice for me and keep the crew to-gether. I will try to explain what I am\ndoing here and it probably won't be very coherent. When I have a crew I muster\nthem 3 times a day - morning, noon, & evening - and\n\n[--- 1942-11-18_tom-to-dad_p02.jpg ---]\n\nmarch them to class. Certain days I march them to mess. If they have any\ntroubles, I listen to them and then pass them on to the senior officer.\nAs for my own classes last week I started in Elementary Navigation which was\ntoo elementary and I tried Communications which was a brush-up on blinker &\nsemaphore. This week is being spent on enciphering & deciphering messages. I\nadmit it is a waste of time but there are so many specialists here that have\njust been commissioned and have no training. The Columbia boys surprised them\nwith a little sea knowledge and we are still on the old schedule.\n\n     As for practical work we get none here. There are three different size\nships, LCT, LCI, & LST in order of size. I have been on the LCT, & saw a few\nLCI but couldn't get aboard. I am [crossed out: on] assigned a LST but the\nharbor here is to small for them so closest I have been to them is a look at\nthe blue prints.\n\n[--- 1942-11-18_tom-to-dad_p03.jpg ---]\n\n     One thing you must remember is that the Amphibs is new & that the base is\nnew. Of course it is not as well organized as it could be but some new\nofficers are taking charge and I expect a change for the better. Another thing\nthe Navy is full of Red tape & customs which they hate to give up. I think\nthere is too damn many politicians in or influencing the Navy for it to\nreally function well.\n\n     The scuttlebutt has it that quite a few orders are coming through to-night\nwhich means some crews are leaving but I don't think I will be included. I\nalso heard that our base is being transferred to the West Coast. I guess the\nYanks are doing allright in Africa.\n\n     I am glad to hear you are feeling better and every thing is fine. Please\ndo take care of yourself so it won't happen again.\n\n                                        Love,\n                                             Tom\n",

   "id": "1942-11-20_tom-to-dad",
   "title": "Tom to Dad",
   "written_by": "Tom",
   "written_to": "Dad",

   "other_dates_mentioned": [],
   "location": "Naval Amphibious Training Base, Solomons, Maryland (on leftover Midshipmen's School stationery)",
   "complete": true,
   "notes": "Dad had been ill (Mother's letter gave Tom 'quite a jolt'). Tom urges him to retire or semi-retire. Officers leave on 24 hours' notice by the 0600 boat. Tom was replaced as crew officer by a gunnery officer and given crew number 4074, which has no men yet. Eight men share his room, five of them from John Jay Hall. He lost $2 at blackjack.",
   "content_note": null,
   "rescan": [],
   "pages": [

   "body": "\n[--- 1942-11-20_tom-to-dad_p01.jpg ---]\n\n[Printed letterhead: seal \"U.S. NAVAL RESERVE MIDSHIPMEN'S SCHOOL\", \"NEW YORK, N.Y.\"]\n\n                                                  ? 11/20/42\n                                                  Friday 1942\nDear Dad,\n     I had quite a jolt when I read Mother's letter but feel better now after\ntalking to you. I am so happy to know that you're much better and I do want\nyou to take it easy. Don't just lay off for a few weeks and then go back. If\nyou don't want to retire at least try semi-retirement (if there is such a\nthing).\n\n     I guess I didn't make it very clear how things are here. When I said I\nwould be here two weeks it was only a guess, no one knows. We are on 24 hours\nnotice. Usually they tell a man the night before he is to leave the next\nmorning on the 0600 boat. The last batch that left some of the officers\nweren't notified until 2 or 3 in the morning. That is the reason we aren't\ngiven any liberty.\n\n[--- 1942-11-20_tom-to-dad_p02.jpg ---]\n\n     There is a general shake up of officers now and I was replaced by a\ngunnery officer. They gave me another crew but I am the only officer and there\nis no crew. The crews are numbered & assigned chronologically and the crews in\nthe 4030's aren't filled yet. My new number is 4074. I don't know what it\nmeans. I may be transfered any day or be here for weeks.\n\n     I like this place but I don't know why. Men come and go so fast that the\nadministration can't keep up and just go around in a circle. I think they\nwill get organized soon. We haven't any recreational facilities and spend all\nour extra time in our room. There are eight of us in this room and five are\nfrom John Jay. All good boys.\n\n     I played some Black Jack last night and got nicked for two bucks. That\nwill satisfy my gambling urge for awhile.\n\n     Take care of yourself.\n                                        Love,\n                                             Tom\n",

   "id": "1942-11-22_tom-to-dad-sunday",
   "title": "Tom to Dad",
   "written_by": "Tom",

   "date": "1942-11-22 (probable)",
   "date_label": "November 22, 1942 (probable)",
   "sort_date": "1942-11-22",
   "approximate": true,
   "date_source": "the letter says 'Sunday 1943', but the content fits Sunday, Nov. 22, 1942 (the day after Betty & John's visit planned in the 1942-11-18 letter, and before the Monday embarkation mentioned 1942-11-24). The '1943' appears to be a mistaken later annotation. A second scan (Adobe 421213pg1) shows '1943' struck through and a later annotation '? 12/13/42'; but the 12/8/42 letter shows Tom had already left Solomons, so Nov. 22 remains the best fit.",
   "other_dates_mentioned": [
    "last night / Saturday (Nov. 21, 1942) - visit from Betty & John",
    "to-morrow (Monday Nov. 23, 1942) - planned departure"
   ],
   "location": "Naval Amphibious Training Base, Solomons, Maryland",
   "complete": true,
   "notes": "KEY: Tom has been transferred to an LCI (158 ft) crew of 3 officers and 21 men, as EXECUTIVE OFFICER, in charge until a skipper arrives. Betty and 'the Johns' visited; Tom regrets being in a bad mood because he couldn't get leave. This is the same visit described in the undated 'Sunday' letter to 'Sis' (Undated D), so Sis = Betty, and that letter was probably written the same day. Future mail goes c/o Post Office, New York.",
   "content_note": null,
   "rescan": [],
   "pages": [
    {
     "page": 1,
     "file": "scans/1942-11-22_tom-to-dad-sunday_p01.jpg",

     "height": 3144
    },
    {

     "file": "scans/1942-11-22_tom-to-dad-sunday_p02.jpg",

   ],
   "body": "\n[--- page 1: 1942-11-22_tom-to-dad-sunday_p01.jpg ---]\n\n[Printed letterhead: eagle, shield and anchors, \"UNITED STATES NAVY\"]\n\n                                                  Sunday\n                                                  1943 [sic]\nDear Dad,\n     I can't give you any news now because I told Betty & the Johns every\nthing. The only thing I regret about the trip is that I was in a bad mood. I\nwas plenty burned up because I couldn't get leave and was quite bitter last\nnight. This place really isn't as bad as I led them to believe.\n\n     I have been transfered again and this time to [crossed out] LCI (158').\nWe were to leave to-morrow but I expect to be here most of next week. In this\nship there are 3 officers & 21 men. For once we are complete except for a\nskipper. I am the executive officer and will be in charge until the\n\n[--- page 2: 1942-11-22_tom-to-dad-sunday_p02.jpg ---]\n\nskipper arrives. On the big ships the exec. practically runs the thing but on\nthe smaller boats the responsibility is evenly divided.\n\n     I am sorry about the mix up on the clothes. A truck from here goes to\nWashington every day and it brought them down. They weren't mailed.\n\n     We have no table or desks in the barracks and it is very difficult to get\na comfortable writing position. Right now I am lying across the bunk using a\nsuitcase for a desk. The trouble with this set up is I have to reach down too\nfar.\n\n     You can keep writing here until I send you another address. It will be\nc/o P.O. N.Y.\n     Will write soon,\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1942-11-22_tom-to-sis-betty-undated_p01.jpg ---]\n\n[Printed letterhead: eagle over shield and anchors, \"UNITED STATES NAVY\"]\n\n                                                  Sunday,\nDear Sis,\n\n     With my limited vocabulary it is difficult to express just how much I\nenjoyed being with you Saturday. I will say it was swell and I think you will\nunderstand what I mean. I do regret that I was in a bad humor. The impression\nI left of the base is not very good and I think that under other circumstances\nI would have said some nice things. It really isn't so bad if you overlook the\nitems that I bitched about. Anyway, I think I will leave soon.\n\n     There is nothing new.\nTell the kid I said hello.\n                                        Love,\n                                             Tom\n(over)\n",

   "body": "\n[--- 1942-11-24_tom-to-dad_p01.jpg ---]\n\n[Printed letterhead: eagle, shield and anchors, \"UNITED STATES NAVY\"]\n\n                                                  Nov. 1942\n                                                  Tuesday\nDear Dad,\n     I have heard that this place is like a pig pen when it rains and now I\nknow for sure. It has rained the last two days and there is mud every where.\nIf possible, it must have been twice as bad before the sidewalks were put in.\nI bought a pair of galoshes, not only for here but for when I get aboard. I\nunderstand that the steel decks don't offer much heat.\n\n     I guess my embarkation was a false alarm. I was scheduled to go Monday but\nnow I haven't any idea. They took seven of my crew away from me and I hope\nthey replace them soon. I expect to be called any day and I hope it is soon.\n\n     I think the holiday leaves will be split with 1/2 the crew getting\n\n[--- 1942-11-24_tom-to-dad_p02.jpg ---]\n\nhome at Christmas, the other 1/2 at New Years. That is if we get any leave.\n\n     Chet came in again to-night and came up for a shower. He likes his work\nand is anxious to get his own ship. The more I talk to him the more I want to\nget out of here.\n\n     I understand that the men that flunk out of John Jay now are kept in the\nNavy as Seamen 2nd class. That's quite a let down.\n\n     I can't even think of enough news to fill this page so had better close.\n                                        Love,\n                                             Tom\n\nHappy Thanksgiving\n",

   "notes": "Thanksgiving: Tom's roommate and buddy Baker jumped for a departing 105-ft boat and fell in the water. Tom did helmsman and man-overboard (box) drills. He complains about how the enlisted men are treated (no liberty or pay, no clothes) and about the base staff's easy hours. He mentions a Butler (PA) hospital holding a dance. Dad had been writing daily. The letter contains antisemitic remarks, echoing Dad's comments about 'soft jobs'; they are transcribed as written for historical accuracy, and a content note is included in the transcription.",

   "rescan": [],
   "pages": [
    {
     "page": 1,
     "file": "scans/1942-11-26_tom-to-dad-thanksgiving_p01.jpg",
     "width": 2274,
     "height": 3204
    },

   "body": "\n[--- 1942-11-26_tom-to-dad-thanksgiving_p01.jpg ---]\n\n                                                  Thanksgiving\nDear Dad,\n     You got me in a bad habit expecting a letter from you every day. I didn't\nreceive any news from home for a couple of days and I thought you probably had\nsome trouble again. Your came to-day and everything is fine. I realize it is\nas difficult for you to find enough to fill a letter every day as it is for me\nand I won't expect so many from now on. I hope you have more to say about your\nthanksgiving than I have.\n\n     It was just another day here except for one big meal which was really\ndelicious. Our class was scheduled for some practical work. We went [to, on]\none of the small boats (105 ft) and Baker (my roommate & bud now) was told to\nget one one of the other boats. It had just started to pull out and Baker\njumped & missed. He was very heavily clothed but was fortunate\n\n[--- 1942-11-26_tom-to-dad-thanksgiving_p02.jpg ---]\n\nthat he only had to swim a few strokes. He must have taken the training more\nserious than I did - I never never but believe that all commands should be\nobeyed.\n\n     The work was very interesting to-day. First, I was the helmsman for awhile\nthere wasn't much to that. All I did was put the rudder where I was ordered\nto. We had maneuver-board drill in which I had to give the commands. A box was\nthrown over and I had to stop the ship with the box amidships and the\nstarboard. I was doing fine until I tried to stop. I got mixed up and missed\nthe box. Only one man did it right and he was an old timer. I learned a lot\nthis morning and hope to get out again soon.\n\n     I ate too much turkey at noon and had to stay in my room this afternoon.\nI also had to console Baker. He is just a little fellow and didn't [have] a\ndry uniform or shoes and he wore mine. He looked a little queer. He and I went\nto a movie this evening.\n\n     I am beginning to think you are right about this place - I might as\n\n[--- 1942-11-26_tom-to-dad-thanksgiving_p03.jpg ---]\n\nwell take it easy while I can. I imagine I will look back on this as a good\ntime. My pet peeve about this place is the way the enlisted men are treated -\nMost of them are used to getting some liberty and being paid and this is too\nmuch of a contrast. I tried once to get clothes & shoes for my crew but I\ncouldn't do any good. I try to tell them that it will be different when we get\noff of here and I don't think they believe me. I really think it will.\n\n     I thought the Butler Hospital was for casualties and I can't see why a\nsick man needs a dance. If only the staff is there they have an easy job,\nespecially if it is like the staff here. All members of the staff here,\nofficers & men, get the evenings & week-ends off. I suppose that makes the\npeople feel better when they help any service men.\n\n     I agree with you that some one type of people seem to get soft jobs. I\nsuppose the reason is that they aren't ashamed to ask for them. I suppose the\nreason I don't like one guy here is that the only time I see him\n\n[--- 1942-11-26_tom-to-dad-thanksgiving_p04.jpg ---]\n\nis when I pay him my linen fee. I had to laugh the other night when some of my\ncrew started complaining about the Jews. It doesn't take much education to get\non to them.\n\n     Another man from our barracks is leaving to-morrow. That leaves only three\nout of nine. They are moving some men.\n\n     I haven't had a letter from Mother for a long time. She wrote to me at\nJohn Jay when I addressed the letters home to her. Perhaps she is a little\njealous of you. From now on I will address my letters to both of you and\nperhaps both of you will [crossed out] answer.\n                                        Love,\n                                             Tom\n",

   "date": "1942-11-28",

   "date_source": "written as 'Saturday night, Nov 1942'; exact day from filename (Nov. 28, 1942 was a Saturday)",

   "complete": true,
   "notes": "Assembled from both folders: pages 2 and 4 exist only in the parent folder (4211AB...). Tom explains LCI crew organization (C.O. as navigator, Exec as gunnery/damage control/supply officer, engineering officer; 3 officers and 21 men). His crew so far is one officer and 14 men. A veteran gunner's mate (Pearl Harbor, Midway, Solomons) dodged an instructor interview to stay with Tom's crew but was sent to an LST anyway. Tom says an officer must also be a 'Mother' to young sailors. Roommates: Coopersmith (Chicago) and Baker (Missouri, Yale M.A. in English, former teacher and reporter). A margin note asks John to read page 70 of the Nov. 30 Time. It contains an antisemitic remark about Coopersmith, transcribed as written.",

   "body": "\n[--- page 1: 1942-11-28_tom-to-dad-and-mother_p01.jpg ---]\n\n                                                  Saturday night\n                                                  Nov 1942\nDear Dad & Mother,\n     I am glad you are asking questions because now I have some thing to talk\nabout that might interest you. I will warn you first that I will try to go\ninto great detail which no doubt will make a lengthy & confusing letter.\n\n     Your question about the skipper comes first. I will start with the\norganization of the crew. There are three officers & 21 enlisted men. The\nCommanding officer, called C.O., skipper, captain, or Old Man, is the boss. He\nis supposed to be a j.g. but some are Mustangs (men who have come up through\nthe ranks & seldom get higher than Ensigns). On the L.C.I. he is the navigator\nbesides he general duties of running the ship. Next in line is the Executive\n(Exec.) officer who on the large ships (cruisers & up) usually runs the thing.\nThe C.O. just supervises & gives general orders. But on the L.C.I. the Exec.\nhas a few other duties such as gunnery officer,\n\n[--- page 2: 1942-11-28_tom-to-dad-and-mother_p02.jpg ---]\n\nin charge of Damage control & supply. The third officer is Engineering and\nhis main job is to keep the engines running. Of course all three should know\neach others job, especially navigating, because under normal wartime\nconditions there probably will be only one on watch at a time. Naturally, the\nbetter our Chiefs are the less work and worry we have.\n\n     The crew is allowed a certain rating for each man and very few have\nreached their allowed rating yet. Our crew is quite fortunate so far in that\nall men have a rating, no apprentice seaman. We did get an unfortunate break\nin one man. He was a gunners mate and had seen action in Pearl Harbor,\nMidway, Solomons and in a few other skirmishes. I was expecting him to relieve\nme of a lot of work as gunnery officer but I didn't count too strongly on him.\nI had a feeling he was too good and they took him away to a L.S.T. The\nordnance department was after him as an instructor and he was to be\ninterviewed a couple of times. I reluctantly send and each\n\n[--- page 3 (marked \"-2-\"): 1942-11-28_tom-to-dad-and-mother_p03.jpg ---]\n\ntime was surprised to see him return. Just before he shoved off for the L.S.T.\nhe told me that officer didn't show up for the interview and he intentionally\nstayed away after that. He said that he didn't want to leave the crew. It gave\nme a strange feeling - I don't know whether it was me or the crew that he like.\nI hope it was both. (Could you follow he through all that.)\n\n     That is the organization - partially filled - one officer & 14 men. One\nof the attributes necessary to an officer, I found out, is not listed by John\nPaul Jones. He gives a lot of them but left out one - Mother. I thought I was\nyoung & didn't know much, but there are some young kids here that have plenty\nof troubles. I really can't help them but don't like to say no. I do the best\nI can which isn't very good, but the crew seems to be satisfied. All of them\nare as anxious as I am to get aboard our own ship.\n\n     I was going to tell you about our trip out into the bay but that would\ntake too long so will save it for\n\n[--- page 4: 1942-11-28_tom-to-dad-and-mother_p04.jpg ---]\n\ntomorrow. To fill the page I will tell you about my room mates & room.\n\n     The room is on top side of one of the barracks, orignally meant for\nchiefs. There are five single & two upper & lower bunks. We have our private\nbath & shower but have to use the enlisted mens laundry. I like that because\nso far I have spent most of my time in there talking to the men & not washing\nmy clothes. Our forces here have dwindled done to three. One, Coopersmith, is\na Jew - he is from Chicago. The other one is Baker, from Mo., received he\nMasters in English at Yale, & has taught English & was a reporter. He is a\nsmart boy, is well read & is still a teacher. He may not realize it but he is\nteaching me a few things about English, Lit., etc. I have often read about\nfellows sitting around & discussing big problems & doubted it all. We don't\nget into any thing deep, but since I have been here I have read quite a few\narticles & editorials and often ask his opinion [on] them. I think he is very\ninteresting to talk to.\n     Will write again tomorrow.\n                                        Love,\n                                             Tom\n\n[Written vertically in left margin:] Tell John to read page 70 of the Nov. 30\nissue of Time.\n",

   "body": "\n[--- 1942-12-03_tom-to-mother-and-dad_p01.jpg ---]\n\n[Printed letterhead: seal \"U.S. NAVAL RESERVE MIDSHIPMEN'S SCHOOL\", \"NEW YORK, N.Y.\"]\n\n                                                  12-3-42\nDear Mother & Dad,\n     I am sorry I skipped a few days between letters. I don't have the free\ntime now as I did before. This week evening classes were started which\ninterfere with my correspondence. As I told Betty I could start writing\nletters in class but that would disrupt my sleep. Even now I haven't much\ntime to spend on this letter.\n\n     I received your gift to-day and it will come in very handy. I also\nreceived a present from Hank & Harriet - a pair of sox. That makes five pair\nnow. If this cold wave sticks I will be tempted to wear all five pair at the\nsame time. It is strange to have the winter weather without snow.\n\n     For some unknown reason the roads were oil. The ground is too hard for it\nto penetrate and [crossed out] now there is little left on the roads and every\nbuilding is covered. It is a good way\n\n[--- 1942-12-03_tom-to-mother-and-dad_p02.jpg ---]\n\nto oil the floor.\n\n     I know as much about Christmas leave as I do anything else here -\nnothing. All I can do is hope I get one. I have received two gifts so far -\nfrom Hank & Harriet & the Womans Missionary Society. I am afraid if I get many\nmore I won't have room to pack them. I am crowded for space now. There is\nreally nothing I need now so if there are any gifts for me please keep them\nuntil I get home. I don't want to leave a lot of stuff behind like I did at\nJohn Jay.\n\n     After a few practical days on the boats life here has again become\nnormal. I am in my third week of communications. Just to relieve the monotony\nthe[re] is a little seamanship thrown in.\n\n     To-day is some sort of an [crossed out] anniversary for me. One moon ago\nI landed here all set for two weeks of hard, but practical, work. It is\nstrange how quickly one can change ones mind and adjust oneself to the\nsurroundings.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1942-12-05_tom-to-mother-and-dad_p01.jpg ---]\n\n                                                  12-5-42\nDear Mother & Dad,\n     We are now in the midst of a very strict muster. All men at the base must\nbe accounted for. It all started at 0800 this morning. There are five officers\ndetailed to each barracks to muster the men & to watch them. The only time\nanyone could leave the barracks was for chow. It is now 3:30 and there is no\nrelief in sight. I don't know why we must stand by so long.\n\n     There is nothing new about when I leave here nor about Christmas leave. If\n\n     It is 10:30 now and am sorry about the interruption. An officer came in and\nyelled that crew 3081 will leave tomorrow at 0800. I have been busy get the\ncrew ready & packing my own things. There are still only 2/3 of the required\nnumber of men & only 1/3 of the officers - that is me. I will have my hands\nfull for awhile as they are now. Will have to cut this short. From now on my\nmail is censored (I am the censor for my crew) so there won't be many details.\n     My new address is:\n\n[--- 1942-12-05_tom-to-mother-and-dad_p02.jpg ---]\n\n          U.S.S. - LCI(L) #218\n          c/o Postmaster\n          New York, N.Y.\n\nThis address will only last for about two weeks. Will let you know of any\nchange.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- page 1: 1942-12-08_tom-to-mother-and-dad_p01.jpg ---]\n\n                                                  12/8/42\nDear Mother & Dad,\n     I left on such short notice that I didn't have time to stock up on\nwriting paper and this is all I have. I will be getting some other soon, I\nhope.\n\n     There is very little to tell you even if I was allowed to. Most of the\ntime is spent getting the crew organized so that they can learn something. I\nalso have to make out a watch bill and pick working parties. I might at that\nso far I am getting plenty of sleep, eating heartily, and am feeling fine -\nno seasickness yet.\n\n     I received a box of cookies from Florella [?] and we have been enjoying\nthem quite regularly.\n\n[--- page 2: 1942-12-08_tom-to-mother-and-dad_p02.jpg ---]\n\nAunt Hazel sent me some candy which was quickly consumed. I am certainly\ngetting my share of gifts and I appreciate every one of them.\n\n     I have one more letter to write for the Red Cross clothing Mrs. Mortimer\ngave me. I had to wait until cold weather and then space the letters so they\nwill think I received them here at different times. I don't like to deceived\nthem like that but I think there morale will be higher if they think that I\nreceived the stuff here. I am glad to have them no matter where I got them.\n     Will write soon.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1942-12-10_tom-to-folks_p01.jpg ---]\n\n                                                  12-10-42\nDear Folks,\n     We hit some rough water yesterday and for some unknown reason I didn't\nget while most of the crew did. Of course I was conscious of my [crossed out:\nstomach] belly but still ate every meal and keep them. Otherwise, everything\nas usual. I am learning a little.\n\n     I might get shore leave to-night and if I do I think I will try to get a\nhaircut. The last one I had was [crossed out] while I was at home. I am\nlooking quite shaggy now. I did some trimming myself and uncovered my ears.\n\n[--- 1942-12-10_tom-to-folks_p02.jpg ---]\n\n     I have been getting plenty of sleep. We anchored all night and since\neveryone was feeling under the weather I laid down about 7:00 and didn't get\nup until 7:00 this morning. One nice thing about this ship is that you\n[crossed out] all you take off to go to bed is your shoes & cap. It makes\ndressing & undressing much faster & simpler. I did manage to get some hot\nwater from the cook so I could shave to-day. A shower would go nice now but I\nam afraid to loose my insulation covering of dirt. All this lack of modern\nconveniences doesn't bother me yet.\n                                        Love,\n                                             Tom\n",

   "notes": "This is the first letter on the ship's-wheel 'UNITED STATES NAVY' stationery. Tom mentions censorship: they can write about little besides their health. The ship is at anchor near Norfolk with little to do. He saw 'Road to Morocco' and 'White Cargo' in Norfolk and jokes that Solomons' movie films were 15 years old. Rumors of Christmas leave or a few weeks of training elsewhere. He hasn't bathed since leaving Solomons. He asks someone to buy Janny a Christmas gift.",

   "body": "\n[--- 1942-12-14_tom-to-mother-and-dad_p01.jpg ---]\n\n[Printed letterhead: ship's wheel framing a battleship, \"UNITED STATES NAVY\"]\n\n                                                  12/14/42\nDear Mother & Dad,\n     The topics we aren't allowed to write about take in about everything but\nour health. I feel fine - getting lots to eat & plenty of sleep. I do wish we\nwere in a warmer climate so I could spend my time sleeping under the sun\nrather than in my bunk. Except for one night we have spent all our time at\nanchor. There is absolutely nothing for me to do except supervise the men do\nnothing. I thought I got away from that life when I left Solomons but all I\nhave done is change Ports.\n\n     Saturday & Sunday nights I went into Norfolk to see an up to date movie -\n\"Road to Moroco\" & \"White Cargo.\" It is really marvelous how the vitaphone has\nprogressed. I also learned another thing at Solomons - movie film begins to\nwear out after 15 years of service.\n\n[--- 1942-12-14_tom-to-mother-and-dad_p02.jpg ---]\n\n     I heard two conflicting rumors to-day. One, we are going to get a three\ndays leave at Xmas and second, we are leaving here shortly for a few weeks\ntraining. I don't believe anything anymore until it happens.\n\n     I finally got my hair cut and I don't think I will have to worry for\nawhile. I had it cut down short [crossed out: enough] so I [crossed out: won't]\nwon't have to even bother combing it. All I need [crossed out] now is a bath -\nhaven't had one since I left Solomons. I also haven't even had my underwear\noff - it gets a little chilly at night.\n\n     Would someone please buy Janny a gift as I don't have any means of doing\nso here. I will reimburse the party that does.\n\n     I haven't received any mail for a week but I know that isn't your fault. I\nwill get it eventually.\n                                        Love,\n                                             Tom\n",

   "notes": "Tom returned a little late from Christmas leave at home, riding down from Washington with men from another training crew. He will meet his crew at Portsmouth; they left on the 22nd. He spent the night in the C.O.'s bed aboard a ship. The warm weather is 'like Spring'.",

   "body": "\n[--- 1942-12-28_tom-to-mother_p01.jpg ---]\n\n                                                  12/28/42\nDear Mother,\n     I arrived a little late and safe. I logged in and nothing was said about\nbeing late so I guess I am o.k. The crew left on the 22nd for Portsmouth and I\nam to meet them there to-morrow. I rode down from Washington with some men in\nthe other training crew. They [crossed out: said] each crew received a 4 day\nleave for Christmas. I was glad to hear that.\n\n     My address will be different from now on. I am staying aboard this ship\njust for the night. The commanding officer is staying ashore to-night &\noffered me his bed.\n\n     I haven't much else to say. I am a little tired - the train ride wasn't\nvery restful.\n\n     It is just like Spring down here. I may have to peel my long underwear\noff.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1942-12-29_tom-to-mother_p01.jpg ---]\n\n                                                  12/29/42\nDear Mother,\n     I guess my being late didn't cause any uproar. I said nothing about it and\nneither did any one else. I arrived here just in time to say good-bye to Baker\n& Toben [?]. Both left for their ship. I am to leave soon but can't say where.\nI am not clapping my hands because I am not going into the heart of it.\n\n     The crew is full now and all seem to be good men. All we need now are\nsome officers.\n\n     I took my heavy underwear off to-day and was still warm in just my khaki.\nIt is certainly a great change.\n\n     While I was waiting for a taxi in front of the station I had a strange\nconversation with an old lady. She said she was 84 years old & a true\nVirginian. Her ancestors go back to early England but the more modern one was\n\n[--- 1942-12-29_tom-to-mother_p02.jpg ---]\n\nPatrick Henry. She has traveled world-wide but likes Florida the best. Spent a\nfew years in China & Japan - likes the Chinks, but not the Japs. Her husband\nwas a minister and she has her own ideas about religion. The conversation also\nincluded her courtship, ideas about young people, & marriage. She was quite\ninteresting - I talked to her for about an hour. If I had more time here I\nthink I would go to visit her.\n\n     That is all except be sure to put the crew number (3081) on all letters.\nI think I will get mail faster that way.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-01-02_tom-to-mother_p01.jpg ---]\n\n                                                  January 2, 1943\nDear Mother,\n     I am sorry not to have written you sooner, but I have been very busy. We\nare leaving to-night and it has been quite a job getting ready. The other two\nofficers arrived this morning & left this afternoon. I offered to ride with\n[the] crew so they can go their own way.\n     I will let you know what my address is as soon as possible. You might get\nmy white suit & shoes ready to ship. I am going to keep my heavy clothes with\nme in case we get north again.\n\n     New Years Eve was very dull. It was the only night I went out and then\ndidn't do anything. I went to the officers club at the Navy Yard. I was\nwaiting for a lot of noise at midnight. I waited until 10 minutes after and\nnothing happened so I came back. This is the most unfriendly town I have\n[crossed out] been in.\n\n[--- 1943-01-02_tom-to-mother_p02.jpg ---]\n\n     They closed my pay account here before I could get paid. I think I have\nenough money to get to Houston but if I don't any there for awhile you will\nprobably get a wire.\n\n     I haven't received any mail yet but I suppose it will eventually get\nhere. The only Christmas mail received was Bill Jamison's & Luke & Lena [?].\n     That is all for now.\n                                        Love,\n                                             Tom\n",

   "notes": "The train arrived in Houston 10 hours late after a 10-hour layover in New Orleans, where Tom had trouble rounding up his sailors. He reports to the base on Jan. 7. He wired home for money because his pay account was closed. Texas had no bars (liquor was sold by the bottle only), so he'll 'stick to beer'. This explains the 'Texas' references in the Jan. 18 letter and the 'new address' in the Jan. 8 letter.",

   "body": "\n[--- 1943-01-05_tom-to-mother-houston_p01.jpg ---]\n\n[Printed letterhead: RICE HOTEL, Houston, Texas - 1000 Rooms - Controlled Air\nConditioning. Footer: \"Associated with Lamar Hotel Houston\"]\n\n                                                  Jan. 5, 1943\nDear Mother,\n     We arrived here this morning about 10 hrs. late. Since my orders are to\nreport on the 7th I am going to wait until the 7th. I walked around downtown\nhere this afternoon and then slept for a couple of hours.\n\n     I don't feel in the best of health to day. There was about 10 hours\nlayover at New Orleans and the boys were given liberty. I went along with\nsome of them and they were just about to much for me. There was a load of\nrecruits leaving in the car ahead of us and a lot of people to see them off.\nThe gang of sailors got in among\n\n[--- 1943-01-05_tom-to-mother-houston_p02.jpg ---]\n\nthe crowd and I had a devil of a time getting them aboard. I think the boys\nlike New Orleans because they were a miserable sight this morning.\n\n     The base here is small but very nice. The men's barracks were much better\nthan any other we have been to. A lot of the officers stay in town but I think\nI will stay at the base, at least until I know my way around. I don't know yet\nhow long I will be here but will let you know as soon as possible.\n\n     The reason I wired for money is that they closed my pay account before I\ncould get any money and I had to pay for my own fare. I don't know how long it\nwill be before I get payed again nor when I will get reimbursed. I didn't\nwant to run short.\n\n     One thing that surprised me about Texas - there isn't a bar in the whole\nstate. The[y sell]\n\n[--- 1943-01-05_tom-to-mother-houston_p03.jpg ---]\n\n[Rice Hotel letterhead]\n\nbeer at a few places but any grog has to be purchased but the bottle. I can't\nquite picture myself getting a bottle & coming to the room to drink it so will\nstick to beer.\n\n     It is after 7:00 so had better close & get some dinner. Will write again\nto-morrow.\n                                        Love,\n                                             Tom\n\nP.S. I think this address will be good as long as I am here.\n",

   "notes": "Now complete: page 1 is in the Adobe folder and page 2 in TBF0defective. Tom reported to the base on Jan. 7 and is doing paperwork for equipping the ship, expecting about 2 more weeks there. He stays on base to save money. He bought another khaki uniform and asks Mother to forget the whites because it is cold and rainy.",

   "body": "\n[--- 1943-01-08_tom-to-mother_p01.jpg ---]\n\n                                                  1/8/43\nDear Mother,\n     I spent the last couple of days looking over the town and it is really a\nnice place. I [crossed out] reported to the base yesterday and spent most of\nto-day checking papers. There is a lot of paper work connected with equiping a\nship. I think we will be here for about two more weeks.\n\n     We have our choice of either staying here or [crossed out] in town. The\nbase is 18 miles outside. It is much cheaper here at the base and pay day is a\nlong way off so I will stay here.\n\n     I am finally going to get some laundry [crossed out: done]. It has been a\nlong time since my clothes have been real clean. I also bought another khaki\nuniform.\n\n[--- 1943-01-08_tom-to-mother_p02.jpg ---]\n\nYou can forget about the whites for awhile. It is actually cold down here. It\nalso has rained every day which is not what I expected from the South. I\nsuppose I expected too much.\n\n     I have a muster in a few minutes so will close.\n\n                                        Love,\n                                             Tom\n\nPlease note new address\n",

   "location": "Houston, Texas",
   "complete": true,
   "notes": "Letters came from Mother and from George (possibly the 'Geo.' of the 'ZGeoAllegheny' letters). Houston is full of air cadets from Ellington Field. Tom slept at the YMCA in a friend's bed, and is dating a girl named Ophelia (the girl mentioned in the 1943-01-18 letter). A former C.O. from Solomons, met at Paradise Creek (Portsmouth, VA), has a brother-in-law in Houston who invited Tom to dinner. He expects to go to Galveston for a while. A new crew member who served in Africa mentioned an officer Glenn Scott, likely the one from Oil City, PA (Glenn Scott also appears in the 1942-07-08 letter as Officer of the Deck at Columbia). Tom warns that another telegram asking for money may come.",
   "content_note": null,

   "body": "\n[--- 1943-01-11_tom-to-mother_p01.jpg ---]\n\n                                                  1/11/43\nDear Mother,\n     Received a letter [to-day, inserted] from both you and George. I gave you\nthe wrong address but they eventually caught up with me. It is strange we\nweren't supposed to tell where we were going and now we not only give the name\nof the town but also the company.\n\n     This is really a good town. The people are very friendly. In fact they\nseem to treat the sailors better than the soldiers. On Saturday night the town\nwas filled with service men mostly air cadets from Ellington Field. I couldn't\nget a hotel room at 6:00 in the evening. I was fortunate in meet a kid here\nthat works nights so he gave me his bed a the \"Y.\" I met this fellow the first\nnight I was here and he not only introduced me to his girl friend but also got\nme a date with her. She is a nice kid and I have fun dating her most of the\ntime. It could be her name that interests me. It's\n\n[--- 1943-01-11_tom-to-mother_p02.jpg ---]\n\nOphelia - I thought names like that exists only in books.\n\n     While I was bouncing from crew to crew at Solomons one of my commanding\nofficers home was in Texas. I met the man at Paradise Creek and the morning of\nthe day I left I mentioned to him about coming to Houston. He said he had a\nbrother-in-law here & insisted that I look him up. I called the other day and\nthey insisted on my coming out to dinner some evening. They promised a good\nmeal so I think I will take them up on it. I will look up the people you\nmentioned. I think I will leave here in a week and will probably go to\nGalveston for awhile.\n\n     One of the new members of the crew was at Africa and he said one of the\nofficers in his group was a Glenn Scott. From the description I am fairly sure\nhe is the one from Oil City.\n\n     Don't be surprised if you get another telegram.\n                                        Love,\n                                             Tom\n",

   "id": "1943-01-15_tom-to-mother",

   "date_source": "the letter reads '1/15/42', a New Year slip; a later annotation reads '1/15/43?'. The content confirms 1943.",
   "other_dates_mentioned": [

   "location": "Houston, Texas (ship being outfitted; Galveston next)",
   "complete": true,
   "notes": "Tom expects to sail for the PACIFIC in a few months, and mail will go via a Postmaster address once they reach Galveston. The skipper 'knows less about the ship than I do'. The ship is full of workmen, so there is little to do. A staff Lt. gave a pep talk; he was the officer whose ship, anchored in a fairway at Little Creek, was hit by the Cape Charles Ferry. Tom jokes about the 'Ambiguous Force' (Amphibious Force) being 'Snafu'. Income tax details: pay of $21 as Apprentice Seaman, $195 as Midshipman, $300 as Ensign, plus a $150 uniform gratuity, and income from a 'Co. trust' and Agency account; John should pay the tax. Also mentions Sprecher (Pittsburgh address possibly 5 Highland Court), Chet's wedding, and looking up the McMahons and O'Conners.",

   "body": "\n[--- 1943-01-15_tom-to-mother_p01.jpg ---]\n\n                                   [later hand: 1/15/43?]   1/15/42 [sic]\nDear Mother,\n     Received your letter this morning. I don't know where Sprecher is now and\nI am not sure of his Pittsburgh address but I think it is 5 Highland Court. I\nsaw a friend of Chet's down at Norfolk and he had a clipping of the wedding.\nIt said that Chet just came back from the Pacific Fleet. The closet he has\ncome to the Pacific was when he was told he would pick his ship up down here.\nEven that was changed and he is still back East. I haven't seen him since he\nleft Solomons.\n\n     Speaking of the Pacific, my chances of sailing are grea[t]. I really\nthink that will be th[e] [corner of page folded over]\n\n[--- 1943-01-15_tom-to-mother_p02.jpg ---]\n\nthe direction I am going. It will be a few months before I leave the country.\nAs soon as we go to Galveston we start using the Postmaster address but don't\nlet it worry you. If we leave very soon I know we won't get far because our\nskipper knows less about the ship than I do. We will have to practice before\nwe can go very far.\n\n     I hate to admit this but there is hardly any work at all to do. We have\nchecked a few publications and that is all. The ship is covered with work men\nand there isn't room to turn around. There is an office where we are supposed\nto report every day and to do our work. Mostly we just sit around and talk or\nread the newspapers. Yesterday some\n\n[--- 1943-01-15_tom-to-mother_p03.jpg (marked \"-2-\") ---]\n\nLt. came in to give us a pep talk. He gave the same type talk that is typical\nof Solomons. It disgusted all of us. I found out later that he was the man\nthat anchored in a fairway at Little Creek and the Cape Charles Ferry hit him.\nIf his ship had sunk he would probably be a full commander now but since it\nonly had a hole in it he only received a position on the staff. This morning\nthe Commanding Officer kicked us out of the office with the remark \"This is a\nhardworking organization.\" and so I am catching up on some letter writing. If\nit wasn't for the efficiency of the employees here this place would be\nmiserable. I even reported to a stenographer rather than the Commanding\nOfficer because she is the only one that knows what is going on.\n\n     I was invited out to dinner Wednesday evening and the people were very\nnice. They had a very cute daughter. She is only 3 1/2 yrs.\n\n[--- 1943-01-15_tom-to-mother_p04.jpg ---]\n\nold. I was invited back next Wednesday and they are going to a Basketball\ngame. It is such a contrast to Norfolk. I also looked in the phone book for\nthe McMahons & O'Conners but there were too many of them so will wait until\ntheir addresses arrive.\n\n     Perhaps it would be best not to tell where I am going or what I said\nabout the organization here. Some people might get the idea that the Navy is\nlike that everyplace. It is only in the Ambiguous Force, no similarity to the\nNavy, that it is really Snafu.\n\n     I have been thinking about my income tax and perhaps John should pay it\nwhile I still have some money. My only income is from the Co. trust, & Agency\naccount. I worked for awhile last Spring and my pay in the Service. That would\nbe $21 as A.S., $195 as Midshipman, & $300 as Ensign. Also $150 Uniform\nGratuity. Even tho they don't pay I guess it is considered income. Let me know\nwhat details you need.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-01-18_tom-to-mother_p01.jpg ---]\n\n                                                  Jan. 18, 1943\nDear Mother,\n\n     Some day I am going to find another place besides a bed to write a\nletter. Practically every place I have been we have to use the bed for both\ntable & chair. My writing is bad enough and trying to write on a bed makes it\nworse.\n\n     I forgot to send Sprecher's letter back in my last letter. I have\nreceived quite a few Christmas cards since I have been here and it is\n[crossed out: quite] a difficult task answering them. A lot of the mail on [?]\nthe #218 is finally catching up with me.\n\n     You have mentioned a trip to Florida. If things turn out the way I expect\n\n[--- 1943-01-18_tom-to-mother_p02.jpg ---]\n\nthem to would you mind changing you trip to California. This may be a\nmilitary secret but I think we are going to the southwest. And if we do I\nbelieve we will have to dock for awhile at California. I hope we have at least\na month in the Gulf and in maneuvers. That means no time off but it will also\nmean learning something about the ship. Then I hope to go to California. I know\nit is a tough trip to any place and if we have a few days in Cal. [crossed out:\noff] I will try to let you know in [crossed out] advance and perhaps you can\ncome out. Please don't come if you think the trip will be too hard on you. The\nbest [crossed out] can do is wait and see what is going\n\n[--- 1943-01-18_tom-to-mother_p03.jpg ---]\n\nto happen.\n\n     I am really not spending all the money I wired [?] for on a good time. I\nhad to buy a uniform, sun glasses, etc. I have loaned some to the other men\nwho haven't be paid either. Also every [crossed out] time we go to town we\nhave to stay at a hotel which is well known and naturally high priced. The\npeople are very nice to us here but it cost us a lot of money to be\nentertained. I won't have to bother you as soon as we are paid which will be\nsoon, I hope.\n\n     I told you about the girl I met here but don't worry about it. We will be\nleaving soon. & she is very nice but I hear that a sailor has a girl in every\n\n[--- 1943-01-18_tom-to-mother_p04.jpg ---]\n\nport. I guess I will have to get use to that.\n\n     My biggest disappointment in Texas is the weather. It has rained almost\nevery day and then last Saturday the sun came out and was quite warm. On\nSunday a Norther, what they call a cold spell, hit here and it has been down\naround freezing. It is surprising the number of men that caught colds. I have\na slight cold myself. I am afraid that I will have a long wait if I wait for\nthe sun to cure me.\n\n     Let me know what you think of a trip to California and I will see what I\ncan do about it.\n\n                                        Love,\n                                             Tom\n",

   "notes": "KEY: Tom's ship was commissioned Friday, Jan. 22, 1943, and leaves for Galveston the next day. The '#345' written into the address refers to USS LCI(L) 345; the 1943-01-26 letter gives the address 'USS LCI(L) 345, Postmaster N.Y., N.Y.'. (Tom was transferred to another ship around Jan. 31, 1943, and was aboard LCI(L) 62 by March.) Gifts: tobacco and a pipe from John Mc., washcloths from Luke & Lena (which clarifies 'Luke & Lines' in the 1943-01-02 letter), and mittens from John B. Letters from Uncle Paul and Adam. John wrote about a lease with 'so many partners' (possibly an oil or gas lease on family property). Tom will start sending a pay allotment home. He mentions Jimmy Eisler (reading uncertain) in Galveston and the McMahons and O'Connors in Houston.",

   "body": "\n[--- 1943-01-24_tom-to-mother_p01.jpg ---]\n\n[Printed letterhead: ship's wheel framing a battleship, \"UNITED STATES NAVY\"]\n\n                                                  Jan. 24, 1943\nDear Mother,\n     I am sorry I slacked off on writing - for a change I have been working.\nOur ship was commissioned Friday and we leave to-morrow for Galveston. There\nwas, and still is, so much to do that everyone is traveling in circles. I\ndidn't get time to see either the McMahons or the O'Connors. I am sorry about\nthat. If we get any liberty in Galveston I am going to see Jimmy Eisler [?] &\nthe rest.\n\n     Tuesday the temperature was down to 18° - by Saturday it was in the 80's.\nI can't get used to it. If it stays warm I will [crossed out] my whites so will\nyou send both the suit & the shoes. Particularly, the shoes. I think I will get\nthem quicker if you send them here to be forwarded. Use the same address -\nBrown [#345, inserted], etc.\n\n[--- 1943-01-24_tom-to-mother_p02.jpg ---]\n\n     I have received a lot of mail and some presents. John Mc. send tobacco & a\npipe, Luke & Lena wash clothes, & John B. mits. Both Uncle Paul & Adam took off\nenough time to write.\n\n     John wrote about the lease and I am all for the plan he outlined. I can't\nsee why it won't work even tho' there will be so many partners. He also asked\nabout travelers checks and I don't think I will need them. The pay will be\nregular and when it isn't I won't be where I need money. I am going to start\nsending an allotment home. I don't know what to tell you to do with it but I\ndon't think I should carry it with me. We can decide that later.\n\n     I will try to do better about writing from now on.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-01-26_tom-to-mother_p01.jpg ---]\n\n                                                  Jan. 26, 1943\nDear Mother,\n     To day has been a busy one for all of us. There are so many routine duties\nthat I didn't realize existed [crossed out] besides some special work that I\nnever seem to catch up. So far it has been quite interesting and I think it\nwill be more so from now on.\n\n     I still think I should have my whites with me. An officer should have a\ncomplete wardrobe so I might as well complete mine. If you haven't allready\nshipped them perhaps the suits & shoes should be in seperate boxes for easier\nhandling. You suit yourself as you probably [crossed out] more about shipping\nregulations than I do. Also it is foolish to send any mail by air since it\nwon't be delivered any quicker.\n     I had better close now. Will write again soon\n                                        Love,\n                                             Tom\n\n[Address, circled at bottom left:]\n     USS LCI(L) 345\n     Postmaster N.Y., N.Y.\n",

   "body": "\n[--- 1943-01-28_tom-to-mother_p01.jpg ---]\n\n[Printed letterhead: ship's wheel framing a battleship, \"UNITED STATES NAVY\"]\n\n                                                  Jan. 28, 1943\nDear Mother,\n     It is just about time for taps so this will have to be short. We are\nstill doing a lot of work [crossed out] are still finding it interesting.\n\n     At times the Engineering Officer will ask me some question about oil and\nI catch myself pulling the same of stunt. Telling him [crossed out] a little I\ndo know and a lot more. I will have to quit that there because he believes me\nand some day we will be without engines. It is really surprising what I have\npretended know and after I do it, find out that I did know something about\nit.\n\n[--- 1943-01-28_tom-to-mother_p02.jpg ---]\n\n     I don't want to show any partiallity but I had better tell Isabel \"Happy\nBirthday\" now while I think of it. This will be the first one I have\nremembered for a long time. I even forgot Jackie's which is one I should\nremember.\n\n     The other officers are ready for bed and I have to shave to-night so will\nclose.\n                                        Love,\n                                             Tom\n\nUSS L.C.I.(L) 345\nc/o Postmaster\nNew York, N.Y.\n",

   "body": "\n[--- 1943-01-31_tom-to-mother_p01.jpg ---]\n\n[Printed letterhead: ship's wheel framing a battleship, \"UNITED STATES NAVY\"]\n\n                                                  Jan. 31, 1943\nDear Mother,\n\n     Complications have set in. The executive officer on another ship is sick\nso I am to be transfered. I don't like the idea at all but I guess that is\nsomething I will have to get used to. I hate to leave all the friends I have\non here. One redeamable factor is that the ship is a few months older and no\ndoubt has experienced men. It is not too definite yet but I think the\ntransfer will go through. You can draw your own conclusions when they can't\nwait a few days for a man to get out of Sick Bay.\n\n     I received a letter from Margorie to-day. I am sorry I can't get to see\nher play basket ball. From what everyone has written and from the write-up\nshe must be very good. It is too\n\n[--- 1943-01-31_tom-to-mother_p02.jpg ---]\n\n[bad] I won't be in Houston to see the Roudybush [?] wedding. I would like to\ngo back to Houston anyway.\n\n     Bertha Beck send me a box of candy the other day. It was hard candy and it\ntasted very good. Everyone has been good to by sending stuff and by writing to\nme.\n\n     I was paid yesterday by check and I don't know what to do with it. It came\nto $366 and I don't have any use for all that but I do need some of it. If I\ncan get to town to cash it I think I will send a money order home.\n\n     I will let you know as soon as possible if I make a change. The other ship\nis #62.\n\n     I will also write as often as possible although it is difficult to fill a\nletter even now.\n                                        Love,\n                                             Tom\n\nUSS LC(I)(L) #345\nc/o Postmaster\nN.Y., N.Y.\n",

   "body": "\n[--- 1943-02-03_tom-to-mother_p01.jpg ---]\n\n                                                  Feb. 3, 1943\nDear Mother,\n     It happened this evening - I was transfered. I hated to leave the other\nship but I think I will learn more much quicker here. The skipper on this ship\nis a full Lt. and he should at least know something about running it. I will\nhave to know a lot more before he will be satisfied.\n\n     I found it quite difficult at times just standing around watching my old\nskipper do things which I knew were wrong but I couldn't say a word. It is his\nship and he wanted to do as he pleased. He also wanted to learn the hard way,\nexperience, and refused advice. Anything I was responsible for I would agree to\nhis way and then do it mine. I really have no kick coming as we got along fine\nto-gether.\n\n[--- 1943-02-03_tom-to-mother_p02.jpg ---]\n\n     I am enclosing two money orders. I don't have any use for the money now\nand I don't know what to tell you to do with it. I will let John figure that\nout.\n\n     I received a letter from George to day. He didn't have much to say except\nsemesters started and his schedule is fairly tough. I think he will be able to\nhandle it allright. He is no dumbbell.\n\n     I have a lot of work to do so had better close now.\n                                        Love,\n                                             Tom\n",

   "notes": "This is Tom's first letter after going to sea. He boarded LCI(L) 62 the night before sailing and stood the 12-to-4 watches, his first time running a ship on the open sea at night, in a darkened ship. He did most of the celestial navigation without having taken a sextant sight before, and the skipper thought his positions were more accurate than the lead ship's. He is now at anchor, having left the U.S. ('if & when I get back to the states'). He plans to use V-mail. Mail sent to the 345 should still catch up with him.",

   "body": "\n[--- 1943-02-11_tom-to-mother_p01.jpg ---]\n\n                                                  Feb. 11, 1943\nDear Mother,\n     I suppose there has been quite an elapse of time between letters but you\nwill have to expecte that from now on. It is still difficult to find any news.\n\n     I came aboard this ship the night before sailing. I felt quite green &\nunsure of myself but the skipper said not to worry that I would learn the hard\nway and I did. I stood the 12 to 4 watches and the first one came at midnight.\nI never thought that the first time I would run a ship would be in the open sea\nlet alone in the dark.\n\n     The first few days were a little rough but, surprisingly, I didn't get\nsick. I didn't feel very well but I really think it was the sudden change of\nroutine. I stand watch on 4 & off 8 hours plus trying to navigate & other work.\nThe days were hot and it took the ship a long time to cool off in the evenings.\nThe ship\n\n[--- 1943-02-11_tom-to-mother_p02.jpg ---]\n\nis darkened which cuts off a lot of ventilation. The nights were hot & I was\nnervous so I think I would have felt rather low even on shore. Just as I\n[crossed out] was getting used to it all we arrived here and are now at anchor.\nI imagine there will be a lot more to come.\n\n     It is strange what one can do if one has to. The skipper had me doing most\nof the navigation work and I never took a sextant sight before. I did what the\nbook said to do and he still thinks our positions were more accurate than the\nlead ship's. It gave me some assurance. I still have to learn how to find the\ndifferent stars. I don't know them yet.\n\n     I am going ashore as soon as I can get liberty & bury my nose in some suds.\nA bottle of beer would sure taste good these afternoons. I can['t] help\nmentioning the weather as this is the coldest month of the year.\n\n[--- 1943-02-11_tom-to-mother_p03.jpg (marked \"-2-\") ---]\n\n     I suppose my mail will catch up with eventually, even that sent to the\n345. If you sent the whites I imagine I will get them next winter if & when I\nget back to the states. As for mail I believe I will limit my correspondence to\nyou & possibly one or two other women. It will be difficult finding enough\nallowable material for one letter. If I can find a station I will try the\nV-mail. It will be a lot faster & surer.\n\n     I have a couple \"thank-you\" notes to write so will close this one.\n\n     Don't worry about me. Just keep a soft bed in a cool spot ready for me and\nI will be back home in no time.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-02-13_tom-to-mother_p01.jpg ---]\n\n                                                  Feb. 13, 1943\nDear Mother,\n     From what I hear Air-Mail is so much faster that this will probably arrive\nbefore my first letter. I guess it doesn't make much difference. From now on I\nthink I will send all letters Air Mail when ever possible or maybe V-mail.\n\n     We have been kept quite busy on the ship and it isn't hard to work up a\ngood sweat. Last night was my first night ashore and it was very enjoyable. The\ntown is quite quaint or at least different. Almost every other door leads to a\nbar and every place is jammed. It is unusual now but I think\n\n[--- 1943-02-13_tom-to-mother_p02.jpg ---]\n\nit would be a boring life to be here permanent. I am glad I am aboard ship and\nnot stationed on land.\n\n     I have a lot more confindence in these ships now. After our trip I believe\nthat they can take quite a bit of punishment.\n\n     I am sorry I can't write more but you understand how things are.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-02-18_tom-to-mother-typed_p01.jpg ---]\n\n                                                  Feb. 18, 1943\nDear Mother,\n\n     Just a short note to let you know I am still kicking around. There has\nbeen no change- just the same old routine. We are still working and sweating.\nI still haven't tried to acquire a tan yet, but will venture forth one of\nthese days.\n\n     I saw Chet Beard a few minutes ago. He hasn't change much. Complains a\nlittle more than he used to. When I left him he was arguing with a Lieutenant\nand I think he will lose the arguement. He was married while he was waiting\nfor his ship in Phidelphia. He also said that Johnson and a few other of the\nJohn Jay boys came with him. I haven't seen any of them as yet.\n\n     It is beginning to seem like ages since I have heard from home. I know it\nisn't your fault but just the same I have been wondering how all of you are. I\nsuppose Jackie is getting cuiter and wilder every day. If you are having\ntypical February weather I imagine it is cold with plenty of snow. How are you\nmaking out with the oil being rationed? Probably keeping pretty close to the\nback living room or are you practicing bundling.\n\n     You know that I never did hear the story about Al Wiengard leaving.\nPerhaps the mail won't carry it if you wrote it verbatem.\n\n     I will have to get back to work.\n\n                                        Love,\n                                        [signature below edge of scan]\n",

   "notes": "KEY FAMILY DETAILS: Tom's birthday is Feb. 27 ('One week from to-day...'), and he jokes about getting 'up in years' for 'a young man's war'. He asks about the family: Isabel (at home, in Butler, or joining the WAVES/WAACs?), Janny (in school, 'getting along without Bill', probably Janny's husband or boyfriend in service), John Mc. (new job), John B. (still single), George (working hard, in school), and Marg (Margorie, playing basketball). Mother collects old silk (for the war effort) and serves on the rationing board. He has a new mailing address (not included in this scan).",

   "body": "\n[--- 1943-02-20_tom-to-mother_p01.jpg ---]\n\n                                                  Feb. 20, 1943\nDear Mother,\n     Here is another change of address. I think the last one I gave you will\nwork o.k. but use the new one from now on. They say any other one will be\nreturned to sender. You might also add the Amphibious Force although I don't\nthink it is necessary.\n\n     One week from to-day will be just another day, I am afraid. I don't feel\nmuch older but I hope I act a little older. I guess I am getting up in years.\nPerhaps I should ask for a transfer as this is supposed to be a young man's\nwar. My only wish now is that I don't have to spend two birthdays in the\nservice.\n\n[--- 1943-02-20_tom-to-mother_p02.jpg ---]\n\n     There are [crossed out] a lot of questions I want to ask and you probably\nhave answered them all by now. Is Isabel still at home or is she in Butler, or\ndid she go through with the Waves or Waacs deal? How is Janny getting along\nwithout Bill and is she still in school. Does John Mc. like his new job and is\nJohn B. still single (he should have one earned by now)? I imagine George is\nstill working hard & Marg is still playing basketball. How about yourself -\nstill collecting old silk and showing them how to run the rationing board. Do\nthe people still argue or have they given up?\n     That should keep you busy for awhile.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-02-22_tom-to-mother_p01.jpg ---]\n\n                                                  Feb. 22, 1943\nDear Mother,\n     Just finished a meal of beans. I haven't changed any and neither have\nthey. Except for the beans I have been eating a lot. The cook on board is a\ngood baker and I have been eating pie & cake. The meals are very good.\n\n     Another change has been made in our address. Don't use Amphibious Force.\nUse what is on the envelope.\n\n     The main reason for this letter is that it may be the last one for awhile.\nIf you don't receive for a few weeks you will know that I am at sea again,\n[crossed out: and that] I will write as soon as I can [find] any place to mail\na letter.\n\n     There is one place I wish I could have seen before leaving the States -\nthe West Coast.\n\n[--- 1943-02-22_tom-to-mother_p02.jpg ---]\n\nI probably see it on the way back.\n     It is time for the mail to go out so will have to close.\n                                        Love,\n                                             Tom\n",
