   "notes": "This is the last letter before a long ocean passage: 'Don't worry if you don't hear from me for a couple of months.' Crew members are clipping or shaving their heads, and Tom plans to clip the skipper when they cross the equator. This matches the 1943-03-12 letter, in which Tom has shaved his head and crossed the Equator, so the ship crossed into the South Pacific in early March 1943. Tom is reading Balzac, which John lent or recommended.",

   "body": "\n[--- 1943-02-23_tom-to-mother_p01.jpg ---]\n\n                                                  Feb. 23, 1943\nDear Mother,\n     No change of address for once and also no other news of interest. We are\nanchored out to-night and I think for the last time for quite sometime. I\nbelieve we will be able to stow the anchor below and forget about it. Of course\nthe Navy has changed its mind before and can do it again.\n\n     Some of the crew cut their hair with clippers to-day and the[y] really\nlook peculair. A couple of them went further and shaved their heads and they\nlook worse. The top of their head is white and their face is brown. When we get\noutside of land and there are no chances of turning back I think I will put the\nclippers to mine. If I come back bald headed you will know that my hair\n\n[--- 1943-02-23_tom-to-mother_p02.jpg ---]\n\nforgot to grow back in. I am going to try to clip the skipper when we cross the\nequator. It wouldn't make much difference because he is just about bald now.\n\n     Tell John I am enjoying Balzac and I have it just about finished. I\nthought I would have time to read when underway but found out that is\nimpossible. There is too much work to be done.\n\n     Reveille is at 0500 to-morrow so had better close and get in my sack. It\nis quite possible that this will be the last letter for awhile.\n                                        Love,\n                                             Tom\n\nP.S. Don't worry if you don't hear from me for a couple of months.\n",

   "id": "1943-03-12_tom-to-mother",
   "title": "Tom to Mother",
   "written_by": "Tom",
   "written_to": "Mother",

   "date_source": "typed on letter ('USS LCI(L) 62, March 12, 1943'), with continuations dated Mar. 15, 3/16, and 3/18",

   "location": "At sea aboard USS LCI(L) 62 in the South Pacific, approaching port after crossing the Equator",
   "complete": true,
   "notes": "Mostly TYPEWRITTEN; finished by hand on 3/18 because someone else was using the typewriter. Now complete with page 2 from the Adobe folder. Tom became a 'shellback' (he writes 'moss-back') in King Neptune's Court when crossing the Equator at night, clipped his head and grew a beard, took noon sun sights, and stood 4-on/8-off watches. They passed an island with mountains, then a two-day storm in the rainy season. He worries about his income tax (the government owes him about $200) and washes clothes in salt water. He hopes to come back 'as a passenger'. Heavily stained; a later hand added 'MARCH 1943' in blue.",
   "content_note": null,

   "pages": [

    },

     "page": 2,

     "width": 2225,

   "body": "\n[--- 1943-03-12_tom-to-mother_p01.jpg ---]\n\n                                                  USS LCI(L) 62\n                                                  March 12, 1943\nDear Mother,\n     We are still at sea but I have a few minutes so will write as much as\nI can before I forget everything. When I was sure which direction we were\ngoing I had the clippers run over my head. It is a lot cooler this way but\nat times a little inconvenient. I forgot and went without a hat for just a\na few minutes and the top of my head got sunburned. It didn't bother me so\nmuch until it started to peel. The only way I could get rid of the dead skin\nwas to brush my hair with an old toothbursh. At the same time I got my head\nclipped I quit shaving and now my beard is longer and blacker than my head.\nAt first it was tough looking in the mirror but I am getting used to it by no[w]\nOne afternoon it was extremely warm so I stood my watch with my shirt open\nand burned my belly. It peeled too. I tried taking it easy with my back and\ngot fairly brown but I am afraid it is going to peel also. I think I have sh[ed]\nabout enough skin for this season.\n     A few days ago I was just an ordinary pollywog but now I am an old moss-\nback in King Neptune Court. In other words I crossed the Equator. There was[n't]\nmuch to it--we crossed it at night and I couldn't see a thing. I guess it is\nblacked out for the duration. I would hate to travel very much near the\nequator because we had a tough time getting a noon sight on the sun. It\nwas all most directly overhead and we could bring it down any place on the\nhorizon. I could never tell which way to look. The sights are comming along\nmuch better now.\n(time out for chow--will add more at first oppotunity)\n\n     I have a few minutes before General Quarters so will try again. Even\nafter a couple of weeks it will be hard to find much of interest to say. The\nwatches are getting very tiresome and nerve wracking. It is four on and eight\noff every day plus a lot of other work and it is difficult for me to get used\nto sleeping a couple of hours at a time. By the time I get accustomed to the\nroutine we will hit port and back to normal life for awhile. I don't expect t[o]\n[be] parked in one spot for any length of time. I think we will keep moving from\nnow on. One thing I hope now is that when I come back I come back as a passen[ger].\n\nMar. 15\n     This is somewhat like the life at Solomons. I put a batch of sox and\nunderwear to soak and now I can't find time to wash them. I am saving one\nclean suit of khaki so if we do hit a port I will be able to leave the ship\nfor awhile. It is quite difficult to wash in salt water.\n     We were supposed to be close enough to an island yesterday that we could\nsee some mountains and I have been waiting for a week just to see land. We\nwere a little behind schedule and passed tham last night so I will have to\nwait a few more days. Maybe it is better this way when we will dock when\nwe see our first land in weeks.\n     I heard part of a news broadcast last night--the first since we left.\nCouldn't catch much because of static. A station in Oklahoma comes in over\nthe radio just before they sign off and for awhile after coming on in the\nmorning. I heard just enough to wonder how the war is progressing.\n     I am glad I saved some old letters. I ran across some in my suitcase\nthe other day and have been reading them. I keep wondering when my mail\nwill catch up with me. I expect a lot when it does. (General Quarters)\n\n[--- 1943-03-12_tom-to-mother_p02.jpg (marked \"-2-\"; typed, then handwritten) ---]\n\n3/16\n     I was thinking yesterday about my income tax and if John did anything\nabout it. I haven't any idea how much money I received last year and if the\nbank didn't send a statement I am not sure how I can find out. Perhaps if he\ndidn't pay it the goverment will get after me and tell how much I owe. I don't\nsuppose it makes much difference to them that they owe me about $200.\n     I finally did a washing today. This salt water is tough to wash with. I\nscrubbed and scrubbed but couldn't get any suds and then I couldn't get all\nthe soap rinsed out. I also left most of the dirt in them. It started to rain\njust as I finished and I am hoping that it will take all the soap, dirt, and\nsalt water out of the clothes.\n     I made a bold venture to day and stood my afternoon watch with out a\nshirt and I didn't get burned very badly. I think I will be able to stand\nquite a bit of sun from now on. Unless the sky looks a little clearer tomorrow\nthan tonight I won't have to worry much about the sun. When it rains down here\nit really rains but usually does not last long.\n     It is about 1900 now so I think I will try to get some sleep before going\non watch. It is tough enough up there without having to fight off sleep. (I\nmay get time to fill out this sheet before we reach port. I hate to end in the\nmiddle of a page.)\n\n[handwritten:]\n3/18\n     Some one is using the typewriter so will finish this with pen. Have very\nlittle to add. Most of the men are happy and are singing & whistling so I\nguess we are getting near land. That thought doesn't make me any sadder. We\njust came through a two day storm and it sure can rain down here. I thought we\nwould miss the rainy season. Hope all we get is the tail end.\n\n     I may be able to get two or three letters off in the next few days or\npossibly we will spend some time at this Port, but I doubt it.\n     I will try to write as often as possible.\n                                        Love to all,\n                                             Tom\n",

   "body": "\n[--- 1943-04-01_tom-to-mother-typed_p01.jpg ---]\n\n                                                  April 1, 1943\nDear Mother,\n\n     We are in a port where there is a postoffice and I understand that\nAirMail will reach the States in about 10 days so I thought I would write\nagain although as usual there is little to say. We never know how long it\ntakes mail to get home so I will write as often as possible and porbably the\nlast letters will reach you first. I am still wondering how the V-mail got\nthrough.\n\n     I am still a little tired from our last trip. I stood four on and four\noff and I still haven't gotten used to getting my sleep in snatches. I hope to\nget accustomed to it by the time we reach our destination. One nice thing\nabout this place is that they have beer. There is only one catch to it. They\nserve only so much and first there first served. I came in last and didn't\nget any. (Had to take time out to eat chow)\n\n     The Captain wants me to go ashore for some provisions so will have to\nfinish this in a hurry. I think I will be able to write to you regularly\nrather soon, at least for a while. We should be at our destination within a\nmonth but you never can tell what might happen or who may change our plans.\nI will be glad to get some place where we can dock for a few weeks rather\nthan a few days. I would like to see some of this country but I doubt if I\ncan get any time off. I am hoping for a leave in about three or four months.\nThat really isn't such a long time to wait if I can get back to the States\nfor a couple of weeks. All I can do now is hope and I am doing plenty of that.\n\n     Have to get going now.\n\n                                        Love to all,\n                                             Tom\n",

   "body": "\n[--- 1943-04-07_tom-to-unc_p01.jpg ---]\n\n                                                  April 7, 1943\nDear Unc,\n     I left the States about six weeks ago and several times attempted to\nwrite to you. Now, I can't remember whether or not I did write so I will\npretend that I didn't and start from the first. I guess I need a secretary.\nSome of this may be old stuff to you.\n\n     The ship I was orginally assigned to was commissioned the last of January\nand then I thought I would finally get the training I needed and wanted. I did\nmake a few trips out in the Bay but never ran the thing. I was to wait until\nthe skipper learned then it was my turn. That arrangement suited me fine but\nnot our Commander. One of the other ships lost and officer so I replaced him.\nThe next day we left the States.\n\n     My first watch was the midnight to four and I was really nervous. I didn't\nmake any serious mistakes\n\n[--- 1943-04-07_tom-to-unc_p02.jpg ---]\n\nand finished the trip more a sailor than when I started. The only scare I had\nwas when the rudder stuck but the other ships missed me.\n\n     Our voyage is cut into about five trips the first which was long, the\nsecond damn long, and the rest rather short. These short ones are tough as we\nstand 4 on and 4 off. I still stand the midnight to four which I am beginning\nto detest. I have to fight to keep awake even when I walk around and I don't\ndare sit down.\n\n     As long as I have been on board to-day was the first time I handled the\nship in a harbor. I was the only officer aboard to-day when a storm came up\nand the anchor started to slip. I had to move or go aground so I moved. I hated\nto do it because these ships a[re] very hard to handle in a strong wind. None\nof the men jumped overboard so that gave me a little confindence. I did some\nfancy maneuvering but got the ship where I wanted it.\n\n[--- 1943-04-07_tom-to-unc_p03.jpg ---]\n\n     I can't say much about the ports [crossed out] we have been to. None are\nlike the states. A couple are really outposts and the worst part about all of\nthem is that beer is rationed. One was dry and I tried some native brew made\nfrom bananas which was very tasty but potent. It was like prohibition sneaking\nthrough the woods to some old shack and smacking our lips over some rot-gut. I\nhaven't been ashore here yet but I think this place will be more civilized. It\nlooks like a fair sized city from out here in the bay.\n\n     About the only thing I had to show for my trip was six weeks growth on my\nface. It was jet black and about an inch long compared to my head which is\nblond and 1/2 inch long. I was a damn peculiar looking thing. But lately I have\nbeen wearing\n\n[--- 1943-04-07_tom-to-unc_p04.jpg ---]\n\na helmet and the chin strap and chin wiskers raised hell with my chin so I\nshaved. I also have a rather deep suntan - all I wear is shorts and shoes and\nthe sun has been hot.\n\n     That is about all I am permitted to write and I admit it isn't very\ninteresting.\n\n     I haven't heard from any one since January and I am hoping that all of\nyou are fine. Before I left the rest of the family assured me that Mother was\ngetting along fine. I have never been called upon to do any thing extremely\ndifficult but [crossed out: that] the night I left Mother was the toughest day\nI have had. I am so glad she is fortunate to have so many of her family near\nher.\n\n     I don't know when I will get an opprotunity to write again but I will make\nanother attempt in the future.\n                                        Love to all,\n                                             Tom\n",

   "notes": "This is a V-MAIL (microfilmed and reduced) form, No. 1116, passed by the Naval Censor. Return address: 'Ens. Thos. F. Beck, USS LCI(L) 62, c/o P.M. San Francisco, Cal.' Tom sent a cablegram (1943-04-12) and hopes it didn't scare her. He wrote to Uncle Chauncey, Betty, and Luke, and plans letters to '711 E. Pearl' (an address, perhaps relatives in Butler), Adam, The Becks, Mari, and Sally. He sent $200 home from Galveston. He typed this in the radio room while listening to war news, sports (baseball season), and a waltz.",

   "body": "\n[--- 1943-04-13_tom-to-mother-vmail_p01.jpg ---]\n\n[V-MAIL form, No. 1116. Censor's stamp: \"PASSED BY NAVAL CENSOR\" (initials)]\n\nTo:    MRS. JOHN A. BECK\n       KARNS CITY,\n       PENNSYLVANIA\n       USA\n\nFrom:  Ens. Thos. F. Beck\n       USS LCI(L) 62\n       c/o P. M. San Francisco, Cal.\n       April 13, 1943\n\nDear Mother,\n     I sent a cablegram a few days ago and I suppose that you received it. If\nnot this won't make much sense. Anyway, after I sent I got to thinking about\nand wasn't too sure if it was a good idea. I hope you weren't the least bit\nscared when it came. After all some good news does travel by telegram. Don't\nbe surprised if you receive a few more now and then, I am confident that they\nwill still be good news.\n\n     While underway I haven't much time for letter writing but when we hit\nport I usually plenty time and plenty of desire, but very little material to\nwrite about. The last time I got the urge I wrote to Uncle Chauncey, Betty,\nLuke, and a couple of others. The reason I didn't write you was that I thought\nthe cablegram would be sufficient and it just about covered every thing I had\nto say. I have afew more to get off while I am here: 711 E. Pearl, Adam, The\nBecks, and of course a line or two to Mari and Sally. If we receive our mail\nhere I may have a few more to answer and I will also have an idea what to\nwrite about. There may be something that you want to know and there may be a\nslim chance that I will be able to tell you. I am getting quite anxious to\nknow what has been going on around home for the last few months. (My typing\nis getting worse instead of better.)\n\n     I have been thinking about making out an allottment for about half my pay\nbut can't make up my mind. So far I haven't had much use for money and I\ndon't like to carry too much with me, but then, I might get a fews days off\n(very doubtful) and I would hate to get caught short. If I become too heavily\nladen with greenbacks I can always send home either a bank draft or a money\norder. I think I will wait until I get an excess and then send it home. By\nthe way, did you ever receive the money I sent from Galveston. I think it was\n$200. I still have the receipts in case you didn't receive yours. Right now\nmoney is one of my least worries.\n\n     I am typing this in the radio room and am trying to listen to some of the\nwar news and now it sounds good on all fronts. I hope it has been just as\ngood or better for the last few weeks. I haven't listened to the radio for\nquite a long time. I also heard some sports news and was a little surprised\nto realized that it is baseball season. There has also been some music which\nreally sounded swell. Right now they are playing a waltz which I always did\nlike.\n\n     I think I will go to bed early tonight and attempt to get a full nights\nsleep. It will seem unusual and I probably wake up during the night and get\nready to go on watch. Going without sleep is getting to be a habit with me. I\nam glad I had some experience along that line before I joined the Navy. Also\nI expect to have a rather big day tomorrow, getting the ship really\nshipshape. It is really hard work just overseeing all the work.\n\n     Will write again soon and will not wait until I have any news.\n\n                                        Love to all,\n                                             Tom\n",

   "body": "\n[--- sheet 1 front: 1943-04-15_tom-to-mother_p01.jpg ---]\n\n[Embossed seal: DEPARTMENT OF THE NAVY / U.S.S. LCI(L)-62]\n\n                                                  April 15, 1943\nDear Mother,\n     I am afraid this will be a rather complicated letter and you may have\ntrouble following it. But I have a reason. Yesterday we had Mail Call for the\nfirst time since we left the States. I received 35 to 40 letters and 4\npackages. I was a little bewildered with so many letters at one time and just\nlooked at them trying to decide which one to open first. Finally I decided to\nopen your lastest letter and then the rest of yours chronologically, next came\nBetty's, and the rest were picked at random. I read yours again to-night,\n[crossed out: and] but not in any order, and jotted down quite a few things to\nwrite about. It will be like reading the dictionary, changing the subject\nconstantly. So be prepared for a very incoherent letter.\n\n     I think Izzy would make a fine teacher. She is so well liked by everyone\nand so many people go to her with their troubles that she must give good\nadvice. No one can question her intelligence nor could they find any one more\nlevel headed. I can see only one draw-\n\n[--- sheet 1 back: 1943-04-15_tom-to-mother_p02.jpg ---]\n\nback - I think she will find it difficult in disciplining both pupils &\nherself. That is a tough job and is my only worry on board ship.\n\n     As for George's grades you can use mine to prove that they could be\nworse, but for heaven's sake not as an example. I don't believe there is any\ncause for him to worry. As for the draft, tell him to take his time and think\nbefore he makes a decision. I don't think I am being unpatriotic in saying\nthis - too many young men are too concious of others in uniform and perhaps we\nwho are in uniform do not make it any easier but we also envie at times those\nthat wear civies. I hope George has no illusions of a service man's life. It\nis tough and abnormal. It is time spent doing a duty that has to be done and\nwe are trying to do as quickly as possible so we can again go back to a normal\nliving at home.\n\n     After getting that off my chest I don't know just what to say about\nBill J. and Dick B. It is nice that Bill is making the best of it and is\ngetting along fine. He should get some where [in rank, inserted] before it is\nall over. As for Dick, I think it might be that he finds it difficult to get\naccustomed to the discipline\n\n[--- sheet \"-2-\" front: 1943-04-15_tom-to-mother_p03.jpg ---]\n\n                              -2-\nI understand that an aviation cadets life is no dream. It is much more\nstrenuous than what I went through - both in studies and physically. After a\nweek or so Dick will begin to like, perhaps not like it but he won't mind it.\nThe service teaches you to fight but you can't fight the service. I might as\nwell include the other service men now. At one time Don W.'s rating didn't mean\nanything to me but now I realize that he must be good, more ways than one, to\nget to where he is now. He is getting up rather high, especially in the\nregular Navy. All I can say for his brother is that I don't know why he waited\nso long. She had him conned for years. I haven't seen Geo. W. but we might meet\nsome day.\n\n     I am not surprised at being on the honor roll at the office. They\nrecognized me as an employee last year when I received the Christmas gift - my\nfirst. Perhaps the reason they knew I worked\n\n[--- back of sheet \"-2-\" NOT SCANNED - passage missing ---]\n\n[--- sheet \"-3-\" front: 1943-04-15_tom-to-mother_p04.jpg ---]\n\n                              -3-\ntaken care of. They were a very happy couple.\n\n     The next subject is one I am not too familiar with and perhaps should be\nomitted. I shall just mentioned the future ones or as some one remarked \"a\nlittle inside dope\". I can't make out from yours letters if Harriet's baby came\nor is she still expecting. It is difficult to picture Mary Jane as a mother. I\nhope I am home shortly after Betty has hers to see U. Paul's chest come out. He\nwill have to stretch some if he puffs up like Dad did. Of course that is the\nfuture and I would like to hear more about the present. Some mothers do talk\ntoo much about their children but I know one that doesn't tell me enough and I\ncan include a grandmother who doesn't say enough about her grandson. She writes\nwhile sleeps and that is about all she says. The mother did mention a few\nincidents but not enough. I wish I could have been in Butler watching the\ncherub and the painters. It must be interesting and amusing (at times not for\nBetty) to watch him grow up. I think I am missing an important part of his\nlife. I suppose a year or so\n\n[--- back of sheet \"-3-\" NOT SCANNED - passage missing ---]\n\n[--- sheet \"-4-\" front: 1943-04-15_tom-to-mother_p05.jpg ---]\n\n                              -4-\nis another man that is working too hard and should take it easy.\n\n     I was quite surprised to hear of Lucy McClung's marriage. I thought she\nwas still going with the boy from Toledo (?) [?]. I hope that Mrs. McClung and\nBetty can still keep their apartment.\n\n     You mentioned that trip we have been talking about for the last few\nyears. I have taught [thought] about it many times and I have a honey planned.\nI won't tell you where but I think it probably would take all summer to make\nit and it isn't on water. Forget the first part of the last sentence and you\ncan do some work on the atlas figuring out the routes we take. I am thinking of\nthe new Alaskan Highway the Army is building. It would be a beautiful trip and\nI will still plan for it even if it turns out to be a dud.\nNo one can stop me from dreaming although most of them\n\n[Written vertically in right margin beside the embossed seal:]\n     What do you think of our ship's seal?\n\n[--- sheet \"-4-\" back: 1943-04-15_tom-to-mother_p06.jpg ---]\n\nare pipe dreams.\n\n     My whites and shoes arrived with the mail. I don't have any use for and\nnever did. All I have worn on this trip is khakies, perhaps we will start\nwearing blues again but I am hoping we won't.\n\n     You mentioned you have ceased worrying about me. That's good because\nthere is no need to and it won't do any good any way. You just take it easy\nand assert yours rights as Pres. of Beck, Inc. Go to Butler or any other place\nyou desired to. Why not go to Pitts. with John over the weekends. If I am\nreading between the lines what I think is there he either needs a chaperon or\nFran will need a bridesmaid.\n\n     I appreciate the folks sending food, etc. but it is really not worth\nwhile. There is probably more candy and cookies here than in the states and no\ndoubt fresher.\n\n     If you mind isn't traveling in circles by now you are a better man than I\nam and I haven't finished my list yet. No doubt I will repeat quite frequently\nmost of this letter when I start rereading my mail. Please forgive me if I do.\n                                        Love to All,\n                                             Tom\n",

   "body": "\n[--- 1943-04-21_tom-to-mother_p01.jpg ---]\n\n                                                  4/21/43\nDear Mother,\n\n     In my last letter I just about exhausted my supply of news and now I\ndon't know what to write about. I thought I would be getting mail regularly\nhere but haven't received any since that one time. It is much easier to write\nafter receiving a letter even tho' I do write back the same thing.\n\n     It is rather foolish to say I am fine and dandy because if I wasn't I\nwouldn't be writing. Most of the letters I censor start out with \"Just a few\nlines to let you [crossed out] no I am fine and sure hope you all are the\nsame.\" I might start mine that way from now on. At least the last part is\nalways my hope.\n\n     Everyone I write to should realize by this time what a poor speller I am,\nbut I have found out that I am not the worst. I have even found some writing\nworst than mine. I think the Navy should [small insertion above line:\n\"(any as bad as me)\" ?] make all sailors write with a typewriter.\n\n     We had a stroke of good luck the other day. We received in a transfer a\ncox\n[--- possible gap: text between pages not present in scans ---]\n\n[--- 1943-04-21_tom-to-mother_p02.jpg (marked \"-2-\") ---]\n\n(I am using this paper because of Air Mail limitations and didn't realize that\nI couldn't write on both sides.) He has been in the Reserves for 15 years and\nhe knows his Navy which is a big help to all of us.\n\n     We have all been working quite strenuously since we have been here and the\nlast two days were rather tough on me. I spend most of my time in the conning\ntower and while there I can't sit down. It is tiresome especially on the legs.\nI was planning on going to bed early tonight but no one else is going ashore so\nI will have to go myself in order to get this letter posted. I am ready now but\nthere is no sign of a liberty boat. If it does come around I probably won't get\na chance to mail this for a week.\n\nThe boat is here.\n                                        Love,\n                                             Tom\n",

   "by_tom": true,
   "date": "1943-04-25",

   "date_source": "written on letter ('April 25, 1943'); Easter Sunday 1943 was April 25, which confirms it",

   "notes": "Now complete with page 4 from the Adobe folder. Easter turkey dinner with Ritz-cracker stuffing, losing track of days, disillusionment with foreign travel ('See America First'), radio news, and packing away winter gear from Little Creek. He is borrowing John's bag. The P.S. asks whether it is 'safe now to send John around to check up on a few things at 316 Second Street' (a Tom-related address, unexplained). 'Air-mail is the best service out here.'",

   "body": "\n[--- 1943-04-25_tom-to-mother-and-all_p01.jpg ---]\n\n                                                  April 25, 1943\nDear Mother & All,\n\n     I could start off complaining about the mail but I know it isn't your\nfault so I won't go into any details.\n\n     Today started out as all other days and ended the same. There was one\nexception and that was dinner - we had roast turkey, stuffing (made from Ritz\ncrackers), mashed potatoes, peas, gravy, and pumpkin pie for dinner. I was\ncurious about the feast and was informed it was Easter Sunday. I should have\nknow because a couple of mornings ago the Eng. officer gave me his bacon. It\nis strange how the days come and go so fast that I have no idea what day is\nwhat. I use to be able to tell Sunday as the day of rest from the night before\nbut not now. It is just another day of long, hard labor. It is also strange\nthat the more work I have to do the more contented I am (that doesn't include\ndeck watches). I suppose the answer is that\n\n[--- 1943-04-25_tom-to-mother-and-all_p02.jpg (marked \"-2-\") ---]\n\nthe more I have to think about the ship the less time I have to think about\nother things, especially the past.\n\n     I do try to forget the past and make plans for the future and that takes\nabout all my spare time. As I see the future at home again has very few dark\nclouds and we all should have few worrys. Of course, that is the future and we\nhave to let it decide for itself.\n\n     I often thought I was fortunate in being able to see foreign lands and\nstill get paid for it. I am not too sure now. I will say this that most of it\nis beautiful, especially the first [crossed out] view but it loses its beauty\nrapidly. I don't think I will ever be foolish enough to spend, or waste, any\nmoney on an ocean voyage. I will whole heartedly back the man that orginated\nthe phrase \"See America First.\"\n\n     We have heard a few news broadcasts\n\n[--- 1943-04-25_tom-to-mother-and-all_p03.jpg (marked \"-3-\") ---]\n\nfrom the states and right now it sounds o.k. I hope it continues. It is so\nseldom that we can [crossed out] use the radio for such purpose that we are\nquite fortunate to get any recent news a couple times a week. It is some\ncomfort to hear American broadcasts and the crew really goes for the musical\npart. I always did find it difficult to keep up with new bands and the recent\nhits and [crossed out: now] I am 'way behind. Some night I am going to tune in\non an old fashion hoedown and sit back and enjoy myself.\n\n     I was cleaning out a compartment to-day the one we keep our baggage in. I\nwent through my bags again and put all the stuff in one bag. You can guess\nwhat most of it was long underwear, heavy sweaters, gloves, scarfs, and woolen\nsox. As I was packing them I thought of the two weeks I was aboard ship at\nLittle Creek and how dreadfully cold it was then. There has been a change\n\n[--- 1943-04-25_tom-to-mother-and-all_p04.jpg (marked \"-4-\") ---]\n\nin the weather. It is quite a problem what to do with the winter clothing, but\nI am going to hold on to it as long as possible. I hope the salt water doesn't\nget to it before I can use it again. I am also afraid John's bag is going to\nlook a little salty.\n\n     I will attempt another uneventful, newsless, but spacing taking letter\nsoon. It is now 2139 and I have to be up and raring to go at 0600. As an\nofficer I must set an example for the men and that isn't an easy task so early\nin the morning.\n     Tell everyone I said hello.\n                                        Love to all,\n                                             Tom\n\nP.S. Do you think it is safe now to send John around to check up on a few\nthings at 316 Second Street?\n\nP.P.S. Air-mail is the best service out here.\n",

   "id": "1943-04-30_tom-to-mother-vmail",
   "title": "Tom to Mother (Mrs. John A. Beck, Karns City, Pennsylvania)",
   "written_by": "Tom",
   "written_to": "Mother (Mrs. John A. Beck, Karns City, Pennsylvania)",
   "by_tom": true,
   "date": "1943-04-30",
   "date_label": "April 30, 1943",
   "sort_date": "1943-04-30",
   "approximate": false,
   "date_source": "typed on V-mail form ('APRIL 30, 1943')",
   "other_dates_mentioned": [],
   "location": "South Pacific, aboard USS LCI(L) 62 (via Postmaster San Francisco)",
   "complete": true,
   "notes": "V-MAIL, typed, passed by the Naval Censor. No mail from home since the big April 14 mail call; the last letter was from Aunt Harriet. Experienced Navy transfers have eased Tom's deck supervision. He is acting as ship's Yeoman while the Radioman/Yeoman is away. He looks up every destroyer hoping to find Don (Izzy's connection; Don W. in the regular Navy, 1943-04-15), whom Izzy may be linked to romantically. Typed Morse-like marks at lower left may be a coded sign-off.",
   "content_note": null,
   "rescan": [],
   "pages": [
    {
     "page": 1,
     "file": "scans/1943-04-30_tom-to-mother-vmail_p01.jpg",
     "width": 1175,
     "height": 1625
    }
   ],
   "body": "\n[V-MAIL form, No. 1070 [?]. Censor's stamp: \"PASSED BY NAVAL CENSOR\" (initials)]\n\nTo:    MRS. JOHN A. BECK, KARNS CITY, PENNSYLVANIA, USA\nFrom:  ENS. THOMAS F. BECK, USS LCI (L) 62, c/o POSTMASTER SAN FRANCISCO, CALIF.\n       APRIL 30, 1943\n\nDear Mother,\n     The only thing I don't like about these letters (V-Mail) typewritten is\nthat it takes so much to fill one page. I have a few hours before I go on\nwatch and perhaps I can think of enough to complete this. As usual I have the\nmidnight to four watch and to-night I am not very anxious to go on. It isn't a\nnice calm moonlite night. And as usual when I sit down to do anything there is\nalways plenty of interruptions and to-night is no exception. It is tough enough\ntrying to make a letter coherent and when I have to leave every five minutes\nit takes a long time for me to get back in the mood and to what I was trying\nto write about. One sure thing, you have to read my letters twice to get at\nleast an inkling of what I mean.\n\n     I hate to be continuously harping on one subject and I have tried to\nrefrain heretofore but now I am unable to control myself. I believe you know\nwhat I am refering to - MAIL. I have received a few letters since that one\ngrand haul I made but there weren't any from home. The last ones I received\nwas from Aunt Harriet. I still feel, and I can't see where I can be mistaken,\nthat it isn't your fault and I don't know just who to blame. Some mail has been\ngetting through to the other men, but then we all feel that it isn't all\ncoming through. Perhaps there is just too much mail coming here for them\n(USNFM [?]) to handle it all. I do believe that Air Mail is a little faster\nthan V-Mail, but not as dependable. Mail is one thing I can bitch about and get\naway with it and, consequently, I blame everything that goes wrong on the\nmailman. I do like to know just how everything is progressing and how you all\nare at home. I haven't got used to \"No news is good news.\"\n\n     We have had a few transfers on the ship and in most of them we got a\nbetter man than what we gave up. Most of the men we have been getting have\nspent a few years in the Navy and are experienced men. They have taken a large\nburden from me in supervising the deck work. Also, in handling the men. The\nmore of this type of men we get the better I like it. We lost our Radioman for\na few weeks and he was the ship's Yeoman. While he is away I have taken over\nhis job (Yeoman only) and it has given me a chance to brush up on my typing.\nIf he stays away for two or three months my typing should be fair again or do\nyou think I should need a stiffer brush.\n\n     Some of the boys on the ship have met buddies from home in these various\nports, but I haven't seen a soul I know except the ones from John Jay who came\ndown with me. You can tell Izzy that I look up the name of every destroyer I\nsee and as yet haven't even come close to seeing Don. I think the chances are\nvery slim of our meeting. Outside of Don I don't know anyone from home that is\nin the Navy. At least, I can't think of any one.\n\n     Well, I filled the page and didn't say a thing worthwhile, but I hope my\nblabbering isn't a waste of paper and time and that you get some enjoyment out\nof attempting to translate it.\n\n[Morse-code-like dots and dashes typed at lower left]\n                                        Love to all,\n                                             Tom\n",

   "body": "\n[--- 1943-05-03_tom-to-mother_p01.jpg ---]\n\n                                                  May 3, 1943\nDear Mother,\n     I have a few spare minutes so will attempt to enlighten you somewhat on\nthe routine life of a sailor. As I have often stated before my letter writing\nis full of interruptions. For example, so far I have stoped for a few minutes\nafter each each of the first two sentences. Now the Captain just finished\ntelling some plans for to-morrow - thus, from the above you can gather how\ndifficult a task it is to compose a pleasant, coherent letter not to mention\nthe limited supply of news. Another important factor is the writer. When you\ntake everything into consideration you can't expect much. Now that that\nsubject is settled and completely understood by all I can proceed further\ninto my explonations.\n\n     In a previous letter I stated I\n[line cut off at bottom of scan - probably \"would write to you every ...\"]\n\n[--- 1943-05-03_tom-to-mother_p02.jpg (marked \"-2-\") ---]\n\nday and that still holds good. The only catch is my attempts are futile.\n(One minute please, we are having Mail Call. Well, I finally received a letter\nfrom home. It was posted in Petrolia and the date isn't clear, but I think it\nwas April 7. It was the first one from you since [crossed out] April 15. I will\nwait awhile to answer it.) I have an excuse for not keeping my promise and no\nmatter how lame it is it is an excuse. There is always work to be done during\nthe day and usually some at night. The men haven't been receiving mail either\nand are writing plenty of letters tell every one about it. The more they\nwrite, the more I have to censor and lately that has been a big undertaking.\nI know how the men feel about having their mail go out so I do my best to get\nit censored\n\n[--- 1943-05-03_tom-to-mother_p03.jpg (marked \"-3-\") ---]\n\nand sent ashore as quickly as possible. That is the picture, the time I spend\ncensoring mail is the only time I have to write my own letters.\n\n     The work aboard ship is going on as usual but now something new has been\nadded - night school and guess what they are teaching - Navigation. I am so\nthankful that I took that six weeks at Pitt, three months at John Jay, plus\nabout two months of practical work. It helps me so much in this elementary\ncourse I am now taking. They haven't even changed the book. That just about\ncovers my undertakings.\n\n     While I was in Galveston I sent a money order home and, as yet, haven't\nheard whether or not it was received. I still have the receipts and would\nlike to do away with them if you have the\n\n[--- 1943-05-03_tom-to-mother_p04.jpg (marked \"-4-\") ---]\n\nmoney. Also, I sent a cablegram from one of the ports but I am not sure just\nwhen. Perhaps it was after the 7th so I may hear about it in a latter letter.\n\n     I am quite disappointed that I can't do any thing about Mother's Day. The\nchoice of gifts is very limited here, if and when I could get ashore to buy\nany. The only thing I can do is hope that I will be able to make up for it\nnext year or perhaps the following year. I will at least be thinking of you\nall the more on that day.\n\n     Yesterday I received a V-mail letter from Aunt Lyle dated April 2. Adding\n2 and 2 and subtracting the time for the pony express to get to K.C. I have\nconcluded that Air Mail is the\n\n[--- 1943-05-03_tom-to-mother_p05.jpg (marked \"-5-\") ---]\n\nfaster of the two. Nevertheless, both are welcomed with open arms, hungry\neyes, and then with a happy heart.\n\n     It is now 2245 which is late for me now and I still have some work to do.\nI have to make up a routine for to-morrow and there is one part that never\nchanges, at least never get later - [crossed out] 0600 - Reveille - all hands.\nI still don't like to get up early.\n\n     Tell the folks I said hello and that one of these days I will find time\nto answer a few letters. I will still try to keep my promise to write to you\nevery day. I think by now you are accustomed to a few pages of just writing.\nPerhaps I should be an artist and illustrate some.\n                                        Love to all & all my love,\n                                        [signature cut off at bottom of scan]\n",

   "body": "\n[--- 1943-05-09_tom-to-mother-mothersday_p01.jpg ---]\n\n                                                  Sunday May 9\nDear Mother,\n     As per usual this was just another day out here and one that I wish I\ncould have spent at home. I must admit that to-night I am thinking of you and\nhome - much more than than ordinarily - and accompaning that thought is a bit\nof homesickness. There is one nice thing about our work that I like and\n[crossed out] it is that we don't have much time to think of other things. It\nis a very weak consolation.\n\n     We did get one afternoon for recreation so we hit the beach and all went\nashore. We had some beer on ice and took that with us. I played some foot ball\nand soft ball and found out that I have a few muscles that weren't being used.\nI am still suffering every time I go up or down a ladder. I will gladly\n\n[--- 1943-05-09_tom-to-mother-mothersday_p02.jpg (marked \"-2-\") ---]\n\nsuffer the after effects for a few hours relaxation now and again.\n\n     The Captain was sick for a few days and the Eng. Officer & myself were\nrunning the ship. It was such a difficult job but it made too much work for\nme. He is o.k. now and I am begining to get back in shape. I will be quite\nthankful when we hit Port again.\n\n     I didn't realize it was so late when I started this letter. It is after\n10 now and the rest are in bed trying to sleep so I had better turn in. I am\nsorry this letter is so short but I will try to write a longer one in a few\ndays.\n                                        Love to all,\n                                             Tom\n",

   "notes": "IMPORTANT FAMILY CLUE: Mother gave books to the school in Tom's name, and Tom asks 'What picture of Dad are they going to use in the school-house?', which suggests a memorial to Dad. Together with Dad's illness in Nov. 1942, Tom's Christmas 1942 leave home, letters from Feb. 1943 on addressed only to Mother, Tom calling leaving Mother 'the toughest day I have had' (1943-04-07), and 'puffs up like Dad did' (past tense, 1943-04-15), this strongly suggests Tom's father, John A. Beck, died around December 1942 or January 1943 (not stated outright in these letters; worth verifying). Other items: George chose Navy V-12 (Tom mistakenly thinks it's the WAVES); Dick is in sick bay rooming with Armstrong (Tom's Penn State friend) and may be assigned to Slippery Rock; the family cottage (probably 'the Lake'); Henry is on the African front; winter clothing may be sent home. He likes Zane Grey, Thorne Smith, and Balzac. P.S. to Jackie.",

   "body": "\n[--- 1943-05-11_tom-to-mother_p01.jpg ---]\n\n                                                  May 11, 1943\nDear Mother,\n     I wrote a short note last night so I would have at least one letter going\nout in the mail to-day. It was the first chance we have had for a week to send\nmail and everytime we send mail we expect some in return. I am hoping for some\nto-day.\n\n     I just finished rereading your Apr. 7 letter and it was just like a fresh\none. I have been quite busy after first receiving it and didn't get a chance\nto reread it until to-day.\n\n     I just asked the Engineering Officer what branch of the Navy V-12 is and\nhe said the Waves. If he is correct, I think George made an excellent choice.\nI might try for a transfer myself. Whatever it is I hope George makes it and\nthat he will like his work.\n\n[--- 1943-05-11_tom-to-mother_p02.jpg (marked \"-2-\") ---]\n\n     I was sorry to hear about Dick being in Sick Bay. He certainly seems to\nget more than his share of tough breaks. He was fortunate to get to room with\nArmstrong. I think it is much easier picking up an old friendship than always\nmaking new ones. It would be nice if he could get an assignment in Slippery\nRock. That was the first I have heard of Armstrong's whereabouts since I left\nState.\n\n     Thanks a lot for giving those books in my name. I personally think Zane\nGrey's books are a lot better than a lot of the modern best sellers. Of course\nI like Thorne Smith and Balzac but I doubt if the School Board would\nappreciate them. What picture of Dad are they going to use in the\nschool-house? And speaking of pictures, is there\n\n[--- 1943-05-11_tom-to-mother_p03.jpg (marked \"-3-\") ---]\n\na small one of the family you could send me. A miniature of the last group\npicture we had taken.\n\n     Right now I think it is foolish of you to keep the cottage open in hopes\nthat I might get any use out of it this summer. I will be quite fortunate if I\nget home before Christmas. At least I am not planning on anything before then.\nOf course it would be nice to leave the cottage open just in case you want go\nup for a week-end to cool off and relax.\n\n     I am glad they are still hearing from Henry. I haven't heard any news from\nthe African front but imagine that there is still plenty of fighting going on\nthere.\n\n     Don't get frightened if you receive most of my winter clothing in the\nmail. It has been suggested that we get rid of our blues, whites,\n\n[--- 1943-05-11_tom-to-mother_p04.jpg (marked \"-4-\") ---]\n\nand other clothing that we don't need. If I can't find stowage for them here I\nwill probably send them home. I will let you know before hand.\n\n     I have some other mail to answer and I hope some to read when the mail\norderly gets back so I had better close now. I shall write again soon.\n                                        Love to all,\n                                             Tom\n\nP.S. Tell Jackie I said \"hello\".\n",

   "body": "\n[--- 1943-05-16_tom-to-mother_p01.jpg ---]\n\n                                                  Sunday Night\n                                                  May 16, 1943\nDear Mother,\n     I received a letter from Betty to-day (Apr. 28) and from it I gathered you\nare just beginning to receive my mail. I was hoping that at least my mail was\ngetting through o.k. We should be satisfied that it is getting through to both\nof us.\n\n     So at last John has made up his mind. It really wasn't much of a surprise\nto me. I would like to be home for the big day but I am afraid that if he\nwaits for me it will be a long engagement. I will be satisfied just as long\nas you keep me informed. Also in the same subject I understand Uncle John\nfinally gave in. Libby stuck to her guns for a long time. Is she\n[line(s) cut off at bottom of scan]\n\n[--- 1943-05-16_tom-to-mother_p02.jpg (marked \"-2-\") ---]\n\nstaying at home or going back with Buddy?\n\n     When speaking of weddings one thinks of clothes so I might just as well\nconfirm what I said the other day. I am sending all my woolen stuff, raincoat,\nwhites, and a few miscellaneous thing to you. You can either stow them, wear\nthem, or throw them away. If I have any use for them in the future I can buy\nsome more because no doubt if and when I want them I won't have time to wait\nfor delivery. They are packed in two containers - mailing case & John's\nsuitcase. I am to ship them to-morrow and you can expect them in 4 or 5 weeks.\nThey are just excess clothes not needed\n[line(s) cut off at bottom of scan]\n\n[--- 1943-05-16_tom-to-mother_p03.jpg (marked \"-3-\") ---]\n\nwith me physically - mentally (?)\n(See Note) This check is the same one I received upon arriving here. I can't\ncash it and don't need money and can't see any reason for keeping it aboard.\nEither use it to buy some nice big juicy steaks or put it in the bank. If my\nfinancial adviser (John) so advises buy a bond. Perhaps better still, buy some\nbonded.\n\n     I haven't listened to the radio for a few weeks but I am told that Africa\nis just about de-loused. That is good news to me in two ways - First, I am\nglad to hear of any front being taken; second, the fewer the fronts the\nconcentrated they become. I trust they are still hearing from Henry.\n\n     Speaking of fronts I hear from sources outside the family that Marge is\nbecoming a [beautiful, partly cut off] young lady. She was\n[line(s) cut off at bottom of scan]\n\n[--- 1943-05-16_tom-to-mother_p04.jpg (marked \"-4-\") ---]\n\nwell on her way the last time I saw her. She has a birthday around the 27th\nof this month if my memory is correct. Strange how I can remember birthdays\nwhen I am in a locality where gifts are unobtainable.\n\n     I did buy a little gadget the other day with no particular reason in mind\nexcept perhaps they are scarce as hen's teeth. It is part of our uniform. When\nin khaki we are allowed, some places ordered, to wear overseas caps. This\ndevice goes on the cap so one can tell a Naval officer from a buck private. I\npersonally don't like the caps so I haven't any use for the device. The Eng.\nOfficer sent his home to his wife. Civilians are not permitted to wear them so\nthat is why I have hesitated sending mine to you. Also, you no doubt have\nenough jewelry. But if\n\n[--- 1943-05-16_tom-to-mother_p05.jpg (marked \"-5-\") ---]\n\nI do decide to send it and forget to tell you, you probably can wear it\nbecause I doubt if anyone around home knows a damn thing about Navy Regs. It\nis only hearsay as far I am concerned.\n\n     It is 2300 and a very busy day tomorrow to look forward to.\n                                        All my Love,\n                                             Tom\n\nNote: Due to lapse of memory or carelessness I can't find the check. I can't\nremember whether or not I sent it to you before. Will make a thorough seach\nsoon and will let you know.\n",

   "body": "\n[--- 1943-05-17_tom-to-mother_p01.jpg ---]\n\n                                                  May 17, 1943\nDear Mother,\n     Being a very busy person and with 10 mens work to do immediately, I am\ngoing to take time off to write. There is no urgent need for a letter but I\njust happen to be in the mood.\n\n     As you can plainly see I found the check. I had to go through all the\nletters I had saved and then remembered where I put it. My [crossed out:\nmemory] still isn't the best. I saved only the ones from the family plus a few\nothers. While reading Marge's letters it seemed strange for her to be talking\nof dances, etc. She must really be growing up.\n\n     The life here isn't always routine. Yesterday, while unloading the\npersonal clothing that we are sending home, I went through hell. I was to see\nthat the clothes were taken care of and it was a tough job. I had a difficult\ntime getting a boat to get ashore and when I did get ashore I had a more\ndifficult\n\n[--- 1943-05-17_tom-to-mother_p02.jpg (marked \"-2-\") ---]\n\ntime finding the right storehouse. When I did find it they wouldn't take\ncardboard boxes so I had to send them back to the ships. But, and this was\nwhat topped off everything, while unloading I dropped a box overboard. You\nprobably have guessed whose it was - the Captain's. Knowing the Captain has a\ntemper, I sent his clothes back with a Seaman and I went to the Club. By the\ntime I got back he had cooled off. He even spoke to me. I understand he spoke\nto the poor Seaman too.\n\n     I am not complaining now, but just remarking that I haven't received a\nletter from you for a few days. I really expect one to-day. If not to-day,\nthen to-morrow or the day after. I know there is more than one on the way.\n\n     I am anxious to hear what the Clinic said about your eyes. Betty said\nyour health is excellent, which certainly wonderful news. I do hope they can\nhelp you eyes because I know they did bother you considerably. Your keep your\nhealth in good condition and I will attempt the same with mine and then when\nI get home we both\n\n[--- 1943-05-17_tom-to-mother_p03.jpg ---]\n\ncan lead a wild life for awhile.\n     As per usual when I want to finish a letter I end up at the top of a new\npage and then have a hard time filling out the rest. It will be different this\ntime and will close now.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-05-24_tom-to-mother_p01.jpg ---]\n\n                                                  May 24, 1943\nDear Mother,\n     As I have said before there will be times when you won't hear from me for\nseveral days and if a few days have elapsed between the last letter and this\none you can tell we have been underway again. Of course I could write while\nunderway but still couldn't mail it until we hit port. I have very little\nspare time to write when underway. I am still standing the 12-4 watches which\nI don't mind so much now.\n\n     There is one thing you mentioned in one of your old letters just received\nwhich I forgot to tell you about. Just before leaving I had Uncle Frank's gun\nready to take into him but failed to do so. My memory isn't so good any more\nbut I think the bolt for the gun should be in the front bedroom. I am very\nsorry about not\n\n[--- 1943-05-24_tom-to-mother_p02.jpg ---]\n\nreturning it and hope that it hasn't caused anyone any trouble. Uncle Frank\nwas so good to me by letting me use it. I might get him a Jap rifle in return.\n\n     There is one subject which will usually take a full paragraph and\nsometimes a whole page - Mail. I won't dwell on the subject long but just\nmention that it will probably take a few weeks for it to catch up with me\nagain. It is one thing worth-while waiting for.\n\n     I had a rather full day to-day and expect a busy one to-morrow. We pulled\nin here at dark so I want to get a look at the place. It is 2130 so will\nclose.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-06-11_tom-to-mother_p01.jpg ---]\n\n                                                  June 11, 1943\nDear Mother,\n     Yesterday morning I went ashore for some supplies and the trip was longer\nthan I expected. I was waiting on the dock for a boat back when the boat for\nthe Officer's Club pulled up. I put the stuff in the boat and joined the rest.\nOn the way we stopped for mail and I received two from you. Both were recent,\nMay 28, & 31. In them were Jackie's pictures, Henry's letter, and John's\nannouncement. I really had a few very enjoyable minutes - sitting under a\ncoconut tree drinking beer and reading mail from home.\n\n     I wrote Henry last night and decided to wait until to-day to answer your\nletters.\n\n     It is too bad the rain is holding up the spring planting. There is still\n\n[--- 1943-06-11_tom-to-mother_p02.jpg (marked \"-2-\") ---]\n\nplenty of time left for gardens. The rain is the same all over the world - it\nmakes every thing so dismal and every one so disagreeable. The work goes much\nsmoother when the sun shines.\n\n     The war news is doing a lot to cheer us up. The Allies seem to be doing\nwell on all fronts and, by the news from Washington and London, we will doing\nmuch better shortly. It is only a matter of time and time passes quickly out\nhere.\n\n     It must have been a relief to all to hear from Henry. Africa shouldn't be\ntoo dangerous now.\n\n     So John has made his intentions known to the public. He is caught now and\nthere isn't much he can do about it. I would like to be home for the wedding\nbut that is impossible. He probably stick me for a wedding present any way but\none sure thing\n\n[--- remaining page(s) missing ---]\n",

   "body": "\n[--- 1943-08-01_tom-to-mother_p01.jpg ---]\n\n                                                  Sunday\n                                                  Aug. 1, 1943\nDear Mother,\n     The boat is coming soon to take our mail so I will write just a few\nlines. Received a few more letters which I will answer later.\n\n     I am glad George likes the Navy. Of course he hadn't spent much time there\nwhen he wrote. I am anxious to hear what he has to say after a few months of\nit. Whether or [crossed out] not he realizes it, he could be in a lot poorer\norganizations.\n\n     I am waiting patiently for the story on the wedding. John really did get\na break getting Stephens furniture. Is he going to use the house too.\n\n[--- possible missing page ---]\n\n[--- 1943-08-01_tom-to-mother_p02.jpg (left edge cut off) ---]\n\n     For once I can't say every thing is [a]s usual. During the afternoon I\ndeveloped [a] headache, the first for a long time. [I] believe it was too much\nsun that [c]aused it. At least I hope that was [th]e cause. Otherwise, life is\nas [u]sual.\n\n     There are plenty of stories going [a]round that we may get home soon.\nPersonally, [I] will believe that when I get home not [b]efore. I could stand a\nlittle rest but I [gu]ess that there are plenty that need one [w]orse than I do.\n\n     This is a silly letter but I [j]ust wanted you to know I am still\n[t]hinking of you.\n                                        Love,\n                                             Tom\n",

   "body": "\n[--- 1943-08-19_tom-to-mother_p01.jpg ---]\n\n                                                  Thurs.\n                                                  Aug 19/43\nDear Mother,\n     I was ready to hit the sack and was putting something away when I came\nacross some pictures. My last letter just went out yesterday and I didn't\nintend to write for a few days but I changed my mind. My assortment of pictures\nis small but very valuable. They include the ones of Libby's wedding, 4 of the\nkid, 2 of you, 6 of the kids & the magnolia, 1 of Luke & Lena & 1 of just Luke,\nand last but not least one of Mari.\n\n     The pictures bring back a lot of memories and they seem to take me much\ncloser to home. When I look at them I wonder just what each one of you are\ndoing and how you are getting along. There are times when they make\n\n[--- 1943-08-19_tom-to-mother_p02.jpg ---]\n\nkind of homesick but usually they cheer me up as I feel closer to you. I never\nbefore cared much for many pictures but now I am not hesitating to ask you to\nsend a lot of them to me. I would like to have a better one of you. See what\nyou can do about it.\n\n     I am surprised at Isabel. An Old Sea B (what is the proper word for a\nfemale Sea Dog) like her should know that single bars come in both gold and\nsilver. Also, that the Navy is full of \"Mustangs\". While on the subject how is\nthe Boot getting along. He wrote once, shortly after arriving in Lewisburg,\nand I am expecting another letter from him. He is almost as bad as the rest of\nyour\n\n[--- 1943-08-19_tom-to-mother_p03.jpg ---]\n\nfamily. I shouldn't have said that because I realize that one letter from the\nhouse is enough and you are really doing your part. I don't mean that I don't\nlike to hear from them.\n\n     In that clipping your sent about the parties, etc. for John & Fran there\nwas one other name that was prominent. It seems like one Mrs. J. H. McClung\nJr. grabbed all the prizes. Did you have any trouble with her around the\nwedding gifts? Jackie must being wrecking the house.\n\n     I had better knock off and get some shut-eye. I am still thinking of you\nand hope that you are as fit as I am.\n                                        Love,\n                                             Tom\n\n[Written at bottom left:] Beck, T.F. ENS.\n",

   "body": "\n[--- 1943-08-24_tom-to-mom_p01.jpg ---]\n\n                                                  Tuesday Eve.\n                                                  Aug. 24, 1943\nDear Mom,\n     I received mail about five days ago and this is the first chance I have to\nanswer. I thought I would have a lot of mail to-day but was fooled. It isn't\ncoming through. I guess its priority isn't high enough.\n\n     I enjoyed the articles by Ernie Pyle especially the way he treats the sea\ngoing barges and the officers. I quite agree with him in a lot of respects. It\nis strange you haven't seen pictures of the LCI's as quite a few papers\ncarried their pictures. We were even mentioned in Time a few months ago.\n\n     The stag party sounded like a big affair. Practically everyone must have\nbeen there. When you mentioned\n\n[--- 1943-08-24_tom-to-mom_p02.jpg (marked \"-2-\") ---]\n\nthe refreshments I couldn't help think of what a beautiful hangover I would of\nhad. Hot dogs always were hard on my stomach. I am sorry about Nunks.\n\n     This was the first I heard about Tucker joining the Navy. Once before you\nmentioned he was leaving and I took it for granted that it was the Army. Is he\ngoing in as a \"Boot\" or will he get a rate. It seems to me that he has enough\nexperience to go in with some rating. At least I am sure he will be sent to\nschool and not be just a seaman.\n\n     I hope Glenn Scott likes his new assignment. The big ships have their\nadvantages and their disadvantage. Of course we of the small craft have our\nopinions of the men that come of the large ships. I don't imagine I would\nraise a kick if\n\n[--- 1943-08-24_tom-to-mom_p03.jpg (marked \"-3-\") ---]\n\nI were transfered. I am about ready for a soft birth and an easy life for\nawhile.\n\n     I finally found out where Geo. Wagenhorst is and his address. I guess we\nhave been working to-gether and didn't know it. I am going to write to him and\nsee if we can't get to-gether some time.\n\n     I am glad Sally received her ring although it sounds like Johnny will be\nleaving soon.\n\n     I have about two months pay on the books and one of these days I expect to\ncollect my travel allowance from Norfolk to Houston. I never got around to\nhanding my orders in. It will amount to about $100.\n\n     I expect news of the wedding soon so shall save my arm until then.\n                                        Love to all\n                                             Tom\n\n[Written at bottom left:] Beck, T.F.\n[Large handwritten \"383\" (?) in pencil across the middle of pg3 - probably a\nlater archival/censor mark]\n",

   "complete": true,
   "notes": "KEY FAMILY: John married Fran in August 1943 (Mother 'getting a daughter'), and Mother had her birthday in August (Tom jokes 'life begins at 40' teasingly). Janny caught Bill ('My best wishes to the conqueror'), so Janny and Bill are engaged or married. Mac wrote and offered tobacco; Tom asks for pipes instead. 'Old money bags' and 'financial wizard' refer to John, Tom's financial adviser. 'The new Beck family' means John and Fran. Joe is a shipmate. Plink [?] asks about Tom. As pay officer, Tom carried $1,685 to pay the crew; he left $540 on the books for a 30-day leave next year and some for Mari. The enclosed check is the Norfolk-Houston travel allowance. He cut open his shoes for the heat. Izzy is 'hunting' (romantically).",

   "body": "\n[--- 1943-08-31_tom-to-mother_p01.jpg ---]\n\n                                                  August 31, 1943\nDear Mother,\n     Another month has flown by and that probably means something although I\ndon't know just what. I think what makes the days go so fast is that I seldom\nknow the day or the date. There are no week ends and that makes a big\ndifference. Joe and I often argue about the date and I have missed as high as\nfour and five days.\n\n     August was a big month for you. Getting a daughter and having a birthday.\nDo you feel any older now? You know life begins at 40 so when I get home I'll\nexpect you to help me let the county know. Start hoarding the red paint.\n\n     It looks like I was all wet when I disputed you judgement about the\nsuccession of the matrimonial line.\n\n[--- 1943-08-31_tom-to-mother_p02.jpg (marked \"-2-\") ---]\n\nI thought Bill had more resistance than that. On second thought, it would take\na lot once Janny has her mind set. My best wishes to the conquerer.\n\n     The enclosed item is to be forwarded to that financial wizard, my adviser,\nfor disposal. It is up to him as to the best way to get rid of it. That is what\nI am paying for. Of course his compensation depends directly upon the results.\nOne big reason he has the job is that in my study of higher economics I\nremember only one law - the law of diminishing returns.\n\n     Mac was sweet to me and wrote a letter. I really appreciated it and he was\nthe only member of the family that I haven't corresponded with before. Betty\nhas been very good in writing\n\n[--- 1943-08-31_tom-to-mother_p03.jpg ---]\n\nto me but I guess I yelled too loud at John so he broke down. I also expect a\nfew letters from the new Beck family. I am away off the subject I started on.\nMac offered to send me more tobacco but that isn't necessary. While living off\nthe Army we received every thing. When they issued rations it includes not\nonly food but toilet articles, candy, [crossed out] tobacco (cigarettes, pipe,\nchewing, makings for roll your own). I have about 15 tins of pipe tobacco now.\nBesides I can't buy plenty here and it is cheaper. But, pipes are scarce. So\ntell old money bags to dig deep and if I have a few dollars left to buy a\ncouple of pipes. Mac is a good judge of pipes. If he needs a letter to mail\nthem let me know and I will have one typed.\n     It really give me a grand\n\n[--- 1943-08-31_tom-to-mother_p04.jpg (marked \"4\"; top line partly cut off) ---]\n\nfeeling to hear that Plink [?] asks about me. I am not sure if I told you this\nbefore and if so I shall repeat. I have often thought of asking for his address\nbut the length of time it would take for a letter to get to him and back here\nseems to make writing foolish. If you can get his address please send it to me\nbecause some day I will probably change my mind. I wrote to Henry a couple of\nmonths ago and haven't received an answer yet.\n\n     Today was pay day and I went ashore to get the money for the crew. I did\nthat the first thing in the morning and then spend the rest of the day touring\naround trying to get a few things. I had an uneasy feeling all the time and\nwas relieved when I paid the men and everything checked. I was carrying\n$1685.00. Thank God\n\n[--- 1943-08-31_tom-to-mother_p05.jpg (marked \"5\") ---]\n\nI am not a disbursing officer. I left $540 on the books and don't intend to\ndraw it until it is necessary. I will need some for mess bill at the end of\nOctober. The rest is for you and me to spend on that 30 day leave I will get\nnext year. I might save some for Mari - a dollar or two. The check is for\ntravel between Norfolk & Houston.\n\n     I went native and cut the toes and sides out of a pair of shoes. My\n[crossed out] toes now resemble my nose in color - red as a beet and about ten\ntimes as sore. The shoes are good for rainy weather as the rain can drain out\nof them now.\n\n     Tell Izzy I send my sympathy and also I wish her the best of luck in\nhunting this season or is there any season on the game she is stalking.\n\n     Business & health as usual here.\n                                        Love,\n                                             Tom\n\n[Written at bottom left:] BECK, T.F. ENS.\n",

   "location": "South Pacific, aboard USS LCI(L) 62",

   "notes": "A quiet Sunday with Tom reading a book. A 'movie boat' visits. War news: the Allies have landed in Europe (Italy, Sept. 3, 1943), and the Japanese are retreating island by island ('mass cross-island run to Tokyo'). School starts at home in two days, and Mother's garden harvest and canning are coming. 'Pardon the envelope' suggests something unusual about the envelope, which was not scanned. The letter contains wartime slurs, transcribed as written.",

   "body": "\n[--- 1943-09-05_tom-to-mom_p01.jpg ---]\n\n                                                  Sept. 5, '43\nDear Mom,\n     To-day is Sunday and for once I took advantage of it. Worked for awhile\nthis morning but took a few hours off in the afternoon to read a book. I always\nhave a guilty feeling when I read or write letters during the day - don't even\nlike to wash clothes on \"company time.\" There are days when I am not busy and\nI spend the time looking for work. Of course there are plenty of days like\nto-morrow when I am busy from dawn to dusk. But that is life.\n\n     We have been fortunate the last few days - the movie boat has been\nstopping here. I very seldom attend - haven't gotten used to the Navy theaters\nwhere there is standing room only in selected spots where\n\n[--- 1943-09-05_tom-to-mom_p02.jpg (marked \"-2-\") ---]\n\nit is impossible to see or hear. My feet and neck always bother me after an\nevenings entertain at the theater. I am content to stay aboard and let the\nother men go.\n\n     The news to-night was good. The boys are finally in Europe and I hope the\nkeep moving fast. The Japs are beginning to believe it is worthwhile to shoot\nand run to live to shoot another day. That other day is going to be a tough\none for us. At least we have them running. It would be nice if those who ran\nwould explain the simplicity and the finer points of the act to the other\nJaps and there by create a mass cross-island run to Tokyo where we will be\nable to get them all at once. Anyway it is a pleasant thought. Contrary to\nPublic Opinion the Japs are smart.\n\n[--- 1943-09-05_tom-to-mom_p03.jpg (marked \"-3-\") ---]\n\n     It hardly seems possible that the day after to-morrow school will start\nagain. The summer really flew by, at least it did for me. It seems like only\nlast week you were writing about the spring rains and its effect on the\ngardens. I suppose you will start harvesting soon. When the harvest starts you\ndays will be full and I hope the basement will be likewise. I also remember\nthe comments about the cold weather which will be with you soon again.\n\n     Haven't had mail for a few days so I can't stretch this letter any longer.\nMy topics come mainly from your letters.\n\n     All personal subjects have remained unchanged.\n                                        Love to all,\n                                             Tom\n\n[Printed at lower left:] Pardon the envelope; just my brain working over time.\n[Written at bottom left:] Beck, T.F., ENS.\n",

   "body": "\n[--- 1943-09-09_tom-to-mom_p01.jpg ---]\n\n                                                  Sept. 9 - 43\nDear Mom,\n     It has only been a couple of days since I last wrote and the intervening\ndays have produced nothing new. I am so accustomed to say that that it is\nautomatic and this time it isn't quite true.\n\n     Last evening just as I was sitting down to a good old fashion Navy meal -\nbeans, I had a visitor. I didn't recognize the man at first but I knew that\nthere was only one officer out here that I knew, that is outside of the\nFlotilla. It was Geo. W. He has either grown at lot or I had forgotten how\nlarge he was.\n\n[--- 1943-09-09_tom-to-mom_p02.jpg ---]\n\nI know he didn't gain any after eating our beans. We talked for awhile and then\ndecided to go to the movies - he had to take that boat back to the beach any\nway. That boat never stopped but he caught a later one. I was supposed to meet\nhim to-day but the boat never showed up. I went to the movies to-night in hopes\nof seeing him but no luck. I will try again to-morrow. In case Isabel is\ninterested, he asked how she was.\n\n     The movie to-night was excellent. It wasn't a top ranking one but [it]\nwas too bad. The only thing I objected to was that the sound machine didn't\nwork all the time. Twice I heard about\n\n[--- 1943-09-09_tom-to-mom_p03.jpg (marked \"-3\") ---]\n\nfive word. It was just like an old silent job only it didn't have the\nconversations cluttering up the screen. The short was a musical and also silent\nexcept for the last song which was a South Sea Island hula - beautiful women,\netc. It is quite ironical.\n\n     Of course the main topic of conversation now is Italy's action. It\nnaturally brought new hopes to us as we all think that her surrender will\nshorten the war. Italy's step and the progress in New Guinea (sp) has put us\nall in good spirits.\n\n     A little over a week ago a trainee officer came aboard. He is training for\nthe LCI's but we don't know whose relief he is. I am fairly\n\n[--- 1943-09-09_tom-to-mom_p04.jpg ---]\n\nsure he isn't mine. His name is Jim Hoffman and comes from Cleveland. Otherwise\nI know very little about him.\n\n     Your mail hasn't been coming through lately but expect it any day. Had a\nletter from Florella and she mentioned some wedding pictures you were planning\nto send. I imagine they are in the mail and will arrive soon.\n\n     We had a discussion the other night about proof reading our own letters.\nOne said if a letter is worthwhile the time it should be done properly. So for\nonce I reread my letter to you and have decided you have to put up with a lot\nwhen you read them. I think they are very dull and refuse to read any more.\nWill leave that up to you.\n                                        Love,\n                                             Tom\n\n[Written at bottom left:] Ens. Thos. F. Beck\n",

   "id": "1943-09-15_tom-to-mother-sweetheart",
   "title": "Tom to 'Sweetheart' - almost certainly Mother (playful greeting)",
   "written_by": "Tom",
   "written_to": "'Sweetheart' - almost certainly Mother (playful greeting)",
   "by_tom": true,
   "date": "1943-09-15",

   "complete": true,
   "notes": "The recipient is almost certainly Mother despite the 'Hiya Sweetheart' greeting: it references her recent birthday party ('Don't start grabbing for a cane') and her vacation, matching the 1943-08-31 letter, and invites her to keep house for him near a stateside shipyard ('the life of a Navy wife'). Mother vacationed at Ocean City and is considering Butler or Florida for the winter. Plans for the crew's relief have been dropped until about the first of the year; relieved men usually go to new construction (as Don W. is doing now). Geo. W. suggested a party with Isabel and 'the Dick Becks' (so Dick Beck is a relative, perhaps the Dick of the Dick & Betty wedding, 1942-07-18).",

   "body": "\n[--- 1943-09-15_tom-to-mother-sweetheart_p01.jpg ---]\n\n                                                  Wednesday Evening\n                                                  Sept. 15, 1943\nHiya Sweetheart,\n     Received your letter from Ocean City a few days ago and this is my first\nchance to answer it. I was quite glad to hear that you finally took a\nvacation. It is nice that you liked the resort and it sounded like you were\nhaving an excellent time. No doubt the rest was good for you.\n\n     Once before you mentioned considering moving to Butler for the winter. Is\nthat still your plan or are you also thinking of Florida. You would be wise to\ndo just as you please and don't [crossed out] let other people influence you.\n\n[--- 1943-09-15_tom-to-mother-sweetheart_p02.jpg (marked \"-2\") ---]\n\n     What I have to say now is just wishful thinking and for heavens sake\ndon't make any plans. There has been a change in the plans for our relief and\nthe whole thing has been dropped for the present. It may come into effect\nagain by the first of the year and that is what we will consider. Most men\nthat do get relief get new construction, like when I was in Houston and what\nDon W. is doing now. Anyway, it will take a few months at some shipyard and if\nit is down South you could keep house for me, probably will be a hotel room.\nThe invitation still goes for the North if you don't mind the cold weather.\nIt sums up to this - when I get home I expect to be in and near the states\nfor a few months and if you [crossed out: thing] think\n\n[--- 1943-09-15_tom-to-mother-sweetheart_p03.jpg ---]\n\nyou would care for the life of a Navy wife every thing will be o.k. As I said\nbefore it is wishful thinking.\n\n     Your birthday party must have been swell. That is one other event I\nregret missing. Don't start grabbing for a cane for another year or so. We\nhave a lot to do and can't be bother with a cane.\n\n     Saw Geo. W. again but not for a few days. Hope he is still around so I can\nvisit him occasionally. He mentioned that when we get home we will have a\nparty with Isabel and the Dick Becks. They were all that he included.\n\n     I will close now and save my usual unnecessary remarks for the next\nletter.\n                                        Love,\n                                             Tom\n\n[Written at bottom left:] Ens. Thos. F. Beck\n",

   "body": "\n[--- 1943-09-23_tom-to-mother_p01.jpg ---]\n\n                                                  Sept. 23-43\nDear Mother,\n     The mail situation is still fouled up so it is hard to write. I haven't\nany thing definate in mind now so shall start and come what may.\n\n     Received a card from Luke & Lena to-day marked the 12th [crossed out] that\nis good time for deliveries out here. Also heard some mail was lost which may\nexplain the slim mail calls.\n\n     I have always said that I didn't need any thing out here. I have changed\nmy mind. My slippers are finally giving out and I can't get any here. So if\nyou will please send me a pair, preferably leather, size 10 1/2. We will\nconsider it Christmas.\n\n     Some of the men went to a show to-night - put on by the\n\n[--- 1943-09-23_tom-to-mother_p02.jpg ---]\n\nArmy. The reports are quite favorable and if it is given to-morrow night I\nthink I will attend. It will be something different.\n\n     You can't guess what I had to-day. Went ashore and discovered the canteen\nwas selling ice-cream. It was the first I had for a long time. I only had two\ncups of it - if the line hadn't been so long I think I would have eaten much\nmore - no doubt too much. It really tasted swell.\n\n     Sorry the letter is so short but I can't help it. Anyway I am still\nthinking of you and am letting you know I am still ok.\n                                        Love,\n                                             Tom\n\nTell Marge I received a letter from her friend Thos. Lipinski.\n\n[Written at bottom left:] Ens Thos. F. Beck\n",
